<style>
  html, body { margin: 0; padding: 0; background: #08150a; height: 100%; overscroll-behavior: none; }
  #root { position: fixed; inset: 0; }
  #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: #a7f3d0; font-family: system-ui, sans-serif; font-size: 14px; text-align: center; padding: 24px; background: #08150a; }
  #boot .spin { width: 36px; height: 36px; border: 3px solid #14532d; border-top-color: #6ee7b7; border-radius: 50%; animation: ltpSpin 1s linear infinite; }
  #boot .warn { max-width: 440px; line-height: 1.6; color: #fde68a; font-size: 13px; }
  #boot .warn b { font-size: 15px; }
  @keyframes ltpSpin { to { transform: rotate(360deg); } }
</style>

<body>
<div id="root"></div>
<div id="boot">
  <div class="spin"></div>
  <div id="ltp-status">🌾 Načítám louku…</div>
  <div style="max-width:400px;font-size:11px;color:#5b8a6b;line-height:1.5;margin-top:6px">Když se nic nedeje: otevři soubor v <b>prohlížeči</b> (Chrome / Safari), ne v náhledu WhatsApp ani správce souborů.</div>
</div>
<script>
  // 🛠 stavový řádek + panel s chybou - ať nikdy nevidíš jen "nic"
  function ltpStatus(m) { var e = document.getElementById("ltp-status"); if (e) e.textContent = m; }
  function ltpFail(title, detail) {
    var b = document.getElementById("boot");
    if (!b) { b = document.createElement("div"); b.id = "boot"; document.body.appendChild(b); }
    b.innerHTML = '<div class="warn" style="color:#fca5a5"><b>😕 ' + title + '</b><br><span style="color:#fde68a">' + detail + "</span></div>";
  }
  window.addEventListener("error", function (e) {
    var m = (e && e.message) || "";
    // ⚠️ banální hlášky prohlížeče nejsou pád hry: ResizeObserver hlásí Chrome na mobilu, "Script error." rozšíření
    if (m.indexOf("ResizeObserver") >= 0 || m === "Script error." || m.indexOf("Tainted") >= 0) return;
    // hra už běží - obrazovka pádu by jen přkrývala hraní, chyby směrujeme do konzole
    if (window.__ltpOK) return;
    if (document.getElementById("boot")) ltpFail("Hra spadla", m + " (řádek " + ((e && e.lineno) || "?") + ")");
  });
  // ⏰ hlídač - když se do 12 s nic nerozjede, řeknu čím to nejspíš je (náhled WhatsApp apod.)
  window.ltpWatch = setTimeout(function () {
    if (document.getElementById("boot") && document.getElementById("ltp-status")) {
      ltpFail("Tady se hra spustit nemůže", "Soubor je nejspíš otevřený v <b>náhledu</b> (WhatsApp, Telegram nebo správce souborů) — ty nespouští webové aplikace.<br><br>👉 Stáhni soubor a otevři ho v <b>prohlížeči</b>: Chrome, Safari nebo Edge.<br>Na Androidu: soubor → tři tečky ⋮ → „Otevřít v aplikaci“ → Chrome.");
    }
  }, 12000);
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" onerror="ltpFail('Chybí internet / náhled bez internetu','React se načítá z internetu. Náhled tady v panelu nemá internet — stáhni soubor a otevři ho v prohlížeči (Android/iPhone/PC) s připojením k internetu. První spuštění trvá pár sekund.')"></script>

<script src="https://cdn.tailwindcss.com" onerror="ltpFail('Chybí Tailwind','Bez něj se menu a tlačítka nezobrazí správně — zkontroluj připojení k internetu.')"></script>
<script>
  function ltpBoot() {
    if (typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined") {
      // knihovny se nenačtou = náhled bez internetu, nebo nejste online
      ltpFail("Chybí internet / náhled bez internetu", "Hra si při prvním spuštění stahuje React z internetu. Náhled tady v panelu internet nemá — stáhni soubor a otevři ho v prohlížeči (Android/iPhone/PC) s připojením k internetu.");
      return;
    }
    ltpStatus("⚙️ Překládám hru… (3–10 s, jen při prvním spuštění)");
    setTimeout(function () {
      try {
        var src = document.getElementById("ltp-src").textContent;
        var out = Babel.transform(src, {
          filename: "game.tsx",
          presets: [
            [Babel.availablePresets["typescript"], { isTSX: true, allExtensions: true }],
            [Babel.availablePresets["react"], { runtime: "classic" }]
          ]
        }).code;
        ltpStatus("🌱 Louka roste…");
        var s = document.createElement("script");
        s.textContent = out;
        document.body.appendChild(s);
      } catch (err) {
        ltpFail("Chyba při překladu hry", ((err && (err.message || String(err))) || "?") + " — napiš mi tuhle hlášku, opravím to.");
      }
    }, 60);
  }
  window.addEventListener("load", ltpBoot);
</script>

// 🧮 výdrž turetek inženýra: 200 základ + 100 za KAŽDÝ odebraný upgrade turetek
// (nový druh, plameny/vítr/mráz, kadence, ráže - vše se počítá)
function turretHp(g: Game): number {
  let n = g.tKinds.length - 1; // počet odemčených druhů nad standard
  if (g.tcfg.flame) n += 1;
  if (g.tcfg.wind) n += 1;
  if (g.tcfg.frost) n += 1;
  // opakovatelné upgrady kadence/ráže: každé z nich násobí hodnotu 1,6× od základu
  // počet kroků = kolikkrát se od základu 1,6 násobilo (řešeno pomocí logaritmu)
  const steps = (cur: number, base: number): number => Math.max(0, Math.round(Math.log(cur / base) / Math.log(1.6)));
  n += steps(g.tcfg.fire, 2.2);
  n += steps(g.tcfg.dmg, 6);
  return 200 + n * 100;
}

function hsla(h: number, s: number, l: number, a: number): string {
  // 🚀 memoizace - hsla řetězce se skládají tisíckrát za frame, cache je vrátí z paměti
  const key = `${h}|${s}|${l}|${a}`;
  let v = HSLA_CACHE[key];
  if (v === undefined) {
    v = `hsla(${h}, ${s}%, ${l}%, ${a})`;
    HSLA_CACHE[key] = v;
  }
  return v;
}
const HSLA_CACHE: Record<string, string> = {};

// --- sprite cache pro orby ---

const ORB_SPRITE_R = 12;
let orbSprites: Map<number, HTMLCanvasElement> | null = null;

function getOrbSprite(hue: number): HTMLCanvasElement {
  if (!orbSprites) orbSprites = new Map();
  const bucket = (((Math.round(hue / 30) * 30) % 360) + 360) % 360;
  let c = orbSprites.get(bucket);
  if (!c) {
    const hr = ORB_SPRITE_R * 2.6;
    const size = Math.ceil(hr * 2);
    c = document.createElement("canvas");
    c.width = size;
    c.height = size;
    const sctx = c.getContext("2d");
    if (sctx) {
      const halo = sctx.createRadialGradient(hr, hr, 0, hr, hr, hr);
      halo.addColorStop(0, hsla(bucket, 95, 74, 1));
      halo.addColorStop(0.28, hsla(bucket, 95, 62, 0.42));
      halo.addColorStop(1, hsla(bucket, 95, 60, 0));
      sctx.fillStyle = halo;
      sctx.fillRect(0, 0, size, size);
      sctx.fillStyle = hsla(bucket, 100, 84, 1);
      sctx.beginPath();
      sctx.arc(hr, hr, ORB_SPRITE_R, 0, Math.PI * 2);
      sctx.fill();
    }
    orbSprites.set(bucket, c);
  }
  return c;
}

function dist2(ax: number, ay: number, bx: number, by: number): number {
  const dx = ax - bx;
  const dy = ay - by;
  return dx * dx + dy * dy;
}

// 🧙‍♂️ úsečka (x1,y1)-(x2,y2) vs kruh (cx,cy,r) - swept kolize projektilů proti tunelování:
// při větším dt projektil nesmí nepřátela přeskočit jen proto, že testujeme koncový bod
function segHit(x1: number, y1: number, x2: number, y2: number, cx: number, cy: number, r: number): boolean {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  let t = len2 > 0 ? ((cx - x1) * dx + (cy - y1) * dy) / len2 : 0;
  if (t < 0) t = 0;
  else if (t > 1) t = 1;
  const qx = x1 + dx * t - cx;
  const qy = y1 + dy * t - cy;
  return qx * qx + qy * qy < r * r;
}

// 🕸️ PROSTOROVÁ MŘÍŽKA nepřátel - přestavuje se každý snímek; kolize pak běží jen mezi
// sousedními buňkami místo O(n²) přes všechny příšery (klíčové pro plynulost v endgame)
const GRID_CELL = 160;
const GRID_N = Math.ceil(ARENA / GRID_CELL) + 1; // počet buněk na osu
const GRID_STRIDE = GRID_N + 1;
const GRID: Map<number, Enemy[]> = new Map();
function gridKey(x: number, y: number): number {
  const cx = Math.min(GRID_N - 1, Math.max(0, Math.floor(x / GRID_CELL)));
  const cy = Math.min(GRID_N - 1, Math.max(0, Math.floor(y / GRID_CELL)));
  return cx * GRID_STRIDE + cy;
}
function buildGrid(g: Game): void {
  GRID.clear();
  for (const e of g.enemies) {
    if (e.dead) continue;
    const k = gridKey(e.x, e.y);
    const arr = GRID.get(k);
    if (arr) arr.push(e);
    else GRID.set(k, [e]);
  }
}
// projde všechny nepřátele v okruhu r kolem (x, y) - včetně sousedních buněk
function gridEach(x: number, y: number, r: number, cb: (e: Enemy) => void): void {
  const c = GRID_CELL;
  const x0 = Math.max(0, Math.floor((x - r) / c));
  const x1 = Math.min(GRID_N - 1, Math.floor((x + r) / c));
  const y0 = Math.max(0, Math.floor((y - r) / c));
  const y1 = Math.min(GRID_N - 1, Math.floor((y + r) / c));
  for (let cx = x0; cx <= x1; cx++) {
    for (let cy = y0; cy <= y1; cy++) {
      const arr = GRID.get(cx * GRID_STRIDE + cy);
      if (!arr) continue;
      for (let i = 0; i < arr.length; i++) cb(arr[i]);
    }
  }
}

const ARROW_POOL: Arrow[] = [];

function arrowNew(): Arrow {
  const a = ARROW_POOL.pop() || { x: 0, y: 0, vx: 0, vy: 0, dmg: 0, pierce: 0, crit: false, life: 0, hits: [], kind: 0, knock: 0, chain: 0, expl: false, frost: false, lvl: 1 };

function burst(g: Game, x: number, y: number, n: number, hue: number, speed = 130): void {
  if (g.particles.length > 140) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = speed * (0.3 + Math.random());
    const life = 0.35 + Math.random() * 0.55;
    const p = PART_POOL.pop() || { x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 0, r: 0, hue: 0 };
    p.x = x;
    p.y = y;
    p.vx = Math.cos(a) * v;
    p.vy = Math.sin(a) * v;
    p.life = life;
    p.maxLife = life;
    p.r = 1.5 + Math.random() * 2.5;
    p.hue = hue;
    g.particles.push(p);
  }
}

function damageTurret(g: Game, tu: Turret, dmg: number): void {
  tu.hp -= dmg;

    const idx = g.turrets.indexOf(tu);
    if (idx >= 0) g.turrets.splice(idx, 1);

  }
}

// 🔊 ZVUKOVÝ ENGINE - vše syntetizované přes Web Audio API, žádné soubory, tlačítko mute v pauze
let AC: AudioContext | null = null;
let noiseBuf: AudioBuffer | null = null;
let ambBuf: AudioBuffer | null = null;
let masterOut: GainNode | null = null;
// 🎚 hlasitost master kanálu (0–1) - posuvník v pauze, ukládá se do mety
let masterVol = 1;
function setMasterVol(v01: number): void {
  masterVol = Math.max(0, Math.min(1, v01));
  if (masterOut) masterOut.gain.value = 0.9 * masterVol;
}
// 🚦 každý častý zvuk má vlastní branku, ať se překrývání neslepí v kakofonii
const sfxGateOf: Record<string, number> = {};

// 🎚 společný master kanál s kompresorem - exploze a salvy nepřefleknou výstup
function audioOut(): GainNode {
  if (!masterOut) {
    masterOut = AC!.createGain();
    masterOut.gain.value = 0.9 * masterVol;
    const comp = AC!.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.ratio.value = 6;
    masterOut.connect(comp);
    comp.connect(AC!.destination);
  }
  return masterOut;
}

function playSfx(g: Game, name: string): void {
  if (!g.opts.snd) return;
  try {
    if (typeof AudioContext === "undefined") return;
    if (!AC) AC = new AudioContext();
    if (AC.state === "suspended") void AC.resume();
    // frekventované zvuky se tlumí per název (výstřely, zásahy, exploze, kombo...)
    const gateMs: Record<string, number> = { shoot: 70, hit: 70, crit: 90, swing: 110, freeze: 130, boom: 190, combo: 140, elite: 260, orb: 60, hurt: 90 };
    const gm = gateMs[name];
    const nw = performance.now();
    if (gm !== undefined) {
      if (nw - (sfxGateOf[name] ?? 0) < gm) return;
      sfxGateOf[name] = nw;
    }
    const t0 = AC.currentTime;
    const tone = (type: OscillatorType, f0: number, f1: number, dur: number, delay = 0, peak = 0.12) => {
      const o = AC!.createOscillator();
      const gg = AC!.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t0 + delay);
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + delay + dur);
      gg.gain.setValueAtTime(0.0001, t0 + delay);
      gg.gain.linearRampToValueAtTime(peak, t0 + delay + 0.008);
      gg.gain.exponentialRampToValueAtTime(0.0001, t0 + delay + dur);
      o.connect(gg);
      gg.connect(audioOut());
      o.start(t0 + delay);
      o.stop(t0 + delay + dur + 0.02);
    };
    const noise = (dur: number, peak = 0.1, f = 800) => {
      if (!noiseBuf) {
        noiseBuf = AC.createBuffer(1, 4410, 44100);
        const dch = noiseBuf.getChannelData(0);
        for (let i = 0; i < dch.length; i++) dch[i] = Math.random() * 2 - 1;
      }
      const src = AC.createBufferSource();
      src.buffer = noiseBuf;
      const flt = AC.createBiquadFilter();
      flt.type = "lowpass";
      flt.frequency.setValueAtTime(f, t0);
      const gg = AC.createGain();
      gg.gain.setValueAtTime(peak, t0);
      gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(flt);
      flt.connect(gg);
      gg.connect(audioOut());
      src.start(t0);
      src.stop(t0 + dur + 0.02);
    };
    switch (name) {
      case "shoot": tone("triangle", 660, 220, 0.07, 0, 0.05); break;
      case "swing": noise(0.11, 0.06, 1900); tone("sine", 230, 90, 0.09, 0, 0.035); break;
      case "magnet": tone("square", 180, 420, 0.1, 0, 0.055); tone("square", 300, 520, 0.09, 0.08, 0.045); break;
      case "fanfare": tone("triangle", 392, 392, 0.14, 0, 0.11); tone("triangle", 523, 523, 0.14, 0.12, 0.11); tone("triangle", 659, 659, 0.14, 0.24, 0.12); tone("sine", 784, 784, 0.34, 0.36, 0.13); break;
      case "hit": tone("square", 300, 130, 0.05, 0, 0.04); break;
      case "kill": tone("sine", 520, 90, 0.12, 0, 0.09); break;
      case "crit": tone("sine", 880, 220, 0.12, 0, 0.1); tone("sine", 1320, 330, 0.1, 0.02, 0.07); break;
      case "hurt": tone("sawtooth", 180, 60, 0.22, 0, 0.13); noise(0.12, 0.06, 500); break;
      case "levelup": tone("sine", 523, 523, 0.1, 0, 0.1); tone("sine", 659, 659, 0.1, 0.09, 0.1); tone("sine", 784, 784, 0.16, 0.18, 0.11); break;
      case "boss": tone("sawtooth", 110, 55, 0.6, 0, 0.16); tone("sawtooth", 165, 82, 0.6, 0.05, 0.1); break;
      case "night": tone("sine", 392, 392, 0.25, 0, 0.1); tone("sine", 311, 311, 0.3, 0.22, 0.09); break;
      case "day": tone("sine", 311, 311, 0.2, 0, 0.09); tone("sine", 392, 392, 0.28, 0.18, 0.1); break;
      case "ding": tone("sine", 1046, 1046, 0.09, 0, 0.09); tone("sine", 1568, 1568, 0.12, 0.07, 0.07); break;
      case "ult": tone("sawtooth", 130, 520, 0.3, 0, 0.12); noise(0.25, 0.08, 900); break;
      case "boom": noise(0.4, 0.16, 420); tone("sine", 120, 40, 0.35, 0, 0.12); break;
      case "turret": tone("square", 330, 330, 0.06, 0, 0.05); tone("square", 494, 494, 0.08, 0.06, 0.05); break;
      case "weather": tone("sine", 233, 466, 0.4, 0, 0.08); break;

// ✂️ rejstřík živých hudebních hlasů - při přepnutí tracku se tvrdě střihnou, nic nedoznívá do nové skladby
let musLive: (OscillatorNode | AudioBufferSourceNode)[] = [];
function musTrackVoice(node: OscillatorNode | AudioBufferSourceNode): void {
  musLive.push(node);
  node.onended = () => {
    const i = musLive.indexOf(node);
    if (i >= 0) musLive.splice(i, 1);
  };
}
function cutMusic(): void {
  for (const n of musLive) {
    try {
      n.stop();
    } catch {
      // už dozněl - nevadí
    }
  }
  musLive.length = 0;
}
function musicNote(type: OscillatorType, f: number, t: number, dur: number, peak: number): void {
  const o = AC!.createOscillator();
  musTrackVoice(o);
  const gg = AC!.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  gg.gain.setValueAtTime(0.0001, t);
  gg.gain.linearRampToValueAtTime(peak, t + 0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gg);
  gg.connect(audioOut());
  o.start(t);
  o.stop(t + dur + 0.02);
}

function musicDrum(t: number, dur: number, peak: number, f: number): void {
  if (!noiseBuf) {
    noiseBuf = AC!.createBuffer(1, 4410, 44100);
    const dch = noiseBuf.getChannelData(0);
    for (let i = 0; i < dch.length; i++) dch[i] = Math.random() * 2 - 1;
  }
  const src = AC!.createBufferSource();
  musTrackVoice(src);
  src.buffer = noiseBuf;
  const flt = AC!.createBiquadFilter();
  flt.type = "lowpass";
  flt.frequency.setValueAtTime(f, t);
  const gg = AC!.createGain();
  gg.gain.setValueAtTime(peak, t);
  gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(flt);
  flt.connect(gg);
  gg.connect(audioOut());
  src.start(t);
  src.stop(t + dur + 0.02);
}

// 💓 tlukot srdce - hluboký buch (sine propad frekvence), sílí s klesajícím HP
function musicThump(t: number, peak: number): void {
  const o = AC!.createOscillator();
  musTrackVoice(o);
  const gg = AC!.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(88, t);
  o.frequency.exponentialRampToValueAtTime(27, t + 0.13);
  gg.gain.setValueAtTime(peak, t);
  gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
  o.connect(gg);
  gg.connect(audioOut());
  o.start(t);
  o.stop(t + 0.2);
}

// 🌦️ AMBIENT POČASÍ - tichá šumová smyčka deště/bouře, vítr se pravidelně rozvíjí a ztiší
let ambSrc: AudioBufferSourceNode | null = null;
let ambGain: GainNode | null = null;
let ambKind = "";
let ambLfo: OscillatorNode | null = null;

function ambTick(g: Game): void {
  const want = g.opts.snd && g.running && !g.over && !g.paused && !g.userPaused && g.weather !== "" && typeof AudioContext !== "undefined" ? g.weather : "";
  if (want === ambKind) return;
  ambKind = want;
  if (ambSrc) {
    try {
      ambSrc.stop();
    } catch {
      // už zastavený
    }
    ambSrc = null;
    ambGain = null;
    // zastavíme i kmitočet houpání větru - jinak by oscilátor únikem běžel dál
    if (ambLfo) {
      try {
        ambLfo.stop();
      } catch {
        // už zastavený
      }
      ambLfo = null;
    }
  }
  if (!want || !AC) return;
  if (!ambBuf) {
    ambBuf = AC.createBuffer(1, 44100, 44100);
    const d = ambBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  ambSrc = AC.createBufferSource();
  ambSrc.buffer = ambBuf;
  ambSrc.loop = true;
  const flt = AC.createBiquadFilter();
  flt.type = want === "wind" ? "bandpass" : "lowpass";
  flt.frequency.value = want === "rain" ? 900 : want === "storm" ? 650 : 480;
  ambGain = AC.createGain();
  ambGain.gain.value = want === "storm" ? 0.03 : want === "rain" ? 0.02 : 0.014;
  if (want === "wind") {
    // pomalé houpání síly větru
    const lfo = AC.createOscillator();
    const lg = AC.createGain();
    lfo.frequency.value = 0.28;
    lg.gain.value = 0.008;
    lfo.connect(lg);
    lg.connect(ambGain.gain);
    lfo.start();
    ambLfo = lfo;
  }
  ambSrc.connect(flt);
  flt.connect(ambGain);
  ambGain.connect(audioOut());
  ambSrc.start();
}

// 🎤 ZPÍVÁNÍ - syntetický hlas zazpívá texty překvapení (Web Speech API, britština jako v originále)
let voxOn = false;
// 📻 konkrétní anglický hlas - hlasy se na mobilu načítají asynchronně, bez čekání by zpěv neměl čím zaznít
let voxVoice: SpeechSynthesisVoice | null = null;
function voxPick(): void {
  try {
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return;
    voxVoice =
      vs.find((v) => /^en[-_]GB/i.test(v.lang)) ||
      vs.find((v) => /^en[-_]/i.test(v.lang)) ||
      vs.find((v) => /en/i.test(v.lang)) ||
      vs.find((v) => /Google|Natural/i.test(v.name)) ||
      vs[0] ||
      null;
  } catch {
    // hlasy nedostupné - nevadí
  }
}
if (typeof speechSynthesis !== "undefined") {
  voxPick();
  try {
    speechSynthesis.addEventListener("voiceschanged", voxPick);
  } catch {
    // starší prohlížeč bez voiceschanged - nevadí
  }
}
function stopVox(): void {
  if (voxOn && typeof speechSynthesis !== "undefined") {
    try {
      speechSynthesis.cancel();
      // ⚠️ Android umí po cancel nechat hlas viset - resume ho uvolní
      speechSynthesis.resume();
    } catch {
      // hlas nedostupný - nevadí
    }
  }
  voxOn = false;
  // 🤖 robotí vokál se při pauze / přepnutí tracku taky střihne
  cutVoxSynth();
}
// 🔓 odemknutí řeči přímo v gestě klepnutí - mobily povolí speak jen z právě proběhlého dotyku
function warmVox(): void {
  if (typeof speechSynthesis === "undefined") return;
  try {
    voxPick();
    speechSynthesis.cancel();
    const w = new SpeechSynthesisUtterance(" ");
    w.volume = 0;
    speechSynthesis.speak(w);
  } catch {
    // hlas nedostupný - hraje se jen hudba
  }
}
// 🤖 ROBOTÍ VOKÁL - garantovaný zpěv přímo ve zvukovém enginu: formantový hlas zazpívá
// slabiky textu na melodii linky. Na mobilu často chybí hlasová syntéza (TTS) - tahle
// cesta je čistě Web Audio, takže Rimmer zazpívá vždycky, i když TTS mlčí.
let ttsWorks = false; // jakmile skutečné TTS poprvé promluví, robot ustoupí a zpívají slova
let voxSynthLive: OscillatorNode[] = [];
function voxSynthTrack(node: OscillatorNode): void {
  voxSynthLive.push(node);
  node.onended = () => {
    const i = voxSynthLive.indexOf(node);
    if (i >= 0) voxSynthLive.splice(i, 1);
  };
}
function cutVoxSynth(): void {
  for (const n of voxSynthLive) {
    try {
      n.stop();
    } catch {
      // už dozněl - nevadí
    }
  }
  voxSynthLive.length = 0;
}
// 🧮 text se rozloží na slabiky (skupiny samohlásek) - každou zazpívá jedna nota linky
function voxSyllables(line: string): string[] {
  const words = line
    .toLowerCase()
    .replace(/[^a-z' ]/g, "")
    .split(/\s+/)
    .filter(Boolean);
  const out: string[] = [];
  for (const w of words) {
    const groups = w.match(/[bcdfghjklmnpqrstvwxyz]*[aeiouy]+[bcdfghjklmnpqrstvwxyz]*/g);
    if (groups && groups.length) out.push(...groups);
    else out.push(w);
  }
  return out;
}
// 🗣 formanty samohlásek (F1/F2) - podle samohlásky ve slabice zní "á", "í", "ó"...
const VOX_FORMANTS: Record<string, [number, number]> = {
  a: [730, 1090],
  e: [530, 1840],
  i: [300, 2290],
  o: [570, 840],
  u: [320, 800],
  y: [730, 1090],
};
// 🗣 jedna slabika - pila se dvěma formantovými filtry + vibrato = "lá lá" jako zpěv
function voxNote(f: number, t: number, dur: number, vw: string): void {
  if (!AC) return;
  try {
    const fm = VOX_FORMANTS[vw] || VOX_FORMANTS.a;
    const o = AC.createOscillator();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(f, t);
    // 🎵 vibrato - bez něho by to znělo jako siréna
    const lfo = AC.createOscillator();
    lfo.frequency.value = 5.2;
    const lfoG = AC.createGain();
    lfoG.gain.value = f * 0.013;
    lfo.connect(lfoG);
    lfoG.connect(o.frequency);
    // 🗣 dva úzké pásmové filtry na formantech - z pily se stane otevřená ústa
    const f1 = AC.createBiquadFilter();
    f1.type = "bandpass";
    f1.frequency.value = fm[0];
    f1.Q.value = 5;
    const f2 = AC.createBiquadFilter();
    f2.type = "bandpass";
    f2.frequency.value = fm[1];
    f2.Q.value = 8;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.075, t + 0.035);
    g.gain.setValueAtTime(0.075, t + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f1);
    o.connect(f2);
    f1.connect(g);
    f2.connect(g);
    g.connect(audioOut());
    o.start(t);
    o.stop(t + dur + 0.03);
    lfo.start(t);
    lfo.stop(t + dur + 0.03);
    voxSynthTrack(o);
    voxSynthTrack(lfo);
  } catch {
    // zvuk nedostupný - nevadí
  }
}
// 🎼 celá řádka - slabiky textu se zazpívají rovnoměrně na noty melodické linky,
// refrén o kvintu výš, verš níž - hlas drží s melodií písničky
function synthVox(line: string, li: number, song: Song, t: number, stepDur: number): void {
  const syl = voxSyllables(line);
  if (!syl.length || !song.lead) return;
  const mul = li >= 3 ? 0.75 : 0.5;
  const notes: number[] = [];
  for (let j = 0; j < 16; j += 2) {
    const f = song.lead[li * 16 + j];
    if (f) notes.push(f * mul);
  }
  if (!notes.length) return;
  const per = (stepDur * 16) / syl.length;
  for (let k = 0; k < syl.length; k++) {
    const nf = notes[Math.min(notes.length - 1, Math.floor((k * notes.length) / syl.length))];
    const vw = syl[k].match(/[aeiouy]/);
    voxNote(nf, t + k * per, Math.min(per * 0.9, 0.42), vw ? vw[0] : "a");
  }
}
// 🎤 ZPĚV RIMMERA - na každé řádce písničky se zazpívá její text a když písnička dojede
// na konec, zpěv se točí znovu od začátku (spolu s hudbou, dokola). Zpívají dva hlasy:
// robotí vokál (zazní vždy) a pokud má prohlížeč hlasovou syntézu, i skutečná slova -
// jakmile TTS poprvé promluví, robot ustoupí.
function singLine(song: Song, li: number, t: number, stepDur: number): void {
  const line = song.lyrics ? song.lyrics[li] : "";
  if (!line) return;
  // 🤖 robotí vokál - rezerva, která zazní i bez hlasové syntézy
  if (!ttsWorks) synthVox(line, li, song, t, stepDur);
  if (typeof speechSynthesis === "undefined") return;
  try {
    if (!speechSynthesis.getVoices().length && !voxVoice) return;
    speechSynthesis.cancel();
    speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(line);
    u.lang = "en-GB";
    if (voxVoice) u.voice = voxVoice;
    // 🎵 verse níž, refrén výš - hlas drží s melodií, tempo stihne celou řádku do jejích 16 kroků
    u.pitch = li >= 3 ? 1.35 : 1.05;
    u.rate = 1.25;
    u.volume = 1;
    u.onstart = () => {
      // 🗣 skutečná slova se rozběhla - robotímu vokálu už není třeba
      ttsWorks = true;
      cutVoxSynth();
    };
    speechSynthesis.speak(u);
    voxOn = true;
  } catch {
    // hlas nedostupný - zpívá robotí vokál
  }
}

// 🎚 normálně hraje bitevní téma, jen boss si vezme svá tematická_tracks; překvapení (🎁) přebíjí všechno
function pickSong(g: Game): Song {
  let finalBoss = false;
  let boss = false;
  for (const e of g.enemies) {
    if (!e.dead && e.boss) {
      boss = true;
      finalBoss = e.final;
      break;
    }
  }
  if (boss) return finalBoss ? SONG_FINAL : SONG_BOSS;
  return SONG_EPIC;
}

// volá se každý snímek - noty se plánují ~0,35 s dopředu, takže hudba nezapráská
function musicTick(g: Game): void {
  // 🎵 hudba hraje i v menu (dokud běží zvuk a nejsi po smrti) - výchozí track je bitevní
  if (!g.opts.snd || g.over || typeof AudioContext === "undefined") {
    stopVox();
    return;
  }
  try {
    if (!AC) AC = new AudioContext();
    if (AC.state === "suspended") {
      void AC.resume();
      return;
    }
    // ⏸ v pauze a level-upu hudba zmlkne - po návratu pokračuje tam, kde skončila
    if (g.paused || g.userPaused) {
      musNext = Math.max(musNext, AC.currentTime + 0.05);
      stopVox();
      return;
    }
    const want = g.opts.surp ? SONG_RIMMER : pickSong(g);
    // 🔥 fever - při kombu 15+ se přidá arp vrstva a hi-haty v šestnáctinách (v překvapení ne)
    musFever = !g.opts.surp && g.combo >= 15;
    if (want !== musSong) {
      const prev = musSong;
      musSong = want;
      musStep = 0;
      musNext = Math.max(musNext, AC.currentTime + 0.05);
      // 📣 přepnutý track se ohlásí toastem nahoře, u bosse se ozve i riser
      musToast = want.name;
      musToastAt = performance.now();
      // 🎤 při přepnutí tracku se zpívání zastaví (nová skladba začíná od začátku)
      stopVox();
      // ✂️ a rozvržené noty starého tracku se tvrdě střihnou - žádné překrývání dvou melodií
      cutMusic();
      if ((want === SONG_BOSS || want === SONG_FINAL) && prev !== SONG_BOSS && prev !== SONG_FINAL) playSfx(g, "riser");
    }
    const song = musSong as Song;
    const epic = song === SONG_EPIC;
    let bossPhase = 1;
    if (song === SONG_BOSS || song === SONG_FINAL) {
      for (const e of g.enemies) {
        if (!e.dead && e.boss) {
          bossPhase = e.phase;
          break;
        }
      }
    }
    // finální fáze bosse (3+) ještě zrychlí tempo - hra se zní jako smršť
    const stepDur = song === SONG_BOSS && bossPhase >= 3 ? song.step * 0.88 : song.step;
    musStepDur = stepDur;
    // 💀 DANGER - čím blíž smrti (pod 45 % HP), tím větší děs: 0 = v pohodě, 1 = skoro mrtvý
    // 👹 a když je na mapě boss, běží děs na 45 % i při plném HP - „teď už to máš spočítaný"
    const bossDread = song === SONG_BOSS || song === SONG_FINAL ? 0.45 : 0;
    const danger = g.opts.surp ? 0 : Math.max(bossDread, Math.max(0, Math.min(1, 1 - g.hero.hp / (g.hero.maxHp * 0.45))));
    // 🎻 při velkém strachu se celá hudba mírně rozladí (detune) - podvědomá úzkost
    const detune = danger > 0.45 ? 0.978 : 1;
    // 👹 davová tlačenice - když je louka plná nepřátel, přidávají se hi-haty v 16tinách
    const horde = !g.opts.surp && g.enemies.length > 40;
    // 💓 přechod do kritického stavu zahouká děsivý sting (jen jednou, dokud nezvedneš HP)
    if (danger >= 0.55 && !musDangerSting) {
      musDangerSting = true;
      playSfx(g, "boss");
    } else if (danger < 0.3) {
      musDangerSting = false;
    }
    const now = AC.currentTime;
    if (musNext < now) musNext = now + 0.05;
    while (musNext < now + 0.35) {
      // 🧭 délka patternu - výchozí 16 kroků, ale delší skladby (sloka + refrén) mají vlastní len
      const s = musStep % (song.len ?? 16);
      const t = musNext;
      // 🎤 ZPÍVÁ SE - na začátku každé řádky (16 kroků) se zazpívá celý verš, na konci písničky se zpěv točí od začátku
      if (s % 16 === 0 && song.lyrics) {
        const li = (musStep >> 4) % song.lyrics.length;
        singLine(song, li, t, stepDur);
      }
      const b = song.bass[s];
      if (b) musicNote(song.bassWave, (b / 2) * detune, t, stepDur * 0.95, epic ? 0.062 : 0.05);
      const l = song.lead[s];
      if (l) musicNote(song.leadWave, l * detune, t, stepDur * 0.9, epic ? 0.042 : 0.028);
      // 🎺 EPICKÁ VRSTVA: brass fanfáry (power akord root+kvinta+oktáva), timpani pod kopákem, crash na takt
      if (epic) {
        if (song.fanfare && song.fanfare.includes(s)) {
          const f0 = song.chords[(musStep >> 3) % song.chords.length] * 2 * detune;
          musicNote("sawtooth", f0, t, stepDur * 1.6, 0.036);
          musicNote("sawtooth", f0 * 1.5, t, stepDur * 1.6, 0.03);
          musicNote("sawtooth", f0 * 2, t, stepDur * 1.6, 0.026);
        }
        // 🥁 timpani - válečný buben zahouká s každým kopákem
        if (song.kick.includes(s)) musicThump(t, 0.075);
        // 🥁 orchestrální crash na začátku každého taktu
        if (s === 0) musicDrum(t, 0.6, 0.02, 7000);
      }
      // 🎹 pomalé polštářové kvinty - dávají trackům tělo
      const ch = song.chords[(musStep >> 3) % song.chords.length];
      if (ch && s % 8 === 0) {
        musicNote("sine", ch * detune, t, stepDur * 7.5, 0.016);
        musicNote("sine", ch * 1.5 * detune, t, stepDur * 7.5, 0.012);
        // 🎻 smyčcový pad - orchestr drží harmonii jako v bitevní scéně
        if (song.strings) {
          musicNote("sawtooth", ch * detune, t, stepDur * 7.6, 0.019);
          musicNote("sawtooth", ch * 1.19 * detune, t, stepDur * 7.6, 0.015);
          musicNote("sawtooth", ch * 2 * detune, t, stepDur * 7.6, 0.013);
        }
      }
      // 🎸 arp vrstva - u rave a finálního bosse vždy, u bosse ve fázi 3 taky, jinde jen ve fever kombu
      const ar = song.arp[s];
      if (ar && (song.arpAlways || bossPhase >= 3 || (musFever && song !== SONG_CALM))) musicNote("square", ar * detune, t, stepDur * 0.55, 0.014);
      // 💀 DREAD DRONE - na začátku každého taktu táhlý rozladěný akord (malá sekunda buší sama se sebou)
      if (s === 0 && (danger > 0.2 || song === SONG_BOSS || song === SONG_FINAL)) {
        const df = song === SONG_BOSS || song === SONG_FINAL ? 55 : 82.41; // A1 u bossů, E2 jinak
        const dg = song === SONG_BOSS || song === SONG_FINAL ? 0.028 : 0.018 + 0.05 * danger;
        musicNote("sawtooth", df, t, stepDur * 16, dg * 0.5);
        musicNote("sawtooth", df * 1.0594, t, stepDur * 16, dg * 0.5); // rozladěný sourozenec
      }
      if (song.kick.includes(s)) {
        musicDrum(t, 0.09, 0.05, 300);
        // ⏱ kdy kopák zadudec - kvůli beat pulsu ve vizuálu
        musKickAt = performance.now() + (t - now) * 1000;
      }
      if (song.snare.includes(s)) musicDrum(t, 0.12, 0.038, 1800);
      if (song.hat.includes(s) || (((musFever || horde || bossPhase >= 3) && song !== SONG_CALM && s % 2 === 1))) musicDrum(t, 0.04, 0.016, 6000);
      // 💓 SRDCE - lub-dub s každým půltaktem, sílí a zrychluje se s klesajícím HP
      if (danger > 0.05) {
        if (s % 8 === 0) {
          musicThump(t, 0.045 + 0.12 * danger);
          // ⏱ kdy srdce bouchnulo - kvůli pulzu rudé vinětace ve vizuálu
          musThumpAt = performance.now() + (t - now) * 1000;
        }
        if (s % 8 === 3) musicThump(t, 0.025 + 0.07 * danger);
      }
      musNext += stepDur;
      musStep += 1;
    }
  } catch {
    // audio nedostupné - hraje se potichu
  }
}

// 🔢 sčítaná čísla poškození - rychlé rány na jednoho nepřítele se spojí do jednoho součtu
function dmgText(g: Game, e: Enemy, dmg: number, crit: boolean, src?: string): void {
  if (src) g.dmgSrc[src] = (g.dmgSrc[src] || 0) + dmg;
  // ✨ crit rány vyhodí zlaté jiskry - čísla ne, jiskry vždy
  if (crit && Math.random() < 0.4) burst(g, e.x + (Math.random() - 0.5) * 16, e.y + (Math.random() - 0.5) * 16, 4, 45, 95);
  if (!g.opts.nums) return;
  e.dmgAcc = (e.dmgAcc ?? 0) + dmg;
  e.dmgAccCrit = (e.dmgAccCrit ?? false) || crit;
  e.dmgAccT = 0.16;
}

// pk: 0 = XP koule, 1 = ❤️ srdíčko (heal), 2 = 💣 bomba (AoE), 3 = 🧲 magnet (vysaje koule)
function spawnOrb(g: Game, x: number, y: number, xp: number, pk = 0): void {
  g.orbs.push({
    x,
    y,
    vx: 0,
    vy: 0,
    r: pk > 0 ? 9 : 4 + xp * 2,
    xp,
    hue: pk === 1 ? 350 : pk === 2 ? 25 : pk === 3 ? 210 : 48,
    pk,
  });
}

function spawnEnemy(g: Game, forceKind = -1, px?: number, py?: number): void {
  const t = g.time;
  // výběr typu podle času s váhami - odemykají se dřív, od začátku je živo
  const opts: number[] = [0];
  const w: number[] = [10];
  if (t > 12) { opts.push(1); w.push(8); }
  if (t > 25) { opts.push(2); w.push(5); }
  if (t > 40) { opts.push(3); w.push(5); }
  if (t > 60) { opts.push(4); w.push(3); }
  if (t > 45) { opts.push(5); w.push(4.5); }
  if (t > 100) { opts.push(10); w.push(3); }
  if (t > 90) { opts.push(11); w.push(3); }
  if (t > 50) { opts.push(12); w.push(2); }
  if (t > 100) { opts.push(14); w.push(2); }
  if (t > 130) { opts.push(13); w.push(3); }
  if (t > 160) { opts.push(15); w.push(2); }
  if (t > 170) { opts.push(16); w.push(2); }
  if (t > 70) { opts.push(8); w.push(2.5); }
  if (t > 100) { opts.push(6); w.push(2.5); }
  if (t > 130) { opts.push(7); w.push(2); }
  if (t > 140) { opts.push(17); w.push(2.5); }
  if (t > 110) { opts.push(18); w.push(2.5); }
  if (t > 70) { opts.push(19); w.push(3); }
  let total = 0;
  for (const x of w) total += x;
  let r = Math.random() * total;
  let kind = opts[0];
  for (let i = 0; i < opts.length; i++) {
    r -= w[i];
    if (r <= 0) {
      kind = opts[i];
      break;
    }
  }
  // sandbox: vynucený druh se rodí na dohled od hrdiny
  if (forceKind >= 0) kind = forceKind;
  const d = ENEMY_DEFS[kind];
  // endgame křivka: po 5. minutách HP roste výrazně rychleji (obtížnost ji násobí)
  const df = DIFFS[g.diff] || DIFFS[1];
  const hpMul = (1 + t / 120 + Math.max(0, t - 300) / 60) * df.hp;
  // 🌟 elitní varianta: po minutě 6 % šance na korunku s náhodnou vlastností (3× HP, víc dropů)
  // korunky nedostanou podpůrné druhý (květomil by dvojitě léčil, dravec by byl nezabitelný) a na mapě je jich max 4
  let eliteCount = 0;
  for (const en of g.enemies) {
    if (!en.dead && en.elite) eliteCount++;
  }
  const elite = !g.sandbox && t > 60 && kind !== 9 && kind !== 17 && kind !== 19 && eliteCount < 4 && Math.random() < 0.06 ? ["swift", "boom", "vamp", "shield"][Math.floor(Math.random() * 4)] : undefined;
  const eMul = elite ? 3 : 1;
  // spawn kruh kolem hrdiny, těsně mimo obraz (sandbox blízko, ať ho vidíš)
  const a = Math.random() * Math.PI * 2;
  const dd = forceKind >= 0 ? 150 : (Math.hypot(VW, VH) / 2) * 1.1 + 60;
  const ex = px !== undefined ? Math.max(40, Math.min(ARENA - 40, px)) : Math.max(40, Math.min(ARENA - 40, g.hero.x + Math.cos(a) * dd));
  const ey = py !== undefined ? Math.max(40, Math.min(ARENA - 40, py)) : Math.max(40, Math.min(ARENA - 40, g.hero.y + Math.sin(a) * dd));
  g.enemies.push({
    id: g.nextId++,
    x: ex,
    y: ey,
    r: d.r,
    hp: d.hp * hpMul * eMul,
    maxHp: d.hp * hpMul * eMul,
    speed: d.speed,
    dmg: Math.round(d.dmg * (1 + t / 700) * (elite ? 1.3 : 1) * df.dmg),
    hue: d.hue,
    big: d.big,
    flash: 0,
    kbx: 0,
    kby: 0,
    dead: false,
    kind,
    slow: 0,
    lungeCd: 2 + Math.random() * 2,
    lungeT: 0,
    shootCd: 1 + Math.random() * 2,
    boss: false,
    minib: false,
    final: false,
    elite,
    phase: 1,
  });
  if (elite) playSfx(g, "elite");
}

// 🌟 elitní vlna - skupina extra silných střílejících nepřátel (kind 9)
function spawnEliteWave(g: Game): void {
  const t = g.time;
  const df = DIFFS[g.diff] || DIFFS[1];
  const hpMul = (1 + t / 120 + Math.max(0, t - 300) / 60) * df.hp;
  const a = Math.random() * Math.PI * 2;
  const dd = (Math.hypot(VW, VH) / 2) * 1.1 + 60;
  const cx = Math.max(40, Math.min(ARENA - 40, g.hero.x + Math.cos(a) * dd));
  const cy = Math.max(40, Math.min(ARENA - 40, g.hero.y + Math.sin(a) * dd));
  addText(g, cx, cy - 34, "⚠️ ELITNÍ VLNA!", 280, 20);
  const n = Math.min(8, 3 + Math.floor(t / 240));

      y: Math.max(30, Math.min(ARENA - 30, cy + (Math.random() - 0.5) * 130)),
      r: 30,
      hp: 190 * hpMul,
      maxHp: 190 * hpMul,
      speed: 85,
      dmg: Math.round(28 * (1 + t / 700) * df.dmg),
      hue: 265,
      big: true,
      flash: 0,
      kbx: 0,

      final: false,
      phase: 1,
    });

}

// 💀 finální boss - každý třetí boss je posílená finální podoba (nebo na přání v sandboxu)
function spawnBoss(g: Game, forceType = -1, forceFinal = false): void {
  const t = g.time;
  // druh bosse se střídá podle počtu zabiték (v sandboxu lze vynutit konkrétní druh)
  const isFinal = forceFinal || g.bossKills % 3 === 2;
  const bt = forceType >= 0 ? BOSS_TYPES[forceType] : BOSS_TYPES[g.bossKills % BOSS_TYPES.length];
  // 🏟️ boss aréna kolem hrdiny - nikdo neuteče (zvětšená o polovinu: 330 → 495)
  const ar = 495;
  g.arena = { x: g.hero.x, y: g.hero.y, r: ar, active: true };
  g.telegraphs.length = 0;
  g.eBolts.length = 0;
  // aréna vyčistí pole od běžných nepřátel - bez odměn, zůstaneš jen s bossem
  // (v sandboxu se nic nemaže - ať si můžeš pustit bosse i normální nepřátele najednou)
  for (const cl of g.enemies) {
    if (!cl.dead && !cl.boss && !g.sandbox) {
      cl.dead = true;
      burst(g, cl.x, cl.y, 6, cl.hue, 120);
    }
  }
  // ⏱ na bosse máš 3:20, jinak tě rozdrtí
  g.bossT = 200;
  // 📣 intro banner - první vteřiny po spawnu se rozezní jméno bosse
  g.bossIntroT = 2.6;
  g.bossIntroName = bt.name;
  // 👹 děsivý náraz při zrodu bosse: otřes, rudý záblesk přes obrazovku a táhlý sting
  g.shake = Math.max(g.shake, 10);
  g.goldFlash = 0;
  g.dreadFlash = 1;
  playSfx(g, "boss");
  playSfx(g, "riser");
  // boss se zrodí na okraji arény
  const a = Math.random() * Math.PI * 2;
  const x = Math.max(60, Math.min(ARENA - 60, g.arena.x + Math.cos(a) * (ar - 40)));
  const y = Math.max(60, Math.min(ARENA - 60, g.arena.y + Math.sin(a) * (ar - 40)));
  // ☠️ finální (ultimátní) podoba = 2.3× HP a roste s časem jako u všech bossů
  const hp = (260 + t * 3 + g.bossKills * 90) * 5 * bt.hpMul * (isFinal ? 2.3 : 1) * (DIFFS[g.diff] || DIFFS[1]).hp * g.bossHpMul;
  g.enemies.push({
    id: g.nextId++,
    x,
    y,
    r: bt.r * (isFinal ? 1.3 : 1),
    hp,
    maxHp: hp,
    speed: bt.speed * (isFinal ? 1.12 : 1),
    dmg: Math.round(bt.dmg * (isFinal ? 1.3 : 1) * (DIFFS[g.diff] || DIFFS[1]).dmg),
    hue: bt.hue,
    big: true,
    flash: 0,
    kbx: 0,
    kby: 0,
    dead: false,
    kind: bt.kind,
    slow: 0,
    lungeCd: 0,
    lungeT: 0,
    shootCd: 2.2,
    boss: true,
    minib: false,
    final: isFinal,
    phase: 1,
  });
  g.shake = isFinal ? 12 : 8;
  playSfx(g, "boss");
  addText(g, g.hero.x, g.hero.y - 44, isFinal ? `☠️ FINÁLNÍ BOSS: ${bt.name}!` : `⚠️ BOSS: ${bt.name}! ARÉNA!`, 0, isFinal ? 26 : 24);
  burst(g, x, y, isFinal ? 30 : 20, bt.hue, 220);
}

// 🌟 mini-boss: bez arény, 5 variant se specializacemi - spawnuje se během hry
function spawnMini(g: Game, typeIdx = -1): void {
  const t = g.time;
  const mt = MINI_TYPES[typeIdx >= 0 ? typeIdx : Math.floor(Math.random() * MINI_TYPES.length)];
  const hp = 95 + t * 1.8 + g.bossKills * 40;
  const a = Math.random() * Math.PI * 2;
  const dd = (Math.hypot(VW, VH) / 2) * 1.05 + 40;
  const x = Math.max(40, Math.min(ARENA - 40, g.hero.x + Math.cos(a) * dd));
  const y = Math.max(40, Math.min(ARENA - 40, g.hero.y + Math.sin(a) * dd));
  g.enemies.push({
    id: g.nextId++,
    x,
    y,
    r: mt.r,
    hp,
    maxHp: hp,
    speed: mt.speed,
    dmg: 15 + t * 0.04,
    hue: mt.hue,
    big: true,
    flash: 0,
    kbx: 0,
    kby: 0,
    dead: false,
    kind: mt.kind,
    slow: 0,
    lungeCd: 1.4 + Math.random(),
    lungeT: 0,
    shootCd: 1.2 + Math.random(),
    boss: false,
    minib: true,
    final: false,
    phase: 1,
  });
  g.shake = 4;
  addText(g, g.hero.x, g.hero.y - 44, `🌟 MINI-BOSS: ${mt.name}!`, mt.hue, 19);
  burst(g, x, y, 14, mt.hue, 160);
}

// 🌱 META PROGRES - semínka za runy → nekonečné trvalé upgrady (localStorage)
const META_KEY = "louka_meta_v1";
// 🏆 jeden zápis v žebříčku nejlepších runů
type ScoreEntry = { name: string; score: number; level: number; kills: number; time: number; cls: string; diff: number; date: string; combo: number };
type Meta = {
  pts: number;
  lvl: Record<string, number>;
  ach?: Record<string, boolean>;
  best?: Record<string, number>;
  unlock?: Record<string, boolean>;
  opts?: { snd: boolean; shk: boolean; nums: boolean; surp?: boolean };
  vol?: number;
  lang?: string;
  daily?: { key: string; best: number };
  // 🥇 žebříček top 10 + naposledy použité jméno hráče
  board?: ScoreEntry[];
  lastName?: string;
};

function loadMeta(): Meta {
  try {
    const s = localStorage.getItem(META_KEY);
    if (s) {
      const p = JSON.parse(s) as Meta;
      if (p && typeof p.pts === "number" && p.lvl) {
        if (p.vol !== undefined) setMasterVol(p.vol / 100);
        if (p.lang) CUR_LANG = p.lang;
        return {
          pts: p.pts,
          lvl: p.lvl,
          ach: p.ach || {},
          best: p.best || {},
          unlock: p.unlock || {},
          opts: p.opts ? { surp: false, ...p.opts } : { snd: true, shk: true, nums: true, surp: false },
          vol: p.vol,
          lang: p.lang,
          daily: p.daily || { key: "", best: 0 },
          board: p.board || [],
          lastName: p.lastName || "",
        };
      }
    }
  } catch {
    // localStorage nedostupný - hrajeme bez uložení
  }
  return { pts: 0, lvl: {}, ach: {}, best: {}, unlock: {}, opts: { snd: true, shk: true, nums: true, surp: false }, daily: { key: "", best: 0 }, board: [], lastName: "" };
}

function saveMeta(m: Meta): void {
  try {
    localStorage.setItem(META_KEY, JSON.stringify(m));
  } catch {
    // bez uložení
  }
}

// 🥇 ŽEBŘÍČEK - arcade styl: top 10 runů uložených v prohlížeči
const BOARD_MAX = 10;
// dostane se skóre mezi top 10? (sandbox se nezapočítává)
function boardQualifies(m: Meta, score: number): boolean {
  const b = m.board || [];
  return score > 0 && (b.length < BOARD_MAX || score > b[b.length - 1].score);
}
// zápis do žebříčku - setřídí sestupně a uřízne na top 10; jméno si zapamatuje
function pushBoard(m: Meta, e: ScoreEntry): Meta {
  const b = [...(m.board || []), e].sort((x, y) => y.score - x.score).slice(0, BOARD_MAX);
  return { ...m, board: b, lastName: e.name };
}

// 🧮 combo bonusy: dmg i XP rostou s řetězem killů (rozpadá se po 3 s bez zabití)
function heroDmgMul(g: Game): number {
  // 🧛 Krvavá žízeň (upír) - pod 35 % HP útočí o 25 % sílněji (riziko za odměnu)
  const thirst = g.cls === "vampire" && g.hero.hp < g.hero.maxHp * 0.35 ? 0.25 : 0;
  return 1 + g.stats.dmgMul + Math.min(0.5, g.combo * 0.01) + thirst;
}
function comboXpMul(g: Game): number {
  return 1 + Math.min(1, g.combo * 0.03);
}

// 🏆 kontrola trofejí v průběhu runu - grant přidá odměnu do mety (React callback)
function checkAch(g: Game, grant: (id: string, reward: number) => void): void {
  for (const a of ACHIEVEMENTS) {
    if (g.achToast.indexOf(a.id) === -1 && a.cond(g)) {
      g.achToast.push(a.id);
      addText(g, g.hero.x, g.hero.y - 70, `${a.emoji} TROFEJ: ${a.name}!`, 48, 17);
      playSfx(g, "ding");
      grant(a.id, a.reward);
    }
  }
}

      magnetMul: 0,
      armor: cls.armor,
      lifesteal: cls.ls ?? 0,
    },
    kills: 0,
    nightKills: 0,
    spawnT: 0.5,
    nextId: 1,
    bossKills: 0,
    nextBoss: 75,
    bossWarned: false,
    minibKills: 0,
    nextMini: 40,
    bossT: 200,
    growT: 10,
    waveT: 30,
    regenT: 3,
    time: 0,
    gtime: 0,
    xp: 0,
    xpMul: 1,
    level: 1,
    need: xpNeed(1),
    pending: 0,
    magT: 0,
    revive: false,
    pactTaken: [],
    turrets: [],
    nextTid: 1,
    tKinds: ["standard"],
    tcfg: { fire: 2.2, dmg: 6, flame: false, wind: false, frost: false },
    crateOpen: false,
    running: false,
    paused: false,
    userPaused: false,
    night: false,
    over: false,
    shake: 0,
    hitStop: 0,
    goldFlash: 0,
    dreadFlash: 0,
    combo: 0,
    comboT: 0,
    comboBest: 0,
    rerolls: 1,
    ultCd: 0,
    overT: 0,
    bossIntroT: 0,
    bossIntroName: "",
    weather: "",
    weatherT: 20,
    windA: 0,
    windT: 1,
    diff,
    daily,
    enemySpdMul: 1,
    bossHpMul: 1,
    crateBonus: 0,
    dmgSrc: {},
    opts: meta && meta.opts ? { surp: false, ...meta.opts } : { snd: true, shk: true, nums: true, surp: false },
    achToast: [],
  };
  for (let i = 0; i < 2160; i++) {
    g.stars.push({ x: Math.random() * ARENA, y: Math.random() * ARENA, r: 0.6 + Math.random() * 1.4 });
  }
  // 🌳 stromy, keře, houby a kameny po celé mapě (ne přímo na startu) - hustota zachována i po zvětšení mapy
  for (let i = 0; i < 740; i++) {
    const kr = Math.random();
    const k = kr < 0.36 ? 0 : kr < 0.62 ? 1 : kr < 0.76 ? 2 : kr < 0.9 ? 3 : 4;
    const tx = 50 + Math.random() * (ARENA - 100);
    const ty = 50 + Math.random() * (ARENA - 100);
    if ((tx - ARENA / 2) * (tx - ARENA / 2) + (ty - ARENA / 2) * (ty - ARENA / 2) < 150 * 150) continue;
    g.trees.push({
      x: tx,
      y: ty,
      r: k === 0 ? 20 + Math.random() * 12 : k === 2 ? 6 + Math.random() * 3 : k === 3 ? 8 + Math.random() * 6 : 10 + Math.random() * 6,
      k,
      rn: Math.random(),
    });
  }
  // 🌱 trvalé meta upgrady ze semínek + uložené nastavení
  if (meta) {
    for (const mu of META_UPGRADES) {
      const l = meta.lvl[mu.id] || 0;
      if (l > 0) mu.apply(g, l);
    }
    if (meta.ach) g.achToast = Object.keys(meta.ach);
  }
  return g;
}

function killEnemy(g: Game, e: Enemy): void {
  // ☠️ kostlivec - poprvé se po "smrti" znovu složí z kostí (jednou za život)
  if (e.kind === 14 && !e.revived && !e.boss && !e.minib) {
    e.revived = true;
    e.hp = Math.round(e.maxHp * 0.45);
    e.flash = 0.15;
    burst(g, e.x, e.y, 12, 0, 150);
    addText(g, e.x, e.y - e.r - 12, "☠️ ZNOVU POVSTÁVÁ!", 0, 15);
    g.shake = Math.max(g.shake, 3);
    return;
  }
  e.dead = true;
  g.kills += 1;
  if (g.night) g.nightKills += 1;
  if (g.stats.lifesteal > 0) {
    g.hero.hp = Math.min(g.hero.maxHp, g.hero.hp + g.stats.lifesteal);
  }
  // 🔥 combo - řetěz killů zvyšuje dmg i XP, rozpadne se po 3 s bez zabití
  g.combo += 1;
  g.comboT = 3;
  g.comboBest = Math.max(g.comboBest, g.combo);
  if (g.combo % 5 === 0) {
    addText(g, e.x, e.y - e.r - 22, `🔥 COMBO ×${g.combo}!`, 25, 15);
    playSfx(g, "combo");
  }
  // 🔥 FEVER - při kombu 15 se rozjede hype režim: fanfára, zlatá vlna a fever hudba
  if (g.combo === 15) {
    addText(g, g.hero.x, g.hero.y - 40, "🔥 FEVER MODE! 🔥", 45, 21);
    shock(g, g.hero.x, g.hero.y, 220, 45, 0.55, 9, 0.28);
    playSfx(g, "fever");
  }
  // 🌟 každé desáté combo vystřelí zlatý prstenec kolem hrdiny
  if (g.combo > 0 && g.combo % 10 === 0) shock(g, g.hero.x, g.hero.y, 150, 45, 0.4, 6, 0.18);
  playSfx(g, "kill");
  // 💥 elitní vlastnost "boom" - korunka vybuchne a zraní i tebe
  if (e.elite === "boom" && !e.boss && !e.minib) {
    burst(g, e.x, e.y, 18, 25, 240);
    playSfx(g, "boom");
    if (dist2(e.x, e.y, g.hero.x, g.hero.y) < 130 * 130 && g.hero.invuln <= 0) damageHero(g, Math.round(e.dmg * 0.8));
  }
  // 🫧 rozpuk: po smrti se rozpadne na tři menší kopie - ale už jen JEDNOU generaci
  // (děti i princové dostanou noSplit, ať se lavina nerozmnoží exponenciálně)
  if (e.kind === 18 && !e.boss && !e.minib && !e.noSplit) {
    for (let s = 0; s < 3; s++) {
      const shp = Math.max(8, e.maxHp * 0.3);
      g.enemies.push({
        id: g.nextId++,
        x: e.x + (s - 1) * 14,
        y: e.y + (s - 1) * 8,
        r: 14,
        hp: shp,
        maxHp: shp,
        speed: 78,
        dmg: Math.max(6, Math.round(e.dmg * 0.5)),
        hue: 300,
        big: false,
        flash: 0,
        kbx: 0,
        kby: 0,
        dead: false,
        kind: 18,
        noSplit: true,
        slow: 0,
        lungeCd: 1,
        lungeT: 0,
        shootCd: 1,
        boss: false,
        minib: false,
        final: false,
        phase: 1,
      });
    }
    addText(g, e.x, e.y - 20, "🫧🫧🫧", 300, 13);
  }
  if (e.boss) {
    // boss upustí bednu s 5 upgrady (finální boss hned dvě!); pakt lovce přidá třetí
    g.bossKills += 1;
    g.hitStop = 0.14;
    burst(g, e.x, e.y, e.final ? 60 : 40, 350, 300);
    // 💥 pád bosse otřese celou loukou - trojitá vlna v barvě bosse
    shock(g, e.x, e.y, e.final ? 560 : 420, e.hue, 0.8, 14, 0.3);
    shock(g, e.x, e.y, 260, 48, 0.6, 8, 0.2);
    shock(g, e.x, e.y, 130, 0, 0.4, 5, 0.25);
    g.shake = e.final ? 18 : 14;
    // 🏆 zlatý záblesk přes celou obrazovku - pád bosse musí být vidět na orbitek
    g.goldFlash = 1;
    playSfx(g, "boom");
    // 🎺 hrdinná fanfára - pád bosse musí znít jako vítězství
    playSfx(g, "fanfare");
    g.crates.push({ x: e.x, y: e.y, t: 0 });
    if (e.final) g.crates.push({ x: e.x + 40, y: e.y + 24, t: 0 });
    if (g.pactTaken.includes("pact_hunter")) g.crates.push({ x: e.x - 40, y: e.y - 20, t: 0 });
    addText(g, e.x, e.y - 44, e.final ? "☠️ FINÁLNÍ BOSS PADL! 2× 📦" : "📦 BEDNA!", 48, e.final ? 24 : 20);
    for (let i = 0; i < (e.final ? 12 : 8); i++) {
      spawnOrb(g, e.x + (Math.random() - 0.5) * 70, e.y + (Math.random() - 0.5) * 70, 3 + Math.floor(e.maxHp / 500));
    }
    spawnOrb(g, e.x, e.y, 0, 1);
    // bossové občas upustí i bombu či magnet
    if (Math.random() < 0.35) spawnOrb(g, e.x - 30, e.y + 10, 0, 2);
    if (Math.random() < 0.35) spawnOrb(g, e.x + 34, e.y + 16, 0, 3);
    // 🫧 rozpuk král drží slovo: i po smrti se rozpadne na tři prince
    if (e.kind === 18) {
      for (let s = 0; s < 3; s++) {
        const shp = Math.max(14, e.maxHp * 0.06);
        g.enemies.push({
          id: g.nextId++,
          x: e.x + (s - 1) * 26,
          y: e.y + (s - 1) * 14,
          r: 15,
          hp: shp,
          maxHp: shp,
          speed: 70,
          dmg: Math.max(8, Math.round(e.dmg * 0.4)),
          hue: 300,
          big: false,
          flash: 0,
          kbx: 0,
          kby: 0,
          dead: false,
          kind: 18,
          noSplit: true,
          slow: 0,
          lungeCd: 1,
          lungeT: 0,
          shootCd: 1,
          boss: false,
          minib: false,
          final: false,
          phase: 1,
        });
      }
      addText(g, e.x, e.y - 20, "🫧🫧🫧", 300, 13);
    }
    // pokud už nežije žádný jiný boss, aréna padá
    let anyBoss = false;
    for (const e2 of g.enemies) {
      if (!e2.dead && e2.boss) {
        anyBoss = true;
        break;
      }
    }
    if (!anyBoss) {
      g.arena.active = false;
      g.telegraphs.length = 0;
    }
    return;
  }
  if (e.minib) {
    // mini-boss - hojné odměny, ale bez bedny
    burst(g, e.x, e.y, 26, e.hue, 220);
    g.shake = 7;
    g.hitStop = 0.07;
    g.minibKills += 1;
    playSfx(g, "kill");
    addText(g, e.x, e.y - 40, "✨ MINI-BOSS!", 48, 18);
    for (let i = 0; i < 6; i++) {
      spawnOrb(g, e.x + (Math.random() - 0.5) * 60, e.y + (Math.random() - 0.5) * 60, 2 + Math.floor(e.maxHp / 40));
    }
    spawnOrb(g, e.x, e.y, 0, 1);
    // mini-boss občas upustí bombu či magnet
    if (Math.random() < 0.15) spawnOrb(g, e.x - 24, e.y + 8, 0, 2);
    if (Math.random() < 0.15) spawnOrb(g, e.x + 24, e.y + 12, 0, 3);
    return;
  }
  // 🎨 druhová barevná smrt - kosti, střepy ledu, plameny, zelené lístky
  const KILL_FX: Record<number, [number, number]> = { 14: [220, 8], 15: [25, 10], 16: [195, 10], 17: [145, 10], 18: [300, 8], 19: [100, 8], 12: [55, 6], 13: [30, 6] };
  const kfx = KILL_FX[e.kind];
  if (kfx) burst(g, e.x, e.y, kfx[1], kfx[0], 190);
  burst(g, e.x, e.y, e.big ? 18 : 10, e.hue, 160);
  // rozpulc se rozpadne na dva malé slizouny
  if (e.kind === 8 && !e.boss) {
    for (let s = 0; s < 2; s++) {
      const shp = Math.max(6, e.maxHp * 0.3);
      g.enemies.push({
        id: g.nextId++,
        x: e.x + (s === 0 ? -12 : 12),
        y: e.y + (s - 0.5) * 14,
        r: 9,
        hp: shp,
        maxHp: shp,
        speed: 88,
        dmg: Math.max(6, Math.round(e.dmg * 0.6)),
        hue: 300,
        big: false,
        flash: 0,
        kbx: 0,
        kby: 0,
        dead: false,
        kind: 0,
        slow: 0,
        lungeCd: 1,
        lungeT: 0,
        shootCd: 1,
        boss: false,
        minib: false,
        final: false,
        phase: 1,
      });
    }
    addText(g, e.x, e.y - 20, "🫧🫧", 300, 13);
  }
  const drops = e.big ? 4 : 1 + (Math.random() < 0.5 ? 1 : 0);
  // 💡 silnější nepřítel = víc XP (POZOR: maxHp roste s časem, takže pozdější vlny vydělávají víc)
  const orbXp = 1 + Math.floor(e.maxHp / 20);
  for (let i = 0; i < drops; i++) {
    spawnOrb(g, e.x + (Math.random() - 0.5) * 24, e.y + (Math.random() - 0.5) * 24, orbXp);
  }
  // vzácné dropy - všechno s malým droprate
  const roll = Math.random();
  if (roll < 0.02) {
    spawnOrb(g, e.x, e.y, 0, 2); // 💣 bomba
  } else if (roll < 0.04) {
    spawnOrb(g, e.x, e.y, 0, 3); // 🧲 magnet
  } else if (roll < 0.1) {
    spawnOrb(g, e.x, e.y, 0, 1); // ❤️ srdíčko
  }
}

// poškození hrdiny se zbrojí, fénixem a smrtí
function damageHero(g: Game, dmg: number): void {
  const h = g.hero;
  // 🌙 v noci útočí nepřátelé o polovinu silněji
  const real = dmg * (g.night ? 1.5 : 1);
  // 🛡️ Železná disciplína (rytíř) - vestoj přes 0,25 s: rány přichází o 40 % slabší
  const braced = g.cls === "knight" && (h.stillT ?? 0) > 0.25;
  if (braced) burst(g, h.x, h.y, 6, 210, 130);
  // 🛡️ zbroj pohltí část rány - floating text ukáže skutečnou ztrátu HP
  const after = real * (1 - Math.min(0.7, g.stats.armor + (braced ? 0.4 : 0)));
  h.hp -= after;
  h.invuln = 0.9;
  g.shake = Math.max(g.shake, 6);
  playSfx(g, "hurt");
  burst(g, h.x, h.y, 10, 0, 150);
  addText(g, h.x, h.y - 24, `-${Math.round(after)}`, 0, 17);
  if (h.hp <= 0) {
    if (g.revive) {
      // 🌈 Fénixovo peří - jednorázové oživení
      g.revive = false;
      h.hp = Math.ceil(h.maxHp * 0.5);
      h.invuln = 2.5;
      g.shake = 12;
      addText(g, h.x, h.y - 34, "🌈 FÉNIX! OŽIVUJI", 330, 18);
      burst(g, h.x, h.y, 24, 330, 220);
      burst(g, h.x, h.y, 16, 48, 180);
    } else {
      h.hp = 0;
      g.over = true;
      g.running = false;
      g.shake = 16;
      burst(g, h.x, h.y, 30, 140, 240);
    }
  }
}

function hasWeapon(g: Game, id: string): boolean {
  for (const w of g.weapons) if (w.id === id) return true;
  return false;
}

// ⚡ ULTIMÁTNÍ SCHOPNOST TŘÍDY - klávesa E / tlačítko 💥, cooldown dle classy
function castUlt(g: Game): void {
  if (g.ultCd > 0 || g.over || !g.running || g.paused || g.userPaused) return;
  const u = ULTS[g.cls];
  if (!u) return;
  const h = g.hero;
  g.ultCd = u.cd;
  g.hitStop = 0.06;
  g.shake = Math.max(g.shake, 7);
  addText(g, h.x, h.y - 52, `${u.emoji} ${u.name}!`, 290, 20);
  burst(g, h.x, h.y, 18, 280, 220);
  playSfx(g, "ult");
  playSfx(g, "ult_" + g.cls);
  const dm = heroDmgMul(g);
  // kruhová dávka projektilů
  const volley = (n: number, kind: number, dmg: number, pierce: number, sp = 640) => {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      g.arrows.push(
        Object.assign(arrowNew(), {
        x: h.x + Math.cos(a) * 14,
        y: h.y + Math.sin(a) * 14,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        dmg: dmg * dm,
        pierce,
        crit: true,
        life: 1.1,
        hits: [],
        kind,
        knock: 1.6,
        chain: 0,
        expl: false,
        frost: false,
        lvl: 5,
        src: "ult",
        })
      );
    }
  };
  switch (g.cls) {
    case "archer": {
      // 🏹 Déšť šípů - doopravdy z nebe: každý šíp padá na jiného netvora v okolí
      // (ninjova kruhová salva zůstává jediná svého druhu)
      const targets: Enemy[] = [];
      for (const e of g.enemies) {
        if (e.dead || (e.immT ?? 0) > 0 || (e.subT ?? 0) > 0) continue;
        if (dist2(h.x, h.y, e.x, e.y) < 420 * 420) targets.push(e);
      }
      const nA = Math.max(8, Math.min(20, targets.length * 2));
      for (let i = 0; i < nA; i++) {
        const tgt = targets.length > 0 ? targets[i % targets.length] : null;
        const ax2 = tgt ? tgt.x + (Math.random() - 0.5) * 26 : h.x + (Math.random() - 0.5) * 320;
        const ay2 = tgt ? tgt.y + (Math.random() - 0.5) * 26 : h.y + (Math.random() - 0.5) * 320;
        g.arrows.push(
          Object.assign(arrowNew(), {
            x: ax2 + (Math.random() - 0.5) * 36,
            y: ay2 - 300 - Math.random() * 80,
            vx: (Math.random() - 0.5) * 30,
            vy: 880 + Math.random() * 160,
            dmg: 15 * dm,
            pierce: 1,
            crit: true,
            life: 0.7,
            hits: [],
            kind: 0,
            knock: 1.4,
            chain: 0,
            expl: false,
            frost: false,
            lvl: 5,
            src: "ult",
          })
        );
      }
      // 🏹 zlatá rázová vlna od hrdiny + větrné víry
      shock(g, h.x, h.y, 170, 48, 0.5, 7, 0.2);
      shock(g, h.x, h.y, 90, 200, 0.35, 4, 0.12);
      burst(g, h.x, h.y, 12, 48, 260);
      break;
    }
    case "soldier": {
      // 💥 Náletek - 6 bomb postupně dopadne do širokého kruhu kolem tebe
      // (telegrafované jantarové zóny - vidíš, kam co padá, bolí to jen netvory)
      for (let i = 0; i < 6; i++) {
        const a2 = (i / 6) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
        const dd2 = 140 + Math.random() * 110;
        g.telegraphs.push({
          x: Math.max(30, Math.min(ARENA - 30, h.x + Math.cos(a2) * dd2)),
          y: Math.max(30, Math.min(ARENA - 30, h.y + Math.sin(a2) * dd2)),
          r: 115,
          t: -i * 0.16,
          dur: 0.7,
          dmg: Math.round(48 * dm),
          friendly: true,
        });
      }
      // 💥 dvojitá výbušná vlna - tlumená oranžová + jiskřivá jantarová
      shock(g, h.x, h.y, 340, 25, 0.55, 11, 0.28);
      shock(g, h.x, h.y, 220, 40, 0.4, 7, 0.18);
      burst(g, h.x, h.y, 16, 40, 380);
      playSfx(g, "boom");
      break;
    }
    case "ninja":
      volley(12, 10, 12, 1);
      h.invuln = Math.max(h.invuln, 1);
      // 🥷 kouřová bomba - fialovo-černý dým a tichá vlna
      shock(g, h.x, h.y, 210, 275, 0.5, 8, 0.3);
      burst(g, h.x, h.y, 22, 270, 190);
      shock(g, h.x, h.y, 110, 290, 0.32, 4, 0.2);
      break;
    case "knight": {
      // 🛡️ Štítová vlna - poškození je drobné, ale vše živé odletí půlku mapy daleko
      // (na rozdíl od upírovy hostiny: tady je hlavní odhoz, ne vysávání)
      for (const e of g.enemies) {
        if (e.dead || (e.immT ?? 0) > 0 || (e.subT ?? 0) > 0) continue;
        const dd = dist2(h.x, h.y, e.x, e.y);
        if (dd < 380 * 380) {
          e.hp -= 20 * dm;
          e.flash = 0.1;
          const kd = Math.sqrt(dd) || 1;
          const kb = e.boss ? 280 : 780;
          e.kbx += ((e.x - h.x) / kd) * kb;
          e.kby += ((e.y - h.y) / kd) * kb;
          if (e.hp <= 0) killEnemy(g, e);
        }
      }
      h.invuln = Math.max(h.invuln, 2);
      // 🛡️ svatá aura - modré a blankytné prstence jako štítová bariéra
      shock(g, h.x, h.y, 380, 210, 0.6, 9, 0.2);
      shock(g, h.x, h.y, 250, 190, 0.45, 6, 0.14);
      burst(g, h.x, h.y, 18, 210, 240);
      break;
    }
    case "mage": {
      // ☄️ meteor na nejbližší chvost
      let mt: Enemy | null = null;
      let md = 600 * 600;
      for (const e of g.enemies) {
        if (e.dead) continue;
        const dd = dist2(h.x, h.y, e.x, e.y);
        if (dd < md) {
          md = dd;
          mt = e;
        }
      }
      const tx = mt ? mt.x : h.x;
      const ty = mt ? mt.y : h.y;
      burst(g, tx, ty, 34, 25, 320);
      // ☄️ ohnivá stopa meteoru padá z nebe + dvojitý dopadový kráter
      burst(g, tx, ty - 230, 14, 25, 340);
      shock(g, tx, ty, 280, 25, 0.6, 13, 0.3);
      shock(g, tx, ty, 170, 45, 0.45, 8, 0.2);
      shock(g, tx, ty, 90, 15, 0.3, 5, 0.25);
      g.shake = 16;
      playSfx(g, "boom");
      for (const e of g.enemies) {
        if (e.dead || (e.immT ?? 0) > 0) continue;
        if (dist2(tx, ty, e.x, e.y) < 280 * 280) {
          e.hp -= 160 * dm;
          e.flash = 0.12;
          if (e.hp <= 0) killEnemy(g, e);
        }
      }
      break;
    }
    case "vampire": {
      // 🧛 Krvavá hostina - za každého vysátého netvora kapka života, těžká krev je zpomalí
      let drank = 0;
      for (const e of g.enemies) {
        if (e.dead || (e.immT ?? 0) > 0 || (e.subT ?? 0) > 0) continue;
        const dd = dist2(h.x, h.y, e.x, e.y);
        if (dd < 260 * 260) {
          e.hp -= 40 * dm;
          e.flash = 0.1;
          e.slow = Math.max(e.slow, 1.6);
          drank += 1;
          if (e.hp <= 0) killEnemy(g, e);
        }
      }
      const heal = Math.min(45, drank * 5);
      if (heal > 0) {
        h.hp = Math.min(h.maxHp, h.hp + heal);
        addText(g, h.x, h.y - 30, `🩸 +${heal}`, 350, 15);
      }
      // 🧛 krvavá essence - rudý prstenec + stoupající kapky krve
      shock(g, h.x, h.y, 300, 350, 0.55, 8, 0.24);
      burst(g, h.x, h.y, 20, 350, 230);
      shock(g, h.x, h.y, 140, 0, 0.35, 5, 0.18);
      break;
    }
    case "druid": {
      // 🌲 Salvo lesa - 8 mohutných dřevěných kmenů vějířem vpřed
      const base = h.angle;
      for (let i = -3.5; i <= 3.5; i++) {
        const a = base + i * 0.14;
        g.arrows.push(Object.assign(arrowNew(), { x: h.x + Math.cos(a) * 14, y: h.y + Math.sin(a) * 14, vx: Math.cos(a) * 620, vy: Math.sin(a) * 620, dmg: 30 * dm, pierce: 3, crit: true, life: 1.2, hits: [], kind: 16, knock: 2.4, chain: 0, expl: false, frost: false, lvl: 5, src: "ult" }));
      }
      burst(g, h.x + Math.cos(base) * 20, h.y + Math.sin(base) * 20, 14, 100, 160);
      // 🌲 zelená vlna života od kořenů + lístková smyčka
      shock(g, h.x, h.y, 200, 100, 0.5, 8, 0.25);
      shock(g, h.x + Math.cos(base) * 40, h.y + Math.sin(base) * 40, 130, 140, 0.4, 5, 0.16);
      burst(g, h.x, h.y, 14, 140, 200);
      break;
    }
    case "engineer": {
      for (let i = 0; i < 3; i++) {
        if (g.turrets.length >= 3) g.turrets.shift();
        const ttype = g.tKinds[g.nextTid % g.tKinds.length];
        const thp = turretHp(g);
        g.turrets.push({ x: h.x + (i - 1) * 36, y: h.y + 22, cd: 0.1, windCd: 0.5, t: 0, aim: h.angle, id: g.nextTid++, hp: thp, maxHp: thp, type: ttype });
        burst(g, h.x + (i - 1) * 36, h.y + 22, 8, 45, 120);
        // ⚙️ každá turetka se zrodí s jiskrovou vlnou
        shock(g, h.x + (i - 1) * 36, h.y + 22, 95, 45, 0.4, 5, 0.2);
      }
      playSfx(g, "turret");
      break;
    }
  }
}

function weaponLvl(g: Game, id: string): number {
  for (const w of g.weapons) if (w.id === id) return w.lvl;
  return 0;
}

// zbraň lze vzít, jen když je nevlastněná (místo < 3) nebo levelovaná (< 5)
// v sandboxu je slotů neomezeně - poskládej si všech zbraní najednou
function weaponAvail(g: Game, id: string): boolean {
  if (hasWeapon(g, id)) return weaponLvl(g, id) < 5;
  return g.weapons.length < (g.sandbox ? 99 : 3);
}

// classa povoluje jen své karty - fyzické classy neberou magii a naopak
function upgradeAllowed(g: Game, u: Upgrade): boolean {
  const cls = CLASSES.find((c) => c.id === g.cls) || CLASSES[0];
  if (u.id.startsWith("w_")) {
    // ⚙️ inženýr si žádné zbraně nebere - bojují za něj turetky (max 3)
    if (g.cls === "engineer") return false;
    const def = WEAPONS[u.id.slice(2)];
    if (def) {
      if (!cls.magic && def.magic) return false;
      if (cls.magic && !def.magic) return false;
    }
  } else if (u.magic && !cls.magic) {
    return false;
  }
  if (u.avail && !u.avail(g)) return false;
  return true;
}

function weaponRate(def: WeaponDef, lvl: number): number {
  let r = def.rate * (1 + 0.12 * (lvl - 1));
  if (lvl >= 5 && def.id === "mg") r *= 1.5;
  if (lvl >= 5 && def.id === "flamethrower") r *= 1.3;
  if (lvl >= 5 && def.id === "pistol") r *= 1.35;
  return r;
}

function addWeapon(g: Game, id: string): void {
  const def = WEAPONS[id];
  if (hasWeapon(g, id)) {
    // level up zbraně (max 5 = ultimate forma)
    let w: WSlot | null = null;
    for (const x of g.weapons) if (x.id === id) w = x;
    if (!w) return;
    w.lvl = Math.min(5, w.lvl + 1);
    if (w.lvl >= 5) {
      addText(g, g.hero.x, g.hero.y - 34, `⭐ ${def.name} ULTIMÁTNÍ!`, 48, 19);
      burst(g, g.hero.x, g.hero.y, 24, 48, 210);
      g.shake = Math.max(g.shake, 5);
    } else {
      addText(g, g.hero.x, g.hero.y - 32, `${def.emoji} ${def.name} Lv ${w.lvl}!`, 200, 16);
      burst(g, g.hero.x, g.hero.y, 10, 200, 160);
    }
    return;
  }
  if (g.weapons.length >= (g.sandbox ? 99 : 3)) return;
  g.weapons.push({ id, cd: 0.3, lvl: 1 });
  addText(g, g.hero.x, g.hero.y - 30, `${def.emoji} ${def.name}!`, 48, 17);
  burst(g, g.hero.x, g.hero.y, 14, 48, 160);
}

// dynamický popis karty zbraně podle současné úrovně
function describeWeapon(g: Game, id: string, u: Upgrade): Upgrade {
  if (!hasWeapon(g, id)) {
    return { ...u, desc: g.sandbox ? `Nová zbraň: ${WEAPONS[id].name} (sandbox: ∞ slotů)` : `Nová zbraň: ${WEAPONS[id].name} (zbývá ${3 - g.weapons.length} slotů)` };
  }
  const lvl = weaponLvl(g, id);
  if (lvl >= 4) {
    return {
      ...u,
      name: `${WEAPONS[id].name} ⭐`,
      desc: "ULTIMÁTNÍ FORMA - nejvyšší tier!",
      rarity: 6,
    };
  }
  return {
    ...u,
    name: `${WEAPONS[id].name} Lv ${lvl + 1}`,
    desc: `Úroveň ${lvl + 1}/5: +20 % dmg, +12 % kadence`,
  };
}

// ústí zbraně - odkud letí projektily (špička luku, hlaveň pistole, hůlka, házecí ruce)
function muzzleLen(g: Game): number {
  if (g.cls === "archer") return 22;
  if (g.cls === "soldier") return 23;
  if (g.cls === "knight") return 14;
  if (g.cls === "ninja") return 17;
  if (g.cls === "mage") return 20;
  if (g.cls === "vampire") return 12;
  if (g.cls === "druid") return 16;
  if (g.cls === "engineer") return 13;
  return 19;
}

function fireWeapon(g: Game, w: WSlot, tgt: Enemy): void {
  const def = WEAPONS[w.id];
  const h = g.hero;
  const lvl = w.lvl;
  // ♻️ pojistka proti přetečení projektilů (vulkan u síry / sandbox)
  if (!def.melee && g.arrows.length > 400) return;
  // ⚔️ meč - útok na blízko: mohutný švih obloukem s obřím poškozením
  if (def.melee) {
    const range = def.range + lvl * 4;
    const arc = 1.3 + (lvl >= 5 ? 0.4 : 0);
    const a = Math.atan2(tgt.y - h.y, tgt.x - h.x);
    g.slashes.push({ x: h.x, y: h.y, a, r: range, t: 0, dur: 0.22 });
    // ⚔️ slyšitelný švih meče (dřív ticho)
    playSfx(g, "swing");
    let hitAny = false;
    for (const e of g.enemies) {
      if (e.dead) continue;
      if (e.immT && e.immT > 0) continue; // boss v imunitě mezi fázemi
      if ((e.subT ?? 0) > 0) continue; // 🦡 zahrabaný jezevec - pod zemí nezranitelný
      const dx = e.x - h.x;
      const dy = e.y - h.y;
      const d2v = dx * dx + dy * dy;
      const rr = range + e.r;
      if (d2v > rr * rr) continue;
      let da = Math.atan2(dy, dx) - a;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      if (Math.abs(da) > arc) continue;
      const crit = Math.random() < g.stats.crit;
      const dmg = def.dmg * (1 + 0.2 * (lvl - 1)) * (lvl >= 5 ? 1.5 : 1) * heroDmgMul(g) * (crit ? 2 : 1);
      e.hp -= dmg;
      e.flash = 0.09;
      const dd = Math.sqrt(d2v) || 1;
      e.kbx += (dx / dd) * 240;
      e.kby += (dy / dd) * 240;
      dmgText(g, e, dmg, crit, def.id);
      if (crit) playSfx(g, "crit");
      if (e.hp <= 0) killEnemy(g, e);
      hitAny = true;
    }
    if (hitAny) g.shake = Math.max(g.shake, 2.5);
    return;
  }
  let dmgMul = 1 + 0.2 * (lvl - 1);
  // 🌲 třístí mají per 0,5 - multishot jim přidává střelu až každou druhou kartu
  let count = def.count + Math.floor(g.stats.multishot * def.per);
  let pierce = def.pierceBase + g.stats.pierce;
  let chain = def.chain || 0;
  if (lvl >= 5) {
    // ⭐ ultimate formy (5. tier)
    if (def.id === "bow") {
      count += 2;
      pierce += 2;
    } else if (def.id === "darts") {
      count += 2;
    } else if (def.id === "knives") {
      dmgMul *= 1.5;
      pierce += 2;
    } else if (def.id === "shotgun") {
      count += 4;
    } else if (def.id === "mg") {
      dmgMul *= 1.25;
    } else if (def.id === "fireball") {
      dmgMul *= 1.3;
    } else if (def.id === "frost") {
      pierce += 2;
    } else if (def.id === "lightning") {
      dmgMul *= 1.35;
      chain += 4;
    } else if (def.id === "flamethrower") {
      dmgMul *= 1.4;
      count += 2;
    } else if (def.id === "pistol") {
      dmgMul *= 1.5;
    } else if (def.id === "shuriken") {
      count += 2;
      dmgMul *= 1.25;
    } else if (def.id === "splinters") {
      // ⭐ dřevěné třístí: hutnější a širší vějíř
      dmgMul *= 1.4;
      count += 2;
      pierce += 1;
    }
  }
  const baseA = Math.atan2(tgt.y - h.y, tgt.x - h.x);
  const mz = muzzleLen(g);
  playSfx(g, "shoot");
  for (let i = 0; i < count; i++) {
    const off = (i - (count - 1) / 2) * def.spread;
    const a = baseA + off + (Math.random() - 0.5) * def.inacc;
    const crit = Math.random() < g.stats.crit;
    const sp = def.speed * (0.92 + Math.random() * 0.16);
    // rytíř hází střídavě z obou rukou
    const perp = g.cls === "knight" ? ((i % 2) * 2 - 1) * 11 : 0;
    const pa = a + Math.PI / 2;
    g.arrows.push(
      Object.assign(arrowNew(), {
      x: h.x + Math.cos(a) * mz + Math.cos(pa) * perp,
      y: h.y + Math.sin(a) * mz + Math.sin(pa) * perp,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      dmg: def.dmg * dmgMul * heroDmgMul(g) * (crit ? 2 : 1),
      pierce,
      crit,
      life: def.life,
      hits: [],
      kind: def.kind,
      knock: def.knock,
      chain,
      expl: !!def.expl,
      frost: !!def.frost,
      lvl,
      src: def.id,
      })
    );
  }
  const mx = h.x + Math.cos(baseA) * (mz + 4);
  const my = h.y + Math.sin(baseA) * (mz + 4);
  if (def.kind === 3) burst(g, mx, my, 6, 20, 120);
  else if (def.kind === 4) burst(g, mx, my, 2, 40, 70);
  else burst(g, mx, my, 3, 190, 80);
}

function updateGame(g: Game, dt: number, move: Vec, wantDash: boolean): void {
  const h = g.hero;
  g.time += dt;
  g.gtime += dt;
  g.magT = Math.max(0, g.magT - dt);
  h.invuln = Math.max(0, h.invuln - dt);
  h.dashCd = Math.max(0, h.dashCd - dt);
  // ⏱ časovače nových systémů: ultimátum, combo
  g.ultCd = Math.max(0, g.ultCd - dt);
  if (g.comboT > 0) {
    g.comboT -= dt;
    if (g.comboT <= 0) g.combo = 0;
  }
  // 🌙☀️ střídání dne a noci - den 5 minut, pak noc 5 minut, a tak dokola
  const night = Math.floor(g.time / 300) % 2 === 1;
  if (night !== g.night) {
    g.night = night;
    addText(g, h.x, h.y - 60, night ? "🌙 NOC! Nepřátelé silnější a rychlejší!" : "☀️ SVÍTÁ! Nepřátelé oslabli.", night ? 270 : 45, 22);
    g.shake = night ? 10 : 4;
    playSfx(g, night ? "night" : "day");
    burst(g, h.x, h.y, night ? 20 : 14, night ? 270 : 45, 200);
  }
  // ❄️🤢 statusy hrdiny - zpomalení od ledovce a jed od vosy
  h.slowT = Math.max(0, h.slowT - dt);
  if (h.poisT > 0) {
    h.poisT = Math.max(0, h.poisT - dt);
    h.hp -= 3.5 * dt;
    if (Math.random() < dt * 1.2) addText(g, h.x + (Math.random() - 0.5) * 18, h.y - 16, "🤢", 100, 12);
    if (h.hp <= 0) damageHero(g, 1);
  }

  // 🌿 Lesní regenerace (druid) - síla ze země: +1 HP každé 3 s
  g.regenT -= dt;
  if (g.regenT <= 0) {
    g.regenT = 3;
    if (g.cls === "druid" && !g.over && h.hp < h.maxHp) {
      h.hp = Math.min(h.maxHp, h.hp + 1);
      addText(g, h.x + 10, h.y - 20, "+1", 130, 10);
    }
  }

  // pohyb / dash
  const mlen = Math.sqrt(move.x * move.x + move.y * move.y);
  if (mlen > 0.01) {
    h.angle = Math.atan2(move.y, move.x);
    h.dashDir = { x: move.x / mlen, y: move.y / mlen };
  }
  // 🛡️ Železná disciplína (rytíř) - vestoj se počítá jako pevný postoj
  h.stillT = mlen > 0.01 || h.dashT > 0 ? 0 : h.stillT + dt;
  if (wantDash && h.dashCd <= 0 && h.dashT <= 0) {
    h.dashT = HERO.dashDur;
    h.dashCd = HERO.dashCd;
    // 🌫️ Stínový úhyb (ninja) - po úhybu zůstaneš půl vteřiny v kouřovém stínu
    h.invuln = Math.max(h.invuln, g.cls === "ninja" ? 0.55 : HERO.dashDur + 0.06);
    playSfx(g, "dash");
    burst(g, h.x, h.y, 8, 195, 120);
    if (g.cls === "ninja") {
      burst(g, h.x, h.y, 16, 275, 150);
      addText(g, h.x, h.y - 32, "🌫️", 275, 14);
    }
  }
  let vx = 0;
  let vy = 0;
  if (h.dashT > 0) {
    h.dashT -= dt;
    vx = h.dashDir.x * HERO.dashSpeed;
    vy = h.dashDir.y * HERO.dashSpeed;
  } else {
    const sp = HERO.speed * (1 + g.stats.speedMul) * (h.slowT > 0 ? 0.55 : 1);
    vx = move.x * sp;
    vy = move.y * sp;
  }
  h.x = Math.max(20, Math.min(ARENA - 20, h.x + vx * dt));
  h.y = Math.max(20, Math.min(ARENA - 20, h.y + vy * dt));
  // 🌬️ silný vítr postrkuje i tebe
  if (g.weather === "wind") {
    h.x = Math.max(20, Math.min(ARENA - 20, h.x + Math.cos(g.windA) * 16 * dt));
    h.y = Math.max(20, Math.min(ARENA - 20, h.y + Math.sin(g.windA) * 16 * dt));
  }
  // 🏟️ boss aréna - hrdina nemůže ven
  if (g.arena.active) {
    const adx = h.x - g.arena.x;
    const ady = h.y - g.arena.y;
    const ad = Math.sqrt(adx * adx + ady * ady);
    const maxR = g.arena.r - 16;
    if (ad > maxR) {
      h.x = g.arena.x + (adx / ad) * maxR;
      h.y = g.arena.y + (ady / ad) * maxR;
    }
  }

  // každá zbraň střílí sama na nejbližšího nepřítele ve svém dosahu
  for (const w of g.weapons) {
    const def = WEAPONS[w.id];
    w.cd -= dt;
    // ⚙️ TURETKY - místo střelby pokládají na zem turetky (max 3, starší se přemístí)
    if (def.deploy) {
      if (w.cd <= 0) {
        // kadence urychluje i pokládání nových turetek
        w.cd = 7 / (1 + g.stats.fireMul);
        if (g.turrets.length >= 3) g.turrets.shift();
        // druhy se střídají v pořadí, v jakém jsi je odemkl
        const ttype = g.tKinds[g.nextTid % g.tKinds.length];
        // ⚙️ výdrž turetek roste s časem - ať je pozdní vlny nesejmou na jeden dotek
        const thp = turretHp(g);
        g.turrets.push({ x: h.x, y: h.y, cd: 0.4, windCd: 1.2, t: 0, aim: h.angle, id: g.nextTid++, hp: thp, maxHp: thp, type: ttype });
        burst(g, h.x, h.y, 8, 45, 120);
        addText(g, h.x, h.y - 30, `${TURRET_TYPES[ttype].emoji} Turetka!`, 45, 14);
        g.shake = Math.max(g.shake, 2);
      }
      continue;
    }
    let target: Enemy | null = null;
    let bd = def.range * def.range;
    for (const e of g.enemies) {
      if (e.dead) continue;
      // 🦡 zahrabaný jezevec - zbraně do něj netrefí, počkej, až vyleze
      if ((e.subT ?? 0) > 0) continue;
      const d2 = dist2(h.x, h.y, e.x, e.y);
      if (d2 < bd) {
        bd = d2;
        target = e;
      }
    }
    // postava se dívá a míří tam, kam střílí
    if (target) h.angle = Math.atan2(target.y - h.y, target.x - h.x);
    if (target && w.cd <= 0) {
      w.cd = 1 / (weaponRate(def, w.lvl) * (1 + g.stats.fireMul));
      fireWeapon(g, w, target);
    }
  }

  // ⚙️ turetky inženýra - každý druh střílí jinak, normální upgrady (kadence/crit/multishot/průraznost) fungují i na ně
  for (const tu of g.turrets) {
    tu.t += dt;
    tu.cd -= dt;
    const tdef = TURRET_TYPES[tu.type] || TURRET_TYPES.standard;
    const flameMode = g.tcfg.flame && tu.type === "standard";
    if (tu.cd <= 0) {
      // najdi nejbližšího nezahrabaného nepřítele v dosahu turetky
      let tgt: Enemy | null = null;
      const rng = flameMode ? 150 : tdef.rng;
      let bd = rng * rng;
      for (const e of g.enemies) {
        if (e.dead) continue;
        if ((e.subT ?? 0) > 0) continue;
        const d2 = dist2(tu.x, tu.y, e.x, e.y);
        if (d2 < bd) {
          bd = d2;
          tgt = e;
        }
      }
      if (tgt) {
        tu.aim = Math.atan2(tgt.y - tu.y, tgt.x - tu.x);
        // kadence: základní druh × karta turetek × normální upgrade kadence
        const rate = (flameMode ? 8 : g.tcfg.fire * tdef.rate) * (1 + g.stats.fireMul);
        tu.cd = 1 / rate;
        // multishot přidá turetkám další hlavně do vějíře
        const ms = Math.min(2, Math.max(0, g.stats.multishot));
        const shots = (tdef.shots ?? 1) + ms;
        const spread = tdef.spread ?? 0.1;
        for (let i = 0; i < shots; i++) {
          const sa = shots > 1 ? tu.aim + (i - (shots - 1) / 2) * spread : tu.aim;
          const crit = Math.random() < g.stats.crit;
          const dmg = g.tcfg.dmg * (flameMode ? 0.5 : tdef.dmg) * heroDmgMul(g) * (crit ? 2 : 1);
          const sp = flameMode ? 300 : tdef.sp;
          g.arrows.push(
            Object.assign(arrowNew(), {
              x: tu.x + Math.cos(sa) * 10,
              y: tu.y - 2 + Math.sin(sa) * 10,
              vx: Math.cos(sa) * sp,
              vy: Math.sin(sa) * sp,
              dmg,
              pierce: flameMode ? 0 : (tdef.pierce ?? 0) + g.stats.pierce,
              crit,
              life: flameMode ? 0.38 : tdef.life,
              hits: [],
              kind: flameMode ? 8 : tdef.kind,
              knock: flameMode ? 0.2 : tdef.knock,
              chain: flameMode ? 0 : tdef.chain ?? 0,
              expl: !flameMode && !!tdef.expl,
              frost: g.tcfg.frost,
              lvl: 1,
              src: "turret",
            })
          );
        }
      } else {
        tu.cd = 0.25; // žádný cíl - jen projdi smyčku a hledej dál
      }
    }
    // 🌪️ větrná turetka - poryv odhodí nepřátele od turetky
    if (g.tcfg.wind) {
      tu.windCd -= dt;
      if (tu.windCd <= 0) {
        tu.windCd = 1.7;
        let hitAny = false;
        gridEach(tu.x, tu.y, 170, (e) => {
          if (e.dead) return;
          const d2v = dist2(tu.x, tu.y, e.x, e.y);
          if (d2v < 170 * 170) {
            const dd = Math.sqrt(d2v) || 1;
            const kb = e.boss ? 90 : 300;
            e.kbx += ((e.x - tu.x) / dd) * kb;
            e.kby += ((e.y - tu.y) / dd) * kb;
            const wdmg = 2 * heroDmgMul(g);
            e.hp -= wdmg;
            dmgText(g, e, wdmg, false, "turret");
            e.flash = 0.06;
            if (e.hp <= 0) killEnemy(g, e);
            hitAny = true;
          }
        });
        if (hitAny) burst(g, tu.x, tu.y, 10, 195, 130);
      }
    }
  }

  // šípy
  // 🕸️ nejdřív mřížka nepřátel - kolize šípů pak běží jen v sousedství, ne přes celou mapu
  buildGrid(g);
  for (let i = g.arrows.length - 1; i >= 0; i--) {
    const a = g.arrows[i];
    const ppx = a.x;
    const ppy = a.y;
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    // 🌬️ vítr žene i projektil
    if (g.weather === "wind") {
      a.x += Math.cos(g.windA) * 60 * dt;
      a.y += Math.sin(g.windA) * 60 * dt;
    }
    a.life -= dt;
    let remove = a.life <= 0 || a.x < 0 || a.x > ARENA || a.y < 0 || a.y > ARENA;
    if (!remove) {
      let hit = false;
      gridEach(a.x, a.y, 170, (e) => {
        if (hit) return;
        if (e.dead || a.hits.indexOf(e.id) !== -1) return;
        // 🛡️ boss v imunitě - projektily ho proletí bez poškození
        if (e.immT && e.immT > 0) return;
        // 👻 duch ve fázi - prolnul skrze střely
