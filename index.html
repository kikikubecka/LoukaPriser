    ctx.strokeStyle = `rgba(103,232,249,${0.55 + 0.3 * Math.sin(t * 3 + e.id)})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(e.x - e.r * 0.16, e.y + e.r * 0.85);
    ctx.lineTo(e.x + e.r * 0.16, e.y + e.r * 0.85);
    ctx.moveTo(e.x, e.y + e.r * 0.55);
    ctx.lineTo(e.x, e.y + e.r * 0.9);
    ctx.moveTo(e.x - e.r * 0.12, e.y + e.r * 1.0);
    ctx.lineTo(e.x, e.y + e.r * 0.85);
    ctx.lineTo(e.x + e.r * 0.12, e.y + e.r * 1.0);
    ctx.stroke();
  } else if (e.kind === 3) {
    // štvanec - rohy + zavrčený rypák
    ctx.fillStyle = "#7c2d12";
    for (const side of [-1, 1]) {
      const ka = ea + side * 0.5;
      ctx.beginPath();
      ctx.moveTo(e.x + Math.cos(ka) * e.r, e.y + Math.sin(ka) * e.r);
      ctx.lineTo(e.x + Math.cos(ka) * (e.r + 6), e.y + Math.sin(ka) * (e.r + 6));
      ctx.lineTo(e.x + Math.cos(ka + side * 0.45) * e.r, e.y + Math.sin(ka + side * 0.45) * e.r);
      ctx.closePath();
      ctx.fill();
    }
    ctx.strokeStyle = "#450a0a";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(e.x + Math.cos(ea) * e.r * 0.45, e.y + Math.sin(ea) * e.r * 0.45);
    ctx.lineTo(e.x + Math.cos(ea) * e.r * 1.05, e.y + Math.sin(ea) * e.r * 1.05);
    ctx.stroke();
    // zběsilé zoubky v tlamce (rotované s tělem)
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(ea);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(e.r * 0.5, e.r * 0.12);
    ctx.lineTo(e.r * 0.62, e.r * 0.26);
    ctx.lineTo(e.r * 0.74, e.r * 0.12);
    ctx.lineTo(e.r * 0.86, e.r * 0.26);
    ctx.lineTo(e.r * 0.98, e.r * 0.12);
    ctx.stroke();
    // hřbetní srst
    ctx.strokeStyle = "rgba(60,30,10,0.6)";
    ctx.lineWidth = 1.2;
    for (let fi = 0; fi < 5; fi++) {
      ctx.beginPath();
      ctx.moveTo(-e.r * 0.85 + fi * e.r * 0.24, -e.r * 0.38);
      ctx.lineTo(-e.r * 0.78 + fi * e.r * 0.24, -e.r * 0.56);
      ctx.stroke();
    }
    // drápky na všech čtyřech
    ctx.strokeStyle = "#fde68a";
    ctx.lineWidth = 1.3;
    for (let lg = 0; lg < 4; lg++) {
      const lx = -e.r * 0.85 + lg * e.r * 0.42 + e.r * 0.075;
      for (const cside of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(lx, e.r * 0.85);
        ctx.lineTo(lx + cside * e.r * 0.09, e.r * 0.98);
        ctx.stroke();
      }
    }
    // vyplazený jazýček
    ctx.fillStyle = "#f87171";
    ctx.beginPath();
    ctx.ellipse(e.r * 0.72, e.r * 0.16, e.r * 0.15, e.r * 0.07, 0.3, 0, Math.PI * 2);
    ctx.fill();
    // tmavší hřbet (dvojtónová srst)
    ctx.fillStyle = "rgba(45,28,12,0.6)";
    ctx.beginPath();
    ctx.ellipse(-e.r * 0.5, -e.r * 0.05, e.r * 0.5, e.r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    // černý nos na rypáku
    ctx.fillStyle = "#1c1917";
    ctx.beginPath();
    ctx.arc(e.r * 1.05, -e.r * 0.04, e.r * 0.09, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else if (e.kind === 9) {
    // 🌟 elitní příšera - zářící fialová aura + rotační hroty
    ctx.strokeStyle = `rgba(192,38,211,${0.45 + 0.3 * Math.sin(t * 6 + e.id)})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 5, 0, Math.PI * 2);
    ctx.stroke();
    for (let hi = 0; hi < 5; hi++) {
      const ha = (hi / 5) * Math.PI * 2 + t * 1.2;
      ctx.beginPath();
      ctx.moveTo(e.x + Math.cos(ha) * e.r, e.y + Math.sin(ha) * e.r);
      ctx.lineTo(e.x + Math.cos(ha) * (e.r + 9), e.y + Math.sin(ha) * (e.r + 9));
      ctx.stroke();
    }
    // pulzující drahokamové jádro
    ctx.fillStyle = `rgba(244,114,182,${0.6 + 0.3 * Math.sin(t * 5 + e.id)})`;
    ctx.beginPath();
    ctx.moveTo(e.x, e.y - e.r * 0.3);
    ctx.lineTo(e.x + e.r * 0.3, e.y);
    ctx.lineTo(e.x, e.y + e.r * 0.3);
    ctx.lineTo(e.x - e.r * 0.3, e.y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath();
    ctx.arc(e.x - e.r * 0.08, e.y - e.r * 0.1, e.r * 0.07, 0, Math.PI * 2);
    ctx.fill();
  } else if (e.kind === 10) {
    // 💣 dynamiter - horník: svítící lampa na přilbě, knír, kombinéza a svazek dynamitu mířící na hrdinu
    // svítící lampa na přilbě
    const lampA = 0.6 + 0.3 * Math.sin(t * 8 + e.id);
    ctx.fillStyle = `rgba(253,224,71,${lampA})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y - e.r * 0.66, e.r * 0.11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(253,224,71,${lampA * 0.3})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y - e.r * 0.66, e.r * 0.22, 0, Math.PI * 2);
    ctx.fill();
    // knír
    ctx.strokeStyle = "#57534e";
    ctx.lineWidth = Math.max(1.6, e.r * 0.11);
    ctx.beginPath();
    ctx.moveTo(e.x - e.r * 0.18, e.y + e.r * 0.1);
    ctx.lineTo(e.x, e.y + e.r * 0.05);
    ctx.lineTo(e.x + e.r * 0.18, e.y + e.r * 0.1);
    ctx.stroke();
    // kšandy kombinézy
    ctx.strokeStyle = "#78350f";
    ctx.lineWidth = Math.max(1.4, e.r * 0.09);
    ctx.beginPath();
    ctx.moveTo(e.x - e.r * 0.22, e.y + e.r * 0.32);
    ctx.lineTo(e.x - e.r * 0.13, e.y + e.r * 0.9);
    ctx.moveTo(e.x + e.r * 0.22, e.y + e.r * 0.32);
    ctx.lineTo(e.x + e.r * 0.13, e.y + e.r * 0.9);
    ctx.stroke();
    // svazek dynamitu natažený k hrdinovi
    const bx = e.x + Math.cos(ea) * (e.r + 9);
    const by = e.y + Math.sin(ea) * (e.r + 9);
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(ea + Math.PI / 2);
    ctx.fillStyle = "#dc2626";
    for (let di = -1; di <= 1; di++) {
      ctx.fillRect(di * e.r * 0.16 - e.r * 0.07, -e.r * 0.28, e.r * 0.14, e.r * 0.56);
    }
    ctx.restore();
    // doutnající knot na svazku
    const spark = 0.5 + 0.5 * Math.sin(t * 13 + e.id);
    ctx.strokeStyle = "#d97706";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx, by - e.r * 0.28);
    ctx.quadraticCurveTo(bx + e.r * 0.3, by - e.r * 0.5, bx + e.r * 0.18, by - e.r * 0.8);
    ctx.stroke();
    ctx.fillStyle = `rgba(251,191,36,${0.5 + spark * 0.5})`;
    ctx.beginPath();
    ctx.arc(bx + e.r * 0.18, by - e.r * 0.85, 2 + spark * 1.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(249,115,22,${spark * 0.4})`;
    ctx.beginPath();
    ctx.arc(bx + e.r * 0.18, by - e.r * 0.85, 4 + spark * 2.2, 0, Math.PI * 2);
    ctx.fill();
  } else if (e.kind === 11) {
    // ⛏️ miner - lampa na přilbě, plnovous, kšandy a krumpáč u boku (mizí při hodu)
    const lampB = 0.55 + 0.35 * Math.sin(t * 7 + e.id);
    ctx.fillStyle = `rgba(253,224,71,${lampB})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y - e.r * 0.74, e.r * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(253,224,71,${lampB * 0.3})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y - e.r * 0.74, e.r * 0.24, 0, Math.PI * 2);
    ctx.fill();
    // plnovous
    ctx.fillStyle = "#9a3412";
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + e.r * 0.16, e.r * 0.26, e.r * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    // kšandy kombinézy
    ctx.strokeStyle = "#78350f";
    ctx.lineWidth = Math.max(1.4, e.r * 0.09);
    ctx.beginPath();
    ctx.moveTo(e.x - e.r * 0.28, e.y + e.r * 0.3);
    ctx.lineTo(e.x - e.r * 0.15, e.y + e.r * 0.88);
    ctx.moveTo(e.x + e.r * 0.28, e.y + e.r * 0.3);
    ctx.lineTo(e.x + e.r * 0.15, e.y + e.r * 0.88);
    ctx.stroke();
    // krumpáč u boku mířící na hrdinu - drží ho jen mezi hody
    if (e.shootCd > 1) {
      ctx.save();
      ctx.translate(e.x + Math.cos(ea) * e.r * 0.72, e.y + Math.sin(ea) * e.r * 0.72);
      ctx.rotate(ea + 0.7);
      ctx.strokeStyle = "#8b5a2b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-7, 6);
      ctx.lineTo(8, -5);
      ctx.stroke();
      ctx.strokeStyle = "#d4d4d8";
      ctx.lineWidth = 3.6;
      ctx.beginPath();
      ctx.arc(1, -3, 10, -Math.PI * 0.75, -Math.PI * 0.25);
      ctx.stroke();
      ctx.restore();
    }
  } else if (e.kind === 12) {
    // 🐝 vosa - třepetající křidélka a černé pruhy na těle
    const fl = 0.35 + 0.3 * Math.sin(t * 26 + e.id);
    ctx.fillStyle = `rgba(226,232,240,${fl})`;
    ctx.beginPath();
    ctx.ellipse(e.x - e.r * 0.85, e.y - e.r * 0.15, e.r * 0.5, e.r * 0.22, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(e.x + e.r * 0.85, e.y - e.r * 0.15, e.r * 0.5, e.r * 0.22, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#18181b";
    for (let s = 0; s < 2; s++) {
      ctx.beginPath();
      ctx.ellipse(e.x, e.y + e.r * (0.3 + s * 0.36), e.r * (0.82 - s * 0.06), e.r * 0.13, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (e.kind === 13) {
    // 🦡 jezevec - černé pruhy přes tvář a rypák
    ctx.fillStyle = "#18181b";
    ctx.beginPath();
    ctx.ellipse(e.x - e.r * 0.32, e.y - e.r * 0.35, e.r * 0.13, e.r * 0.42, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(e.x + e.r * 0.32, e.y - e.r * 0.35, e.r * 0.13, e.r * 0.42, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#57534e";
    ctx.beginPath();
    ctx.ellipse(e.x, e.y - e.r * 0.2, e.r * 0.14, e.r * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (e.kind === 14) {
    // ☠️ kostlivec - prasklá lebka; po povstání z kostí září zelenou
    if (e.revived) {
      ctx.strokeStyle = `rgba(74,222,128,${0.45 + 0.3 * Math.sin(t * 6 + e.id)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.strokeStyle = "#4b5563";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(e.x - e.r * 0.2, e.y - e.r * 0.78);
    ctx.lineTo(e.x + e.r * 0.12, e.y - e.r * 0.68);
    ctx.stroke();
  } else if (e.kind === 15) {
    // 🔥 sopkaš - plamenová hříva a jiskřičky
    ctx.fillStyle = "rgba(251,146,60,0.9)";
    ctx.beginPath();
    ctx.moveTo(e.x - e.r * 0.5, e.y - e.r * 0.78);
    ctx.lineTo(e.x - e.r * 0.2, e.y - e.r * (1.25 + 0.15 * Math.sin(t * 9 + e.id)));
    ctx.lineTo(e.x, e.y - e.r * 0.85);
    ctx.lineTo(e.x + e.r * 0.2, e.y - e.r * (1.3 + 0.1 * Math.cos(t * 8 + e.id)));
    ctx.lineTo(e.x + e.r * 0.5, e.y - e.r * 0.78);
    ctx.closePath();
    ctx.fill();
    const fk = 0.6 + 0.4 * Math.sin(t * 11 + e.id * 2);
    ctx.fillStyle = `rgba(254,240,138,${fk})`;
    ctx.beginPath();
    ctx.arc(e.x - e.r * 0.16, e.y - e.r * 0.95, e.r * 0.1, 0, Math.PI * 2);
    ctx.fill();
  } else if (e.kind === 16) {
    // ❄️ ledovec - rampouchy na hlavě a ledový opar
    ctx.fillStyle = "#e0f2fe";
    for (let ic = -1; ic <= 1; ic++) {
      ctx.beginPath();
      ctx.moveTo(e.x + ic * e.r * 0.28 - e.r * 0.08, e.y - e.r * 0.82);
      ctx.lineTo(e.x + ic * e.r * 0.28, e.y - e.r * (1.3 - Math.abs(ic) * 0.12));
      ctx.lineTo(e.x + ic * e.r * 0.28 + e.r * 0.08, e.y - e.r * 0.82);
      ctx.closePath();
      ctx.fill();
    }
    const mist = 0.18 + 0.12 * Math.sin(t * 3 + e.id);
    ctx.fillStyle = `rgba(186,230,253,${mist})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y + e.r * 0.1, e.r * 1.15, 0, Math.PI * 2);
    ctx.fill();
  }
  // zpomalený mrazem - ledový kroužek
  if (e.slow > 0) {
    ctx.strokeStyle = "rgba(165,243,252,0.85)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 3, 0, Math.PI * 2);
    ctx.stroke();
  }
  // hp bar, jen když je zraněný
  if (e.hp < e.maxHp) {
    const w = e.r * 2;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(e.x - w / 2, e.y - e.r - 9, w, 4);
    ctx.fillStyle = e.elite ? "#fde047" : "#f87171";
    ctx.fillRect(e.x - w / 2, e.y - e.r - 9, w * Math.max(0, e.hp / e.maxHp), 4);
  }
}

// 🚀 optimalizace: statické pozadí louky (tráva, kytičky, pruhy, mřížka) se přerenderuje
// jen jednou za run do offscreen canvasu - při hře se jen jednou blitne, místo stovek kreseb za frame
let worldBg: { cv: HTMLCanvasElement | null; stars: Star[] | null } = { cv: null, stars: null };
function getWorldBg(g: Game): HTMLCanvasElement | null {
  if (worldBg.cv && worldBg.stars === g.stars) return worldBg.cv;
  if (typeof document === "undefined") return null;
  const cv = document.createElement("canvas");
  // 🚀 poloviční rozlišení + škálování při kreslení - 6000×6000 px by žralo ~144 MB RAM,
  // v polovině žere čtvrtinu a tráva je stejně jen měkká textura
  const BG_SCALE = 0.5;
  cv.width = ARENA * BG_SCALE;
  cv.height = ARENA * BG_SCALE;
  const c = cv.getContext("2d");
  if (!c) return null;
  c.scale(BG_SCALE, BG_SCALE);
  // posekané pruhy trávníku
  const sgs = 160;
  c.fillStyle = "rgba(190,255,170,0.06)";
  for (let x = 0; x < ARENA; x += sgs) c.fillRect(x, 0, sgs / 2, ARENA);
  // mřížka
  c.strokeStyle = "rgba(10,40,10,0.22)";
  c.lineWidth = 1;
  c.beginPath();
  for (let x = 0; x <= ARENA; x += 80) {
    c.moveTo(x, 0);
    c.lineTo(x, ARENA);
  }
  for (let y = 0; y <= ARENA; y += 80) {
    c.moveTo(0, y);
    c.lineTo(ARENA, y);
  }
  c.stroke();
  // trsy trávy a kytičky - stejné rozložení jako dřív, ale nakreslené jen jednou
  let si = 0;
  for (const s of g.stars) {
    si++;
    if (si % 11 === 0) {
      const fc = si % 33 === 0 ? "#fde68a" : si % 22 === 0 ? "#f9a8d4" : "#fca5a5";
      c.fillStyle = fc;
      for (let pet = 0; pet < 4; pet++) {
        const pa = (pet / 4) * Math.PI * 2 + s.r;
        c.beginPath();
        c.arc(s.x + Math.cos(pa) * 1.6, s.y + Math.sin(pa) * 1.6, 1.5, 0, Math.PI * 2);
        c.fill();
      }
      c.fillStyle = "#facc15";
      c.beginPath();
      c.arc(s.x, s.y, 0.9, 0, Math.PI * 2);
      c.fill();
    } else {
      c.fillStyle = si % 2 === 0 ? "rgba(120,200,110,0.55)" : "rgba(40,100,45,0.8)";
      c.fillRect(s.x, s.y, 2, 3 + s.r * 3);
    }
  }
  worldBg = { cv, stars: g.stars };
  return cv;
}

// 🚀 cache fontů letících textů - žádné skládání řetězců každý snímek
const FT_FONTS: Record<number, string> = {};

// 🎨 kreslí jeden dekorativní strom/keř do libovolného kontextu (jednou, při tvorbě sprite)
function paintTree(c: CanvasRenderingContext2D, tr: TreeDeco): void {
  const rn = tr.rn;
  const sway = 0;
  // stín
  c.fillStyle = "rgba(0,0,0,0.25)";
  c.beginPath();
  c.ellipse(tr.x + 5, tr.y + 6, tr.r * 1.05, tr.r * 0.42, 0, 0, Math.PI * 2);
  c.fill();
  if (tr.k === 0) {
    // --- strom: kmen s přechodem a kořenovým pakůtkem ---
    const cx = tr.x + sway * 0.3;
    const cy = tr.y - tr.r * 0.5;
    const tg = c.createLinearGradient(tr.x - 4, 0, tr.x + 4, 0);
    tg.addColorStop(0, "#9a6b3f");
    tg.addColorStop(0.55, "#6b4226");
    tg.addColorStop(1, "#3f2413");
    c.fillStyle = tg;
    c.beginPath();
    c.moveTo(cx - 3.5, cy);
    c.lineTo(cx + 3.5, cy);
    c.lineTo(cx + 2, tr.y + tr.r * 0.5);
    c.lineTo(cx - 2, tr.y + tr.r * 0.5);
    c.closePath();
    c.fill();
    c.beginPath();
    c.ellipse(cx, tr.y + tr.r * 0.5, 6, 2.5, 0, 0, Math.PI * 2);
    c.fill();
    // uzel na kmeni
    c.fillStyle = "rgba(30,15,5,0.4)";
    c.beginPath();
    c.ellipse(cx + 0.8, cy + tr.r * 0.28, 1.6, 2.4, 0, 0, Math.PI * 2);
    c.fill();
    // koruna - tmavý podklad
    const hx2 = cx + sway;
    const hy2 = cy - tr.r * 0.12;
    c.fillStyle = "#16351c";
    c.beginPath();
    c.arc(hx2, hy2, tr.r * 1.05, 0, Math.PI * 2);
    c.fill();
    // pět bochánků listí
    for (let b = 0; b < 5; b++) {
      const ba = (b / 5) * Math.PI * 2 + rn * 6.28 + (b % 2) * 0.4;
      const br = tr.r * (0.42 + (((b * 7) + rn * 13) % 10) / 30);
      c.fillStyle = b % 2 ? "#2d6a2e" : "#256028";
      c.beginPath();
      c.arc(hx2 + Math.cos(ba) * tr.r * 0.55, hy2 + Math.sin(ba) * tr.r * 0.44, br, 0, Math.PI * 2);
      c.fill();
    }
    // spodní stín koruny (objem zespodu)
    c.fillStyle = "rgba(6,24,10,0.28)";
    c.beginPath();
    c.ellipse(hx2, hy2 + tr.r * 0.62, tr.r * 0.62, tr.r * 0.3, 0, 0, Math.PI * 2);
    c.fill();
    // světlá kopice listí + odlesk
    c.fillStyle = "#48a04a";
    c.beginPath();
    c.arc(hx2 - tr.r * 0.28, hy2 - tr.r * 0.35, tr.r * 0.45, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "rgba(190,242,160,0.4)";
    c.beginPath();
    c.arc(hx2 - tr.r * 0.42, hy2 - tr.r * 0.48, tr.r * 0.22, 0, Math.PI * 2);
    c.fill();
    // tmavý obrys koruny
    c.strokeStyle = "rgba(10,30,14,0.55)";
    c.lineWidth = 2;
    c.beginPath();
    c.arc(hx2, hy2, tr.r * 1.05, 0, Math.PI * 2);
    c.stroke();
    // plody s lesklým jadérkem
    if (tr.r > 24 || rn > 0.55) {
      for (let f = 0; f < 3; f++) {
        const fa = rn * 6.28 + f * 2.3;
        const fx = hx2 + Math.cos(fa) * tr.r * 0.55;
        const fy = hy2 + Math.sin(fa) * tr.r * 0.5;
        c.fillStyle = "#ef4444";
        c.beginPath();
        c.arc(fx, fy, 2.3, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = "rgba(255,255,255,0.55)";
        c.beginPath();
        c.arc(fx - 0.7, fy - 0.7, 0.7, 0, Math.PI * 2);
        c.fill();
      }
    }
    // trs trávy u paty stromu
    c.fillStyle = "rgba(120,200,110,0.55)";
    c.fillRect(tr.x - 9, tr.y + tr.r * 0.5, 2, 4);
    c.fillRect(tr.x + 7, tr.y + tr.r * 0.45, 2, 4);
    c.fillStyle = "rgba(40,100,45,0.8)";
    c.fillRect(tr.x - 3, tr.y + tr.r * 0.55, 2, 5);
  } else if (tr.k === 2) {
    // --- muchomůrka: červená kloboučka s bílými tečkami a noha ---
    const cx = tr.x + sway * 0.2;
    const capY = tr.y - tr.r * 0.55;
    // noha
    c.fillStyle = "#e7d8c3";
    c.beginPath();
    c.moveTo(cx - tr.r * 0.22, capY);
    c.lineTo(cx + tr.r * 0.22, capY);
    c.lineTo(cx + tr.r * 0.3, tr.y + tr.r * 0.6);
    c.lineTo(cx - tr.r * 0.3, tr.y + tr.r * 0.6);
    c.closePath();
    c.fill();
    // kloboučka
    c.fillStyle = "#dc2626";
    c.beginPath();
    c.ellipse(cx, capY, tr.r * 0.95, tr.r * 0.68, 0, Math.PI, Math.PI * 2);
    c.fill();
    c.fillStyle = "rgba(120,10,10,0.4)";
    c.beginPath();
    c.ellipse(cx, capY, tr.r * 0.95, tr.r * 0.68, 0, Math.PI * 0.15, Math.PI * 0.85);
    c.fill();
    // bílé tečky
    c.fillStyle = "#fff";
    for (let d = 0; d < 4; d++) {
      const da = rn * 6.28 + d * 1.7;
      c.beginPath();
      c.arc(cx + Math.cos(da) * tr.r * 0.5, capY - tr.r * 0.28 + Math.sin(da) * tr.r * 0.1, 1.4, 0, Math.PI * 2);
      c.fill();
    }
    // spodní okraj kloboučky
    c.fillStyle = "#f3e8e0";
    c.fillRect(cx - tr.r * 0.85, capY - 1.5, tr.r * 1.7, 2.5);
    // trs trávy
    c.fillStyle = "rgba(120,200,110,0.6)";
    c.fillRect(tr.x - 5, tr.y + tr.r * 0.5, 2, 4);
    c.fillRect(tr.x + 3, tr.y + tr.r * 0.45, 2, 4);
  } else if (tr.k === 3) {
    // --- kámen: šedý balvan s odleskem a prasklinou ---
    const gx = tr.x + sway * 0.15;
    c.fillStyle = "#78716c";
    c.beginPath();
    c.moveTo(gx - tr.r, tr.y + tr.r * 0.5);
    c.lineTo(gx - tr.r * 0.75, tr.y - tr.r * 0.55);
    c.lineTo(gx - tr.r * 0.15, tr.y - tr.r * 0.85);
    c.lineTo(gx + tr.r * 0.6, tr.y - tr.r * 0.6);
    c.lineTo(gx + tr.r * 0.95, tr.y + tr.r * 0.1);
    c.lineTo(gx + tr.r * 0.7, tr.y + tr.r * 0.5);
    c.closePath();
    c.fill();
    // světlejší horní plocha
    c.fillStyle = "#a8a29e";
    c.beginPath();
    c.moveTo(gx - tr.r * 0.6, tr.y - tr.r * 0.4);
    c.lineTo(gx - tr.r * 0.15, tr.y - tr.r * 0.78);
    c.lineTo(gx + tr.r * 0.5, tr.y - tr.r * 0.55);
    c.lineTo(gx + tr.r * 0.3, tr.y - tr.r * 0.15);
    c.lineTo(gx - tr.r * 0.3, tr.y - tr.r * 0.1);
    c.closePath();
    c.fill();
    // odlesk
    c.fillStyle = "rgba(255,255,255,0.25)";
    c.beginPath();
    c.arc(gx - tr.r * 0.25, tr.y - tr.r * 0.45, tr.r * 0.16, 0, Math.PI * 2);
    c.fill();
    // prasklina
    c.strokeStyle = "rgba(41,37,36,0.5)";
    c.lineWidth = 1.3;
    c.beginPath();
    c.moveTo(gx + tr.r * 0.1, tr.y - tr.r * 0.5);
    c.lineTo(gx + tr.r * 0.2, tr.y - tr.r * 0.1);
    c.lineTo(gx + tr.r * 0.05, tr.y + tr.r * 0.3);
    c.stroke();
    // mech při patě
    c.fillStyle = "rgba(74,124,54,0.6)";
    c.beginPath();
    c.ellipse(gx - tr.r * 0.5, tr.y + tr.r * 0.3, tr.r * 0.3, tr.r * 0.14, 0, 0, Math.PI * 2);
    c.fill();
  } else if (tr.k === 4) {
    // --- bobulový keř: svěží bochánky plné modrých bobulí ---
    const bx2 = tr.x + sway * 0.5;
    c.fillStyle = "#2c5e1f";
    for (let b = 0; b < 3; b++) {
      const ba = (b / 3) * Math.PI * 2 + rn * 5;
      c.beginPath();
      c.arc(bx2 + Math.cos(ba) * tr.r * 0.35, tr.y + Math.sin(ba) * tr.r * 0.28, tr.r * 0.62, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = "#4d8f35";
    for (let b = 0; b < 3; b++) {
      const ba = (b / 3) * Math.PI * 2 + rn * 5 + 0.5;
      c.beginPath();
      c.arc(bx2 + Math.cos(ba) * tr.r * 0.25, tr.y - tr.r * 0.2 + Math.sin(ba) * tr.r * 0.2, tr.r * 0.48, 0, Math.PI * 2);
      c.fill();
    }
    // modrofialové bobule s leskem
    for (let f = 0; f < 6; f++) {
      const fa = rn * 9 + f * 1.15;
      const fx = bx2 + Math.cos(fa) * tr.r * 0.42;
      const fy = tr.y - tr.r * 0.15 + Math.sin(fa) * tr.r * 0.3;
      c.fillStyle = "#6d28d9";
      c.beginPath();
      c.arc(fx, fy, 1.8, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = "rgba(216,180,254,0.7)";
      c.beginPath();
      c.arc(fx - 0.5, fy - 0.5, 0.6, 0, Math.PI * 2);
      c.fill();
    }
  } else {
    // --- keř: tři bochánky s obrysem a bobulemi ---
    const bx2 = tr.x + sway * 0.5;
    c.fillStyle = "#1c4517";
    for (let b = 0; b < 3; b++) {
      const ba = (b / 3) * Math.PI * 2 + rn * 5;
      c.beginPath();
      c.arc(bx2 + Math.cos(ba) * tr.r * 0.35, tr.y + Math.sin(ba) * tr.r * 0.28, tr.r * 0.62, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = "#35742a";
    for (let b = 0; b < 3; b++) {
      const ba = (b / 3) * Math.PI * 2 + rn * 5 + 0.5;
      c.beginPath();
      c.arc(bx2 + Math.cos(ba) * tr.r * 0.25, tr.y - tr.r * 0.2 + Math.sin(ba) * tr.r * 0.2, tr.r * 0.48, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = "rgba(255,255,255,0.2)";
    c.beginPath();
    c.arc(bx2 - tr.r * 0.3, tr.y - tr.r * 0.35, tr.r * 0.28, 0, Math.PI * 2);
    c.fill();
    if (rn > 0.4) {
      c.fillStyle = "#b91c1c";
      for (let f = 0; f < 3; f++) {
        const fa = rn * 9 + f * 2.1;
        c.beginPath();
        c.arc(bx2 + Math.cos(fa) * tr.r * 0.4, tr.y + Math.sin(fa) * tr.r * 0.3, 1.6, 0, Math.PI * 2);
        c.fill();
      }
    }
  }
}

// 🌳 předrenderuje strom do vlastního sprite - pak už jen drawImage (místo desítek cest každý snímek)
function makeTreeSprite(tr: TreeDeco): HTMLCanvasElement {
  const pad = Math.ceil(tr.r * 0.7) + 10;
  const size = Math.ceil(tr.r * 2 + pad * 2);
  const cv = document.createElement("canvas");
  cv.width = size;
  cv.height = size;
  const c = cv.getContext("2d");
  if (c) {
    c.translate(size / 2 - tr.x, size / 2 - tr.y);
    paintTree(c, tr);
  }
  tr.pad = size / 2;
  return cv;
}

function render(ctx: CanvasRenderingContext2D, g: Game, joy: Joy): void {
  const h = g.hero;
  const zoom = 1;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 📏 spodek HUD lišty měříme z DOM (1× za 20 snímků) - minimapa a boss bar se pod něj nikdy nedostanou
  if ((mmFC++ % 20) === 0) {
    const hudEl = document.querySelector(".ltp-hud");
    MM_Y = Math.max(58, (hudEl ? hudEl.getBoundingClientRect().bottom : 48) + 8);
  }

  // 🎨 pozadí se přechází jen při změně výšky - jeden gradient se cacheuje
  if (!bgCache || bgCache.h !== VH) {
    const b = ctx.createLinearGradient(0, 0, 0, VH);
    b.addColorStop(0, "#265231");
    b.addColorStop(1, "#12321d");
    bgCache = { g: b, h: VH };
  }
  ctx.fillStyle = bgCache.g;
  ctx.fillRect(0, 0, VW, VH);

  const sh = g.opts.shk ? g.shake : 0; // 📴 třesení lze vypnout v pauze
  const ox = sh > 0 ? (Math.random() - 0.5) * sh : 0;
  const oy = sh > 0 ? (Math.random() - 0.5) * sh : 0;

  ctx.save();
  ctx.translate(VW / 2 + ox, VH / 2 + oy);
  ctx.scale(zoom, zoom);
  ctx.translate(-h.x, -h.y);

  const halfW = VW / 2 / zoom;
  const halfH = VH / 2 / zoom;
  const inView = (x: number, y: number, pad = 60) =>
    x > h.x - halfW - pad && x < h.x + halfW + pad && y > h.y - halfH - pad && y < h.y + halfH + pad;

  if (fxCache.ctx !== ctx || fxCache.w !== VW || fxCache.h !== VH || !fxCache.n1 || !fxCache.n2 || !fxCache.vg || !fxCache.lg || !fxCache.gl) {
    const n1 = ctx.createRadialGradient(ARENA * 0.3, ARENA * 0.3, 0, ARENA * 0.3, ARENA * 0.3, 800);
    n1.addColorStop(0, "rgba(250,240,150,0.12)");
    n1.addColorStop(1, "rgba(250,240,150,0)");
    const n2 = ctx.createRadialGradient(ARENA * 0.72, ARENA * 0.7, 0, ARENA * 0.72, ARENA * 0.7, 700);
    n2.addColorStop(0, "rgba(150,230,120,0.10)");
    n2.addColorStop(1, "rgba(150,230,120,0)");
    const vg = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VW * 0.7);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.5)");
    // 🩸 rudá vinětace při nízkém HP - jeden gradient pro všechny snímky
    const lg = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.32, VW / 2, VH / 2, VW * 0.72);
    lg.addColorStop(0, "rgba(170,15,15,0)");
    lg.addColorStop(1, "rgba(170,15,15,1)");
    // 🥇 zlatá vinětace - beat puls ve stylu Just Dance a fever hype
    const gl = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.36, VW / 2, VH / 2, VW * 0.74);
    gl.addColorStop(0, "rgba(253,224,71,0)");
    gl.addColorStop(1, "rgba(253,224,71,1)");
    fxCache = { ctx, n1, n2, vg, lg, gl, w: VW, h: VH };
  }
  if (inView(ARENA * 0.3, ARENA * 0.3, 850)) {
    ctx.fillStyle = fxCache.n1!;
    ctx.fillRect(ARENA * 0.3 - 800, ARENA * 0.3 - 800, 1600, 1600);
  }
  if (inView(ARENA * 0.72, ARENA * 0.7, 750)) {
    ctx.fillStyle = fxCache.n2!;
    ctx.fillRect(ARENA * 0.72 - 700, ARENA * 0.7 - 700, 1400, 1400);
  }

  // travnatá podlaha - jediný blit z předrenderované cache (tráva, kytičky, pruhy, mřížka)
  const wbg = getWorldBg(g);
  if (wbg) {
    // 🚀 blit JEN výřezu kamery - kreslit celou 6000² mapu každý snímek byl hlavní žrout FPS
    const bs = 0.5;
    const sx = Math.max(0, h.x - halfW - 60);
    const sy = Math.max(0, h.y - halfH - 60);
    const sw = Math.min(ARENA - sx, VW + 120);
    const sh = Math.min(ARENA - sy, VH + 120);
    ctx.drawImage(wbg, sx * bs, sy * bs, sw * bs, sh * bs, sx, sy, sw, sh);
  }
  // 🕯️ měkké světlo hrdiny - jako by nesl lampu (Survivor.io focus na postavu)
  // gradient se vytvoří jen jednou; posun kolem hrdiny řeší translate při kreslení
  if (!hlgCache) {
    hlgCache = ctx.createRadialGradient(0, 0, 0, 0, 0, 200);
    hlgCache.addColorStop(0, "rgba(255,250,200,0.11)");
    hlgCache.addColorStop(1, "rgba(255,250,200,0)");
  }
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.fillStyle = hlgCache;
  ctx.fillRect(-200, -200, 400, 400);
  ctx.restore();

  // ✨ světlušky po louce (chvilkové problikávání) - počet škáluje s mapou, ať neztratí
  const ffN = Math.min(30, Math.max(12, Math.round(ARENA / 280)));
  for (let i = 0; i < ffN; i++) {
    const ffx = ((i * 473) % ARENA) + Math.sin(g.gtime * 0.7 + i * 2.3) * 60;
    const ffy = ((i * 887) % ARENA) + Math.cos(g.gtime * 0.9 + i * 1.7) * 45;
    if (!inView(ffx, ffy, 12)) continue;
    const fa = 0.3 + 0.3 * Math.sin(g.gtime * 3 + i * 2.7);
    ctx.fillStyle = `rgba(253,230,138,${fa})`;
    ctx.beginPath();
    ctx.arc(ffx, ffy, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }

  // hranice arény - dřevěný plot
  ctx.strokeStyle = "rgba(133,84,44,0.28)";
  ctx.lineWidth = 16;
  ctx.strokeRect(0, 0, ARENA, ARENA);
  ctx.strokeStyle = "#b0793f";
  ctx.lineWidth = 5;
  ctx.strokeRect(0, 0, ARENA, ARENA);

  // 🌳 stromy a keře - vrstvené koruny, kmeny s kořeny, houpející se listí
  // 🌳 stromy a keře - předrenderované sprite + lehký výkyv celého stromu (místo stovek cest každý snímek)
  for (const tr of g.trees) {
    if (!inView(tr.x, tr.y, tr.r + 42)) continue;
    if (!tr.cv) tr.cv = makeTreeSprite(tr);
    const sway = Math.sin(g.gtime * 1.3 + tr.x * 0.07 + tr.rn * 6) * 1.8;
    ctx.drawImage(tr.cv, Math.round(tr.x - (tr.pad || 0) + sway), Math.round(tr.y - (tr.pad || 0)));
  }

  // 🏟️ boss aréna - červený kruh vězení
  if (g.arena.active) {
    const a = g.arena;
    ctx.fillStyle = "rgba(120,10,20,0.10)";
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(248,113,113,${0.55 + 0.3 * Math.sin(g.gtime * 4)})`;
    ctx.lineWidth = 5;
    ctx.setLineDash([18, 12]);
    ctx.lineDashOffset = -g.gtime * 40;
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }

  // ⚠️ telegrafy bossů - červené zóny dopadu projektilů
  for (const tl of g.telegraphs) {
    if (!inView(tl.x, tl.y, tl.r + 20)) continue;
    const f = Math.max(0, Math.min(1, tl.t / tl.dur));
    // 💣 dynamit - rudá zóna postupně zežloutne těsně před dopadem
    if (tl.dyn) {
      const dr = Math.round(239 + 16 * f);
      const dg = Math.round(68 + 152 * f);
      const db = Math.round(68 - 30 * f);
      ctx.fillStyle = `rgba(${dr},${dg},${db},${0.14 + f * 0.26})`;
      ctx.beginPath();
      ctx.arc(tl.x, tl.y, tl.r, 0, Math.PI * 2);
      ctx.fill();
      // čárkovaný obrys dopadu
      ctx.strokeStyle = `rgba(${dr},${dg},${db},0.95)`;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 5]);
      ctx.lineDashOffset = -g.gtime * 40;
      ctx.beginPath();
      ctx.arc(tl.x, tl.y, tl.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
      // stahující se kruh = čas do výbuchu
      ctx.strokeStyle = "rgba(255,251,235,0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(tl.x, tl.y, tl.r * (1 - f), 0, Math.PI * 2);
      ctx.stroke();
      // padající dynamit s prskajícím knotem
      if (f > 0.35) {
        const bf = (f - 0.35) / 0.65;
        const dy2 = tl.y - (1 - bf) * 170;
        ctx.save();
        ctx.translate(tl.x, dy2);
        ctx.rotate(g.gtime * 9);
        ctx.fillStyle = "#b91c1c";
        ctx.fillRect(-4, -8, 8, 16);
        ctx.strokeStyle = "#7f1d1d";
        ctx.lineWidth = 1;
        ctx.strokeRect(-4, -8, 8, 16);
        ctx.fillStyle = "#fde68a";
        ctx.beginPath();
        ctx.arc(0, -10, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      continue;
    }
    // zóna dopadu - červená patří netvorům, jantarová tvým bombám (náletek)
    ctx.fillStyle = tl.friendly ? `rgba(245,158,11,${0.10 + f * 0.22})` : `rgba(239,68,68,${0.10 + f * 0.22})`;
    ctx.beginPath();
    ctx.arc(tl.x, tl.y, tl.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = tl.friendly ? "rgba(253,224,71,0.9)" : "rgba(255,80,80,0.9)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(tl.x, tl.y, tl.r, 0, Math.PI * 2);
    ctx.stroke();
    // stahující se kruh ukazuje čas do dopadu
    ctx.strokeStyle = "rgba(255,220,120,0.9)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(tl.x, tl.y, tl.r * (1 - f), 0, Math.PI * 2);
    ctx.stroke();
    // padající projektil v závěru
    if (f > 0.45) {
      const bf = (f - 0.45) / 0.55;
      const by = tl.y - (1 - bf) * 150;
      ctx.fillStyle = tl.friendly ? "#78350f" : "#44040c";
      ctx.beginPath();
      ctx.arc(tl.x, by, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = tl.friendly ? "#fbbf24" : "#f87171";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(tl.x, by, 7, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // orby
  for (const o of g.orbs) {
    if (!inView(o.x, o.y, 30)) continue;
    const haloR = o.r * 2.2;
    const spr = getOrbSprite(o.hue);
    ctx.drawImage(spr, o.x - haloR, o.y - haloR, haloR * 2, haloR * 2);
    if (o.pk === 1) {
      // srdíčko - kreslené, s leskem
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + 6.5);
      ctx.bezierCurveTo(o.x + 8.5, o.y - 1, o.x + 5, o.y - 8, o.x, o.y - 3.5);
      ctx.bezierCurveTo(o.x - 5, o.y - 8, o.x - 8.5, o.y - 1, o.x, o.y + 6.5);
      ctx.fill();
      ctx.strokeStyle = "#7f1d1d";
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath();
      ctx.arc(o.x - 2.4, o.y - 3.4, 1.3, 0, Math.PI * 2);
      ctx.fill();
    } else if (o.pk === 2) {
      // 💣 bomba - černá koule se šňůrou a prskající jiskrou
      ctx.fillStyle = "#1c2833";
      ctx.beginPath();
      ctx.arc(o.x, o.y + 2, 7.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.strokeStyle = "#a16207";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(o.x + 2, o.y - 4);
      ctx.quadraticCurveTo(o.x + 7, o.y - 9, o.x + 4, o.y - 13);
      ctx.stroke();
      ctx.fillStyle = `rgba(253,224,71,${0.6 + 0.4 * Math.sin(g.gtime * 14)})`;
      ctx.beginPath();
      ctx.arc(o.x + 4, o.y - 13, 2.2, 0, Math.PI * 2);
      ctx.fill();
      // lesk na plechu
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath();
      ctx.arc(o.x - 2.8, o.y - 0.5, 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (o.pk === 3) {
      // 🧲 magnet - rudá podkova s modrým a bílým pólem
      ctx.strokeStyle = "#dc2626";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(o.x, o.y + 2, 6.5, Math.PI, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 4.4;
      ctx.strokeStyle = "#f8fafc";
      ctx.beginPath();
      ctx.moveTo(o.x - 6.5, o.y + 2);
      ctx.lineTo(o.x - 6.5, o.y + 8);
      ctx.stroke();
      ctx.strokeStyle = "#3b82f6";
      ctx.beginPath();
      ctx.moveTo(o.x + 6.5, o.y + 2);
      ctx.lineTo(o.x + 6.5, o.y + 8);
      ctx.stroke();
    }
  }

  // ⚔️ švihy meče - expandující zářivý oblouk
  for (const sl of g.slashes) {
    if (!inView(sl.x, sl.y, sl.r + 20)) continue;
    const f = sl.t / sl.dur;
    const al = 1 - f;
    // širší vnitřní záře
    ctx.strokeStyle = `rgba(165,180,252,${0.45 * al})`;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(sl.x, sl.y, sl.r * (0.68 + f * 0.3), sl.a - 1.15, sl.a + 1.15);
    ctx.stroke();
    // ostrá bílá čepel švihu
    ctx.strokeStyle = `rgba(241,245,249,${0.9 * al})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sl.x, sl.y, sl.r * (0.74 + f * 0.3), sl.a - 1.05 + f * 0.5, sl.a + 1.05);
    ctx.stroke();
  }

  // nepřátelé
  for (const e of g.enemies) {
    if (inView(e.x, e.y, e.r + 26)) drawEnemy(ctx, e, h.x, h.y, g.gtime);
  }

  // ⚙️ turetky inženýra - tripod, rotující hlaveň podle vylepšení, kontrolka
  ctx.font = "9px system-ui";
  ctx.textAlign = "center";
  for (const tu of g.turrets) {
    if (!inView(tu.x, tu.y, 40)) continue;
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(tu.x, tu.y + 8, 11, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // trojnožka
    ctx.strokeStyle = "#57534e";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tu.x - 7, tu.y + 7);
    ctx.lineTo(tu.x, tu.y - 1);
    ctx.moveTo(tu.x + 7, tu.y + 7);
    ctx.lineTo(tu.x, tu.y - 1);
    ctx.moveTo(tu.x, tu.y + 8);
    ctx.lineTo(tu.x, tu.y - 1);
    ctx.stroke();
    // tělo
    ctx.fillStyle = "#78716c";
    ctx.beginPath();
    ctx.arc(tu.x, tu.y - 2, 7.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#44403c";
    ctx.lineWidth = 1;
    ctx.stroke();
    // 💥 plazmová turetka - pulzující energetická aura
    if (tu.type === "plasma") {
      ctx.fillStyle = `rgba(232,121,249,${0.16 + 0.08 * Math.sin(tu.t * 7)})`;
      ctx.beginPath();
      ctx.arc(tu.x, tu.y - 2, 14 + Math.sin(tu.t * 7) * 2, 0, Math.PI * 2);
      ctx.fill();
    }
    // hlaveň - barva podle druhu turetky (plamen/mráz jen u základního druhu)
    const tdef = TURRET_TYPES[tu.type] || TURRET_TYPES.standard;
    ctx.strokeStyle = tu.type === "standard" ? (g.tcfg.flame ? "#ea580c" : g.tcfg.frost ? "#38bdf8" : "#d6d3d1") : tdef.barrel;
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(tu.x, tu.y - 2);
    ctx.lineTo(tu.x + Math.cos(tu.aim) * 13, tu.y - 2 + Math.sin(tu.aim) * 13);
    ctx.stroke();
    // blikající kontrolka (modrá, když fouká vítr)
    const bl = 0.5 + 0.5 * Math.sin(tu.t * 6);
    ctx.fillStyle = g.tcfg.wind ? `rgba(147,197,253,${bl})` : `rgba(74,222,128,${bl})`;
    ctx.beginPath();
    ctx.arc(tu.x, tu.y - 10, 1.8, 0, Math.PI * 2);
    ctx.fill();
    // znak druhu nad turetkou, ať poznáš, co pokládáš
    ctx.fillText(tdef.emoji, tu.x, tu.y - 16);
    // ❤️ výdrž - pruh se ukáže, až když je turetka poškozená
    if (tu.hp < tu.maxHp) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(tu.x - 10, tu.y + 11, 20, 4);
      ctx.fillStyle = tu.hp > tu.maxHp * 0.35 ? "#4ade80" : "#f87171";
      ctx.fillRect(tu.x - 9, tu.y + 12, Math.max(0, (18 * tu.hp) / tu.maxHp), 2);
    }
  }
  ctx.textAlign = "left";

  // bedny z bosse
  ctx.font = "bold 13px system-ui, sans-serif";
  ctx.textAlign = "center";
  for (const c of g.crates) {
    if (!inView(c.x, c.y, 40)) continue;
    const bob = Math.sin(c.t * 3) * 4;
    const cy = c.y + bob;
    // stín pod bednou (poletuje, takže stín zůstává na zemi)
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(c.x, c.y + 14, 12, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(250,204,21,${0.22 + 0.15 * Math.sin(c.t * 4)})`;
    ctx.beginPath();
    ctx.arc(c.x, cy, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#7c4a1e";
    ctx.fillRect(c.x - 12, cy - 10, 24, 20);
    ctx.fillStyle = "#9a6228";
    ctx.fillRect(c.x - 12, cy - 10, 24, 6);
    ctx.fillRect(c.x - 2, cy - 10, 4, 20);
    ctx.fillRect(c.x - 12, cy + 2, 24, 4);
    ctx.strokeStyle = "#fbbf24";
    ctx.lineWidth = 2;
    ctx.strokeRect(c.x - 12, cy - 10, 24, 20);
    ctx.fillStyle = "#fde68a";
    ctx.fillText("?", c.x, cy + 5);
  }
  ctx.textAlign = "left";

  // nepřátelské koule (šaman)
  for (const b of g.eBolts) {
    if (!inView(b.x, b.y, 20)) continue;
    // ⛏️ krumpáč: rotující rukojeť + kovová hlava (oblouk)
    if (b.boom !== undefined) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate((b.boom || 0) * 14);
      ctx.strokeStyle = "#8b5a2b";
      ctx.lineWidth = 3.4;
      ctx.beginPath();
      ctx.moveTo(-10, 7);
      ctx.lineTo(10, -7);
      ctx.stroke();
      ctx.strokeStyle = "#d4d4d8";
      ctx.lineWidth = 4.4;
      ctx.beginPath();
      ctx.arc(0, 0, 12, -Math.PI * 0.75, -Math.PI * 0.25);
      ctx.stroke();
      ctx.restore();
      continue;
    }
    // ❄️ mrazivá koule ledovce - bledě modrá s ledovým závojem
    if (b.slow) {
      ctx.fillStyle = "rgba(147,197,253,0.35)";
      ctx.beginPath();
      ctx.arc(b.x, b.y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#bfdbfe";
      ctx.beginPath();
      ctx.arc(b.x, b.y, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.4, 0, Math.PI * 2);
      ctx.fill();
      continue;
    }
    ctx.fillStyle = "rgba(103,232,249,0.3)";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#67e8f9";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 6.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.8, 0, Math.PI * 2);
    ctx.fill();
  }

  // projektily: každá zbraň má vlastní texturu
  ctx.lineCap = "round";
  for (const a of g.arrows) {
    if (!inView(a.x, a.y, 30)) continue;
    const ang = Math.atan2(a.vy, a.vx);
    if (a.kind === 1) {
      // točená hvězdice - 4 čepele + střed
      const ra = ang + g.gtime * 16;
      ctx.strokeStyle = a.crit ? "#facc15" : "#2dd4bf";
      ctx.lineWidth = 2;
      for (let k = 0; k < 4; k++) {
        const ka = ra + k * Math.PI * 0.5;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(a.x + Math.cos(ka) * 9, a.y + Math.sin(ka) * 9);
        ctx.stroke();
      }
      ctx.fillStyle = a.crit ? "#fde68a" : "#99f6e4";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (a.kind === 2) {
      // nůž - čepel s odleskem a dřevěnou rukojetí
      ctx.strokeStyle = a.crit ? "#facc15" : "#cbd5e1";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(a.x - Math.cos(ang) * 2, a.y - Math.sin(ang) * 2);
      ctx.lineTo(a.x + Math.cos(ang) * 12, a.y + Math.sin(ang) * 12);
      ctx.stroke();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x + Math.cos(ang + 0.15) * 10, a.y + Math.sin(ang + 0.15) * 10);
      ctx.stroke();
      ctx.strokeStyle = "#92400e";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(a.x - Math.cos(ang) * 10, a.y - Math.sin(ang) * 10);
      ctx.lineTo(a.x - Math.cos(ang) * 2, a.y - Math.sin(ang) * 2);
      ctx.stroke();
    } else if (a.kind === 3) {
      // brok - plamínek s ohonem
      ctx.strokeStyle = "rgba(251,146,60,0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(a.x - a.vx * 0.014, a.y - a.vy * 0.014);
      ctx.lineTo(a.x, a.y);
      ctx.stroke();
      ctx.fillStyle = a.crit ? "#fde68a" : "#fb923c";
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.crit ? 4 : 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff7ed";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 1.4, 0, Math.PI * 2);
      ctx.fill();
    } else if (a.kind === 4) {
      // kulka - zlatý tracer s jiskrou
      ctx.strokeStyle = a.crit ? "#facc15" : "#fbbf24";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(a.x - Math.cos(ang) * 13, a.y - Math.sin(ang) * 13);
      ctx.lineTo(a.x, a.y);
      ctx.stroke();
      ctx.fillStyle = "#fffbeb";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    } else if (a.kind === 5) {
      // ohnivá koule - vrstvený plamen s ohonem
      ctx.strokeStyle = "rgba(249,115,22,0.5)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(a.x - a.vx * 0.02, a.y - a.vy * 0.02);
      ctx.lineTo(a.x, a.y);
      ctx.stroke();
      ctx.fillStyle = "rgba(239,68,68,0.35)";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = a.crit ? "#fde68a" : "#f97316";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fef3c7";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (a.kind === 6) {
      // ledová koule - špičatý krystal
      ctx.fillStyle = "rgba(103,232,249,0.28)";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = a.crit ? "#facc15" : "#a5f3fc";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const ka = ang + k * (Math.PI / 3);
        const px = a.x + Math.cos(ka) * 6;
        const py = a.y + Math.sin(ka) * 6;
        if (k === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = "#e0f2fe";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (a.kind === 7) {
      // ⚡ blesk - větvený elektrický výboj se září a bílým jádrem
      ctx.fillStyle = "rgba(196,181,253,0.22)";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 7, 0, Math.PI * 2);
      ctx.fill();
      // postranní větve výboje
      for (let br = 0; br < 2; br++) {
        const bax = a.x - Math.cos(ang) * (6 + br * 7);
        const bay = a.y - Math.sin(ang) * (6 + br * 7);
        const bja = ang + (br === 0 ? 0.75 : -0.75);
        ctx.strokeStyle = "rgba(196,181,253,0.55)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(bax, bay);
        ctx.lineTo(bax + Math.cos(bja) * 7 + Math.sin(g.gtime * 43 + br * 2) * 2.5, bay + Math.sin(bja) * 7 + Math.cos(g.gtime * 39 + br * 2) * 2.5);
        ctx.stroke();
      }
      // hlavní klikatá střela - fialový plášť + bílé jádro
      for (const pass of [0, 1]) {
        ctx.strokeStyle = pass === 0 ? (a.crit ? "#facc15" : "#a78bfa") : "#f5f3ff";
        ctx.lineWidth = pass === 0 ? 3.5 : 1.6;
        ctx.beginPath();
        const segs = 5;
        for (let k = 0; k <= segs; k++) {
          const f = k / segs;
          const mid = k > 0 && k < segs ? 1 : 0;
          const jx = Math.sin(g.gtime * 40 + a.x * 0.3 + k * 5) * 4 * mid;
          const jy = Math.cos(g.gtime * 37 + a.y * 0.3 + k * 4) * 4 * mid;
          const px = a.x - Math.cos(ang) * 20 * (1 - f) + jx;
          const py = a.y - Math.sin(ang) * 20 * (1 - f) + jy;
          if (k === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (a.kind === 8) {
      // 🔥 plamenomet - plazivý jazyk plamene, který roste a vlní se (additivní zář jako oheň)
      const fr = 4 + (0.55 - a.life) * 13;
      const w1 = Math.sin(g.gtime * 21 + a.y * 0.2) * fr * 0.3;
      const w2 = Math.cos(g.gtime * 17 + a.x * 0.2) * fr * 0.25;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      // rudá additivní zář okolo plamene
      ctx.fillStyle = "rgba(239,68,68,0.22)";
      ctx.beginPath();
      ctx.arc(a.x, a.y, fr + 5, 0, Math.PI * 2);
      ctx.fill();
      // tělo plamene - dlouhý plazivý jazyk s vlnícím se ocasem
      ctx.fillStyle = a.crit ? "rgba(253,230,138,0.92)" : "rgba(249,115,22,0.88)";
      ctx.beginPath();
      ctx.moveTo(a.x + Math.cos(ang) * fr * 1.2 + w1, a.y + Math.sin(ang) * fr * 1.2 + w2);
      ctx.quadraticCurveTo(a.x + Math.cos(ang + 1.5) * fr * 0.8 - w2, a.y + Math.sin(ang + 1.5) * fr * 0.8 + w1, a.x - Math.cos(ang) * fr * 1.45 + w2, a.y - Math.sin(ang) * fr * 1.45 - w1);
      ctx.quadraticCurveTo(a.x + Math.cos(ang - 1.5) * fr * 0.8 - w1, a.y + Math.sin(ang - 1.5) * fr * 0.8 - w2, a.x + Math.cos(ang) * fr * 1.2 + w1, a.y + Math.sin(ang) * fr * 1.2 + w2);
      ctx.fill();
      // žlutý vnitřní plamen - menší kopie posunutá dopředu
      ctx.fillStyle = a.crit ? "rgba(254,249,195,0.95)" : "rgba(250,204,21,0.85)";
      ctx.beginPath();
      ctx.moveTo(a.x + Math.cos(ang) * fr * 0.9 + w1 * 0.6, a.y + Math.sin(ang) * fr * 0.9 + w2 * 0.6);
      ctx.quadraticCurveTo(a.x + Math.cos(ang + 1.3) * fr * 0.5 - w2 * 0.7, a.y + Math.sin(ang + 1.3) * fr * 0.5 + w1 * 0.7, a.x - Math.cos(ang) * fr * 0.9 + w2 * 0.7, a.y - Math.sin(ang) * fr * 0.9 - w1 * 0.7);
      ctx.quadraticCurveTo(a.x + Math.cos(ang - 1.3) * fr * 0.5 - w1 * 0.7, a.y + Math.sin(ang - 1.3) * fr * 0.5 - w2 * 0.7, a.x + Math.cos(ang) * fr * 0.9 + w1 * 0.6, a.y + Math.sin(ang) * fr * 0.9 + w2 * 0.6);
      ctx.fill();
      // bělavé horké jádro - táhlé ve směru letu
      ctx.fillStyle = "rgba(255,251,235,0.95)";
      ctx.beginPath();
      ctx.ellipse(a.x + Math.cos(ang) * fr * 0.4, a.y + Math.sin(ang) * fr * 0.4, fr * 0.5, fr * 0.26, ang, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // jiskry za plamenem
      for (let sp = 0; sp < 2; sp++) {
        const sa = g.gtime * 25 + sp * 3 + a.x * 0.2;
        ctx.fillStyle = "rgba(254,240,138,0.7)";
        ctx.beginPath();
        ctx.arc(a.x - Math.cos(ang) * (6 + sp * 4) + Math.sin(sa) * 3, a.y - Math.sin(ang) * (6 + sp * 4) + Math.cos(sa) * 3, 1.2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (a.kind === 9) {
      // pistole - ocelová kulka s krátkým ocasem
      ctx.strokeStyle = "rgba(148,163,184,0.5)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(a.x - Math.cos(ang) * 9, a.y - Math.sin(ang) * 9);
      ctx.lineTo(a.x, a.y);
      ctx.stroke();
      ctx.fillStyle = a.crit ? "#fde68a" : "#e2e8f0";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(a.x + Math.cos(ang) * 1.5, a.y + Math.sin(ang) * 1.5, 1.2, 0, Math.PI * 2);
      ctx.fill();
    } else if (a.kind === 10) {
      // šuriken - rotující čtyřhrotá hvězda
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(g.gtime * 24 + a.x * 0.05);
      ctx.fillStyle = a.crit ? "#fde68a" : "#e2e8f0";
      for (let b = 0; b < 4; b++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, -1.4);
        ctx.lineTo(5.5, -0.5);
        ctx.lineTo(5.5, 0.5);
        ctx.lineTo(0, 1.4);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = "#334155";
      ctx.beginPath();
      ctx.arc(0, 0, 1.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (a.kind === 14) {
      // 💥 plazmová koule - pulzující energetické jádro s fialovou aurou a ohonem
      const pr = 6 + Math.sin(g.gtime * 18) * 1.5;
      ctx.strokeStyle = "rgba(232,121,249,0.45)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(a.x - a.vx * 0.025, a.y - a.vy * 0.025);
      ctx.lineTo(a.x, a.y);
      ctx.stroke();
      ctx.fillStyle = "rgba(192,38,211,0.28)";
      ctx.beginPath();
      ctx.arc(a.x, a.y, pr + 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = a.crit ? "#fde68a" : "#e879f9";
      ctx.beginPath();
      ctx.arc(a.x, a.y, pr, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fdf4ff";
      ctx.beginPath();
      ctx.arc(a.x, a.y, pr * 0.45, 0, Math.PI * 2);
      ctx.fill();
    } else if (a.kind === 15) {
      // ☄️ laserový paprsek - tenká jasná čára s bílým jádrem
      ctx.strokeStyle = "rgba(239,68,68,0.35)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(a.x - Math.cos(ang) * 18, a.y - Math.sin(ang) * 18);
      ctx.lineTo(a.x, a.y);
      ctx.stroke();
      ctx.strokeStyle = a.crit ? "#fde68a" : "#ef4444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(a.x - Math.cos(ang) * 18, a.y - Math.sin(ang) * 18);
      ctx.lineTo(a.x + Math.cos(ang) * 4, a.y + Math.sin(ang) * 4);
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(a.x + Math.cos(ang) * 4, a.y + Math.sin(ang) * 4, 1.6, 0, Math.PI * 2);
      ctx.fill();
    } else if (a.kind === 16) {
      // 🌲 dřevěné třístí druida - hnědá špička s listkem, rotuje v letu
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(ang + Math.sin((a.vx + a.vy) * 0.02 + a.life * 9) * 0.15);
      ctx.strokeStyle = "#8b5a2b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-9, 0);
      ctx.lineTo(7, 0);
      ctx.stroke();
      ctx.strokeStyle = "#d4a76a";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-9, 0);
      ctx.lineTo(7, 0);
      ctx.stroke();
      // zelený listek na konci
      ctx.fillStyle = a.crit ? "#fde047" : "#4ade80";
      ctx.beginPath();
      ctx.ellipse(7, -2, 4, 2, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      // šíp - dřevěná těžiska, kovový hrot, oranžová brka
      ctx.strokeStyle = a.crit ? "#facc15" : "#d6c7a8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(a.x - Math.cos(ang) * 16, a.y - Math.sin(ang) * 16);
      ctx.lineTo(a.x + Math.cos(ang) * 4, a.y + Math.sin(ang) * 4);
      ctx.stroke();
      ctx.fillStyle = a.crit ? "#fde68a" : "#e5e7eb";
      ctx.beginPath();
      ctx.moveTo(a.x + Math.cos(ang) * 9, a.y + Math.sin(ang) * 9);
      ctx.lineTo(a.x + Math.cos(ang + 2.5) * 3, a.y + Math.sin(ang + 2.5) * 3);
      ctx.lineTo(a.x + Math.cos(ang - 2.5) * 3, a.y + Math.sin(ang - 2.5) * 3);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = a.crit ? "#f59e0b" : "#f97316";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(a.x - Math.cos(ang) * 8, a.y - Math.sin(ang) * 8);
      ctx.lineTo(a.x - Math.cos(ang - 0.7) * 13, a.y - Math.sin(ang - 0.7) * 13);
      ctx.moveTo(a.x - Math.cos(ang) * 8, a.y - Math.sin(ang) * 8);
      ctx.lineTo(a.x - Math.cos(ang + 0.7) * 13, a.y - Math.sin(ang + 0.7) * 13);
      ctx.stroke();
    }
  }

  // hrdina
  drawHero(ctx, g);

  // 🧲 magnet - pulzující kruh nasávání, dokud koule letí
  if (g.magT > 0) {
    const mp = 1 - g.magT / 2.2;
    ctx.strokeStyle = `rgba(103,232,249,${0.7 * g.magT})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(h.x, h.y, 60 + Math.sin(g.gtime * 10) * 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(103,232,249,${0.35 * g.magT})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 14]);
    ctx.lineDashOffset = -g.gtime * 90 * (mp > 0 ? 1 : -1);
    ctx.beginPath();
    ctx.arc(h.x, h.y, 130, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }

  // částice (jen v dohledu - optimalizace)
  for (const pt of g.particles) {
    if (!inView(pt.x, pt.y, 8)) continue;
    const al = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = hsla(pt.hue, 95, 68, al);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r * (0.5 + al * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }

  // 💥 rázové vlny - dvojitý prstenec se vnitřní září, rychlý rozlet a pomalé doznívání
  for (const sk of g.shocks) {
    if (!inView(sk.x, sk.y, sk.maxR)) continue;
    const k = sk.t / sk.dur;
    const r = sk.maxR * Math.sqrt(k);
    const al = 1 - k;
    // vnitřní měkká záře
    ctx.fillStyle = hsla(sk.hue, 90, 62, al * sk.fill);
    ctx.beginPath();
    ctx.arc(sk.x, sk.y, r, 0, Math.PI * 2);
    ctx.fill();
    // hlavní prstenec
    ctx.strokeStyle = hsla(sk.hue, 95, 70, al);
    ctx.lineWidth = Math.max(1, sk.w * (1 - k * 0.55));
    ctx.beginPath();
    ctx.arc(sk.x, sk.y, r, 0, Math.PI * 2);
    ctx.stroke();
    // vnitřní tenčí prstenec - pocit hloubky
    ctx.strokeStyle = hsla(sk.hue, 100, 85, al * 0.7);
    ctx.lineWidth = Math.max(1, sk.w * 0.4 * (1 - k));
    ctx.beginPath();
    ctx.arc(sk.x, sk.y, Math.max(1, r * 0.78), 0, Math.PI * 2);
    ctx.stroke();
  }

  // letící texty (jen v dohledu; font se cachuje, ať se řetězec neskládá každý snímek)
  ctx.textAlign = "center";
  for (const ft of g.texts) {
    if (!inView(ft.x, ft.y, 24)) continue;
    const al = Math.max(0, ft.life / ft.maxLife);
    ctx.font = FT_FONTS[ft.size] || (FT_FONTS[ft.size] = `bold ${ft.size}px system-ui, sans-serif`);
    ctx.fillStyle = `rgba(0,0,0,${0.6 * al})`;
    ctx.fillText(ft.text, ft.x + 1.5, ft.y + 1.5);
    ctx.fillStyle = hsla(ft.hue, 90, 70, al);
    ctx.fillText(ft.text, ft.x, ft.y);
  }

  ctx.restore();

  // vinětace - předrenderovaná do offscreen plátna při změně rozlišení, pak jen rychlý blit
  if (!vigCv.cv || vigCv.w !== VW || vigCv.h !== VH) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, VW);
    c.height = Math.max(1, VH);
    const cc = c.getContext("2d");
    if (cc) {
      const vg2 = cc.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VW * 0.7);
      vg2.addColorStop(0, "rgba(0,0,0,0)");
      vg2.addColorStop(1, "rgba(0,0,0,0.5)");
      cc.fillStyle = vg2;
      cc.fillRect(0, 0, VW, VH);
    }
    vigCv = { cv: c, w: VW, h: VH };
  }
  if (vigCv.cv) ctx.drawImage(vigCv.cv, 0, 0, VW, VH);

  // 🌙 noc - celá louka se přelije modravou tmou (přes den nic)
  if (g.night) {
    ctx.fillStyle = "rgba(12,18,52,0.42)";
    ctx.fillRect(0, 0, VW, VH);
  }
  // 🌅 svítání a soumrak - teplý oranžový nádech kolem přechodu dne a noci
  const dayPh = g.time % 600;
  if (!g.night && (dayPh > 540 || dayPh < 60)) {
    const tw = Math.min(1, (dayPh > 540 ? 600 - dayPh : dayPh) / 60);
    ctx.fillStyle = `rgba(251,146,60,${(0.15 * (1 - tw)).toFixed(3)})`;
    ctx.fillRect(0, 0, VW, VH);
  }
  // 🌦️ počasí na obrazovce: déšť, bouřka (i záblesk blesku), vítr nese listí
  // nástup i konec počasí má ~2 s crossfade, žádné střihy nasucho
  if (g.weather === "rain" || g.weather === "storm") {
    const wf = Math.max(0, Math.min(1, (25 - g.weatherT) / 2, g.weatherT / 2));
    if (wf > 0.02) {
    ctx.fillStyle = `rgba(30,58,90,${(0.16 * wf).toFixed(3)})`;
    ctx.fillRect(0, 0, VW, VH);
    ctx.strokeStyle = `rgba(148,197,255,${(0.5 * wf).toFixed(3)})`;
    ctx.lineWidth = 1.4;
    const drops = g.weather === "storm" ? 70 : 46;
    ctx.beginPath();
    for (let i = 0; i < drops; i++) {
      const rx = (i * 127.3 + g.gtime * 340) % (VW + 60) - 30;
      const ry = (i * 83.7 + g.gtime * 640) % (VH + 40) - 20;
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - 3 - Math.cos(g.windA) * 5, ry + 13);
    }
    ctx.stroke();
    if (g.weather === "storm" && g.windT > 1.15) {
      ctx.fillStyle = `rgba(255,255,255,${((g.windT - 1.15) * 2.2 * wf).toFixed(3)})`;
      ctx.fillRect(0, 0, VW, VH);
    }
    }
  } else if (g.weather === "wind") {
    const wf = Math.max(0, Math.min(1, (25 - g.weatherT) / 2, g.weatherT / 2));
    if (wf > 0.02) {
    for (let i = 0; i < 16; i++) {
      const lx = (i * 211.7 + g.gtime * 160 * Math.cos(g.windA) + 800) % (VW + 80) - 40;
      const ly = (i * 137.3 + g.gtime * 160 * Math.sin(g.windA) + 800) % (VH + 80) - 40;
      ctx.fillStyle = i % 3 === 0 ? `rgba(134,239,172,${0.6 * wf})` : `rgba(253,230,138,${0.55 * wf})`;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(g.windA + Math.sin(g.gtime * 4 + i) * 0.6);
      ctx.beginPath();
      ctx.ellipse(0, 0, 5, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    }
  }
  // ⚠️ nízké HP - rudá pulzující vinětace (srdce ti buší) - gradient z cache
  const hpFrac = h.hp / h.maxHp;
  if (hpFrac < 0.35) {
    // 💓 puls vinětace kopíruje skutečný tlukot srdce z hudby
    const hb = AC && g.opts.snd ? Math.max(0, 1 - (performance.now() - musThumpAt) / Math.max(240, musStepDur * 8 * 1000)) : 0;
    const pulse = 0.14 + 0.22 * (hb > 0 ? hb : 0.5 + 0.5 * Math.sin(g.gtime * 6));
    ctx.globalAlpha = pulse * (1 - hpFrac / 0.35);
    ctx.fillStyle = fxCache.lg!;
    ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }

  // 🏆 zlatý záblesk po položení bosse - přejede přes obrazovku a plynule vyprchá
  if (g.goldFlash > 0) {
    ctx.fillStyle = `rgba(253,230,138,${(0.38 * g.goldFlash).toFixed(3)})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  // 👹 červený záblesk při spawnu bosse - „teď už je po tobě"
  if (g.dreadFlash > 0) {
    ctx.fillStyle = `rgba(153,27,27,${(0.42 * g.dreadFlash).toFixed(3)})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  // 🥁 beat puls - okraje obrazovky jiskří v rytmu kopáku (jen když se to rozjede)
  const beatP = AC && g.opts.snd ? Math.max(0, 1 - (performance.now() - musKickAt) / 480) : 0;
  const songIsBoss = musSong === SONG_BOSS || musSong === SONG_FINAL;
  const hypeAmt = Math.min(1, g.combo / 12);
  if (beatP > 0 && (hypeAmt >= 0.3 || songIsBoss || g.enemies.length > 18)) {
    ctx.globalAlpha = 0.15 * beatP * Math.max(hypeAmt, songIsBoss ? 1 : 0.4);
    ctx.fillStyle = fxCache.gl!;
    ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }

  // 💨 speed lines - při vysokém kombu se rozeběhne zlatý vír čar k okrajům
  const hypeA = Math.min(1, Math.max(0, (g.combo - 8) / 12));
  if (hypeA > 0) {
    ctx.save();
    ctx.strokeStyle = "rgba(253,224,71,1)";
    ctx.lineWidth = 2;
    const cx = VW / 2;
    const cy = VH / 2;
    const mx = Math.max(VW, VH);
    for (let i = 0; i < 14; i++) {
      const a = i * 0.449 + Math.floor(g.gtime * 9) * 0.313;
      const r0 = mx * (0.36 + 0.1 * (((i * 37) + Math.floor(g.gtime * 13) * 11) % 10) / 10);
      const r1 = r0 + 60 + 90 * (((i * 53) + Math.floor(g.gtime * 17)) % 12) / 12;
      ctx.globalAlpha = hypeA * 0.22 * (0.35 + 0.65 * (((i * 7) + Math.floor(g.gtime * 15)) % 10) / 10);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 📣 toast s názvem skladby - když se track přepne, chvíli se ukáže nahoře
  const musToastAge = performance.now() - musToastAt;
  if (musToast && musToastAge < 3400 && g.running && !g.over) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, (3400 - musToastAge) / 600, musToastAge / 220);
    ctx.font = "bold 12px system-ui, sans-serif";
    ctx.textAlign = "center";
    const tw = ctx.measureText(`🎵 ${musToast}`).width + 26;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(VW / 2 - tw / 2, 66, tw, 22);
    ctx.fillStyle = "#fde68a";
    ctx.fillText(`🎵 ${musToast}`, VW / 2, 81);
    ctx.restore();
  }

  // 📣 boss intro banner - první vteřiny se jméno bosse rozezní nad arénou
  if (g.bossIntroT > 0) {
    const bf = 1 - g.bossIntroT / 2.6;
    const bal = Math.min(1, bf * 4) * Math.min(1, g.bossIntroT / 0.6);
    const bsc = 0.8 + 0.2 * Math.min(1, bf * 3);
    const bwd = Math.min(340, VW * 0.92);
    ctx.save();
    ctx.translate(VW / 2, VH * 0.3);
    ctx.scale(bsc, bsc);
    ctx.globalAlpha = bal;
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(-bwd / 2, -26, bwd, 52);
    ctx.strokeStyle = "rgba(248,113,113,0.9)";
    ctx.lineWidth = 2;
    ctx.strokeRect(-bwd / 2, -26, bwd, 52);
    ctx.fillStyle = "#fecaca";
    ctx.font = "bold 20px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`⚠️ ${g.bossIntroName}!`, 0, 7);
    ctx.restore();
  }

  // 💀 smrt hrdiny - svět pomalu ztmavne do obrazovky konce
  if (g.over) {
    ctx.fillStyle = `rgba(0,0,0,${(0.55 * g.overT).toFixed(3)})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  // boss HP bar nahoře
  let boss: Enemy | null = null;
  for (const e of g.enemies) {
    if (!e.dead && e.boss) {
      boss = e;
      break;
    }
  }
  if (boss) {
    const bw = Math.min(300, VW * 0.5);
    const bx = (VW - bw) / 2;
    const by = MM_Y + 2;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(bx - 3, by - 3, bw + 6, 20);
    ctx.fillStyle = "#7f1d1d";
    ctx.fillRect(bx, by, bw, 14);
    ctx.fillStyle = hsla(boss.hue, 85, 58, 1);
    ctx.fillRect(bx, by, bw * Math.max(0, boss.hp / boss.maxHp), 14);
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, 14);
    // ⚔️ dělící čárky fází - vidíš, kde aktuální fáze končí
    const nph = boss.final ? 4 : 2;
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 1;
    for (let pi = 1; pi < nph; pi++) {
      const px = bx + bw * (1 - pi / nph);
      ctx.beginPath();
      ctx.moveTo(px, by);
      ctx.lineTo(px, by + 14);
      ctx.stroke();
    }
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(boss.final ? "☠️ FINÁLNÍ BOSS" : "💀 BOSS", VW / 2, by + 11);
    // ⏱ odpočet minutového limitu
    const tleft = Math.max(0, g.bossT);
    ctx.fillStyle = tleft < 10 ? "#fca5a5" : "#fff";
    ctx.font = "bold 12px system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`⏱ ${tleft.toFixed(1)}`, bx + 4, by + 11);
    // ⚔️ aktuální fáze
    ctx.textAlign = "right";
    ctx.fillText(`FÁZE ${boss.phase}/${boss.final ? 4 : 2}`, bx + bw - 4, by + 11);
  }

  // virtuální joystick
  if (joy.id !== null && joy.active) {
    const jr = JOY_R;
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    ctx.beginPath();
    ctx.arc(joy.ax, joy.ay, jr, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.28)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(joy.ax, joy.ay, jr, 0, Math.PI * 2);
    ctx.stroke();
    const jdx = joy.x - joy.ax;
    const jdy = joy.y - joy.ay;
    const jd = Math.sqrt(jdx * jdx + jdy * jdy);
    const kd = Math.min(jd, jr);
    const kx = jd > 0 ? joy.ax + (jdx / jd) * kd : joy.ax;
    const ky = jd > 0 ? joy.ay + (jdy / jd) * kd : joy.ay;
    ctx.fillStyle = "rgba(52,211,153,0.55)";
    ctx.beginPath();
    ctx.arc(kx, ky, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(kx, ky, 20, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 🧭 indikátory mimo obrazovku - šipky k bosům, bednám a mini-bossům
  {
    const cx0 = VW / 2;
    const cy0 = VH / 2;
    const mr = Math.min(VW, VH) * 0.36;
    const inds: { x: number; y: number; emoji: string; col: string; prio: number }[] = [];
    const addInd = (x: number, y: number, emoji: string, col: string, prio: number) => {
      if (Math.hypot(x - h.x, y - h.y) < mr + 60) return; // na obrazovce - nepotřebuješ šipku
      inds.push({ x, y, emoji, col, prio });
    };
    for (const e of g.enemies) {
      if (e.dead) continue;
      if (e.boss) addInd(e.x, e.y, "☠️", "#c084fc", 0);
      else if (e.minib) addInd(e.x, e.y, "🌟", "#fbbf24", 1);
    }
    for (const c of g.crates) addInd(c.x, c.y, "📦", "#fbbf24", 2);
    // ⚠️ prioritizace: boss > mini-boss > bedna - šipek je max 6, slabší cíl se zahodí
    const show = inds.sort((a, b) => a.prio - b.prio).slice(0, 6);
    for (let ii = 0; ii < show.length; ii++) {
      const ind = show[ii];
      // šipky u stejného okraje se rozeznou od sebe, ať se nepřekrývají
      const a = Math.atan2(ind.y - h.y, ind.x - h.x) + (ii % 2 === 0 ? 1 : -1) * Math.floor((ii + 1) / 2) * 0.13;
      const ix = cx0 + Math.cos(a) * mr;
      const iy = cy0 + Math.sin(a) * mr;
      ctx.save();
      ctx.translate(ix, iy);
      ctx.rotate(a);
      ctx.fillStyle = "rgba(4,8,20,0.72)";
      ctx.beginPath();
      ctx.moveTo(12, 0);
      ctx.lineTo(-8, -9);
      ctx.lineTo(-8, 9);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = ind.col;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
      ctx.font = "11px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(ind.emoji, ix, iy);
      ctx.textBaseline = "alphabetic";
      ctx.textAlign = "left";
    }
  }

  // 🗺️ minimapa - vždy pod HUD lištou, při bossovi ještě pod boss barem, ať se nikdy nic nepřekrývá
  const ms = Math.min(110, Math.round(VH * 0.17));
  const mx = VW - ms - 14;
  const my = MM_Y + (boss ? 28 : 2);
  ctx.fillStyle = "rgba(4,8,20,0.75)";
  ctx.fillRect(mx, my, ms, ms);
  ctx.strokeStyle = "rgba(148,163,255,0.35)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(mx, my, ms, ms);
  const k = ms / ARENA;
  for (const e of g.enemies) {
    ctx.fillStyle = e.boss ? "#c084fc" : e.elite ? "#fde047" : e.minib ? "#fbbf24" : "rgba(248,113,113,0.9)";
    ctx.beginPath();
    ctx.arc(mx + e.x * k, my + e.y * k, e.boss ? 4.5 : e.elite ? 3.5 : e.minib ? 3.5 : e.big ? 3 : 2, 0, Math.PI * 2);
    ctx.fill();
  }
  // 📦 bedny a ⚙️ turetky na minimapě
  ctx.fillStyle = "#fbbf24";
  for (const c of g.crates) {
    ctx.fillRect(mx + c.x * k - 1.5, my + c.y * k - 1.5, 3, 3);
  }
  ctx.fillStyle = "#7dd3fc";
  for (const tu of g.turrets) {
    ctx.fillRect(mx + tu.x * k - 1.5, my + tu.y * k - 1.5, 3, 3);
  }
  ctx.fillStyle = "#34d399";
  ctx.beginPath();
  ctx.arc(mx + h.x * k, my + h.y * k, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.8)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // 🧭 směrová šipka - kam se hrdina dívá
  ctx.beginPath();
  ctx.moveTo(mx + h.x * k + Math.cos(h.angle) * 7, my + h.y * k + Math.sin(h.angle) * 7);
  ctx.lineTo(mx + h.x * k + Math.cos(h.angle + 2.5) * 3.5, my + h.y * k + Math.sin(h.angle + 2.5) * 3.5);
  ctx.lineTo(mx + h.x * k + Math.cos(h.angle - 2.5) * 3.5, my + h.y * k + Math.sin(h.angle - 2.5) * 3.5);
  ctx.closePath();
  ctx.fillStyle = "rgba(52,211,153,0.9)";
  ctx.fill();
  // 📷 obdélník výřezu kamery - vidíš, kolik mapy máš v zorném poli
  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1;
  ctx.strokeRect(mx + (h.x - VW / 2) * k, my + (h.y - VH / 2) * k, VW * k, VH * k);
  // 🏟️ kruh boss-arény na minimapě
  if (g.arena.active) {
    ctx.strokeStyle = "rgba(248,113,113,0.7)";
    ctx.beginPath();
    ctx.arc(mx + g.arena.x * k, my + g.arena.y * k, g.arena.r * k, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// 🧪 sandbox karta - tap = 1×, podržení = opakování; při scrollu se nic neaplikuje
function SbxCard(props: { u: Upgrade; onPick: (u: Upgrade) => void }) {
  const u = props.u;
  const ri = RARITY_INFO[u.rarity] || RARITY_INFO[0];
  const repRef = useRef<ReturnType<typeof setInterval> | null>(null);
  const holdRef = useRef<ReturnType<typeof setTimeout> | null>(null);
  const pressRef = useRef<{ x: number; y: number; moved: boolean } | null>(null);
  const stop = () => {
    if (repRef.current) {
      clearInterval(repRef.current);
      repRef.current = null;
    }
    if (holdRef.current) {
      clearTimeout(holdRef.current);
      holdRef.current = null;
    }
  };
  useEffect(() => stop, []);
  const start = (e: React.PointerEvent) => {
    stop();
    pressRef.current = { x: e.clientX, y: e.clientY, moved: false };
    // opakování až po 170 ms podržení - krátký tah je scroll, ne použití
    holdRef.current = setTimeout(() => {
      holdRef.current = null;
      if (!pressRef.current || pressRef.current.moved) return;
      props.onPick(u);
      repRef.current = setInterval(() => props.onPick(u), 220);
    }, 170);
  };
  const move = (e: React.PointerEvent) => {
    const st = pressRef.current;
    if (!st || st.moved) return;
    const dx = e.clientX - st.x;
    const dy = e.clientY - st.y;
    if (dx * dx + dy * dy > 144) {
      st.moved = true;
      stop();
    }
  };
  const up = () => {
    const st = pressRef.current;
    const held = !!repRef.current || holdRef.current === null;
    stop();
    pressRef.current = null;
    // rychlý tap bez pohybu = jednorázové použití
    if (st && !st.moved && !held) props.onPick(u);
  };
  return (
    <button
      onPointerDown={start}
      onPointerMove={move}
      onPointerUp={up}
      onPointerLeave={stop}
      onPointerCancel={stop}
      onContextMenu={(ev) => ev.preventDefault()}
      className="ltp-ucard ltp-sheen flex flex-row items-center gap-3 rounded-2xl border-2 p-2 text-left sm:flex-col sm:items-center sm:gap-2 sm:p-4 sm:text-center"
      style={{
        borderColor: ri.color,
        boxShadow: `0 8px 26px rgba(0,0,0,.5), 0 0 20px ${ri.color}55`,
        background:
          u.rarity >= 6
            ? "linear-gradient(135deg, rgba(244,114,182,0.30), rgba(139,92,246,0.30), rgba(56,189,248,0.30), rgba(74,222,128,0.30), rgba(250,204,21,0.30))"
            : `linear-gradient(to bottom right, ${ri.color}33, rgba(255,255,255,0.04))`,
      }}
    >
      <span
        className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-2xl sm:h-14 sm:w-14 sm:text-4xl"
        style={{
          background: `radial-gradient(circle at 35% 30%, ${ri.color}66, rgba(0,0,0,.5))`,
          boxShadow: `inset 0 0 0 1.5px ${ri.color}aa, 0 0 14px ${ri.color}55`,
        }}
      >
        {u.emoji}
      </span>
      <span className="flex flex-col gap-0.5">
        <span className="text-[9px] font-bold tracking-widest" style={{ color: ri.color }}>
          {u.rarity >= 5 ? `✨ ${ri.label}` : ri.label}
        </span>
        <span className="text-sm font-extrabold text-amber-100 sm:text-base">{u.name}</span>
        <span className="text-xs text-white/70">{u.desc}</span>
        <span className="mt-0.5 w-fit rounded-full border border-fuchsia-400/40 bg-fuchsia-500/20 px-1.5 py-px text-[8px] font-bold text-fuchsia-200">

    setOver(null);

  };

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;

    const resize = () => {
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(320, Math.floor(rect.width));
      const hgt = Math.max(240, Math.floor(rect.height));
      VW = w;
      VH = hgt;
      const raw = Math.min(2, window.devicePixelRatio || 1);
      // 🚀 interní rozlišení se stropem 750p (1333×750) - fill-rate je zabiják FPS; DPR smí jít i pod 1, adaptivní scaler doladí
      DPR_CAP = Math.max(0.55, Math.min(raw, 1333 / w, 750 / hgt));
      DPR = DPR_CAP;
      canvas.width = Math.floor(w * DPR);
      canvas.height = Math.floor(hgt * DPR);
    };
    resize();
    let ro: ResizeObserver | null = null;
    if (typeof ResizeObserver !== "undefined") {
      ro = new ResizeObserver(resize);
      ro.observe(canvas);
    }
    let raf = 0;
    let last = performance.now();
    let uiT = 0;
    let achT = 0;
    let qTime = 0;
    let qFrames = 0;
    let prevOver = false;

    const loop = (now: number) => {
      raf = requestAnimationFrame(loop);
      const rawDt = (now - last) / 1000;
      const dt = Math.min(0.05, rawDt);
      last = now;
      // 📉📈 adaptivní kvalita: každou sekundu podle reálného frame time se doladí DPR (1..DPR_CAP) - plynulost před ostrostí
      qFrames++;
      qTime += rawDt;
      if (qTime >= 1) {
        const avg = qTime / qFrames;
        let nd = DPR;
        if (avg > 1 / 27 && nd > 0.55) nd = Math.max(0.55, nd - 0.25);
        else if (avg < 1 / 52 && nd < DPR_CAP) nd = Math.min(DPR_CAP, nd + 0.25);
        if (nd !== DPR) {
          DPR = nd;
          canvas.width = Math.floor(VW * DPR);
          canvas.height = Math.floor(VH * DPR);
        }
        qTime = 0;
        qFrames = 0;
      }
      const g = gameRef.current;
      // ♻️ reset příznaku smrti - bez toho by se obrazovka konce ukázala jen při první smrti za session
      if (!g.over) prevOver = false;

      // pohyb: joystick (analog) nebo klávesy
      const joy = joyRef.current;
      let move: Vec = { x: 0, y: 0 };
      if (joy.id !== null) {
        const jdx = joy.x - joy.ax;
        const jdy = joy.y - joy.ay;
        const d = Math.sqrt(jdx * jdx + jdy * jdy);
        if (d > 6) {
          const mag = Math.min(1, d / JOY_R);
          move = { x: (jdx / d) * mag, y: (jdy / d) * mag };
        }
      } else {
        const k = keysRef.current;
        const kx = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
        const ky = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0);
        if (kx !== 0 || ky !== 0) {
          const kl = Math.sqrt(kx * kx + ky * ky);
          move = { x: kx / kl, y: ky / kl };
        }
      }
      let wantDash = false;
      if (dashRef.current) {
        wantDash = true;
        dashRef.current = false;
      }

      const blocked = g.paused || g.userPaused || g.over || !g.running;
      // ⏸ hit-stop - na zabití bosse / ult svět na zlomek vteřiny ztuhne (render běží dál)
      if (g.hitStop > 0) {
        g.hitStop -= dt;
      } else if (!blocked) {
        updateGame(g, dt, move, wantDash);
      }
      // 🏆 zlatý záblesk po bossovi plynule vyprchá
      if (g.goldFlash > 0) g.goldFlash = Math.max(0, g.goldFlash - dt * 2.2);
      // 👹 červený záblesk po spawnu bosse plynule vyprchá
      if (g.dreadFlash > 0) g.dreadFlash = Math.max(0, g.dreadFlash - dt * 1.6);
      if (!g.userPaused) updateFx(g, dt);
      render(ctx, g, joy);
      // 🎵 hudba na pozadí - klidná, u bosse intenzivní
      musicTick(g);
      // 🌦️ ambientní smyčka počasí (déšť/bouře/vítr)
      ambTick(g);

      // otevření bedny z bosse
      if (g.crateOpen) {
        g.crateOpen = false;
        g.paused = true;
        setCrate(pickCrateUpgrades(g));
      }


      // 🏆 trofeje - kontrola každé ~2 s, odměna se zapisuje do mety jen jednou
      achT += dt;
      if (achT > 2) {
        achT = 0;
        if (g.running && !g.over && !g.sandbox) {
          checkAch(g, (id, reward) => {
            setNewAch((a) => (a.indexOf(id) === -1 ? [...a, id] : a));
            setMeta((m) => {
              if (m.ach?.[id]) return m;
              const nm = { ...m, pts: m.pts + reward, ach: { ...(m.ach || {}), [id]: true } };
              saveMeta(nm);
              return nm;
            });
          });
        }
      }

      if (g.running && !g.over && g.pending > 0 && !g.paused) {
        g.paused = true;
        setUpgrades(pickUpgrades(g));
      }

      if (g.over && !prevOver) {
        prevOver = true;
        // 🌱 semínka za run - zabití, přežitý čas i levely; ⚖️ obtížnost násobí výnos
        const seedMul = (DIFFS[g.diff] || DIFFS[1]).seed;
        const earned = Math.floor((Math.floor(g.time) + g.kills * 15 + g.level * 40) * (g.sandbox ? 0 : seedMul));
        setOver({ level: g.level, kills: g.kills, time: g.time, earned });
        setBest((b) => Math.max(b, earned));
        // 🏆 když se skóre trefí mezi top 10, nabídne se zápis jména do žebříčku
        // (čteme čerstvou metu z localStorage - žádná zaprášená closure)
        if (!g.sandbox && boardQualifies(loadMeta(), earned)) {
          setNameVal(loadMeta().lastName || "");
          setNameSaved(false);
          setAskName(true);
        } else {
          setAskName(false);
        }
        setMeta((m) => {
          // 🏆 rekord za classu + 📅 denní výzva (rekord se resetuje s každým novým dnem)
          const dk = new Date().toISOString().slice(0, 10);
          const nm: Meta = {
            ...m,
            pts: m.pts + earned,
            lvl: m.lvl,
            best: { ...(m.best || {}), [g.cls]: Math.max(m.best?.[g.cls] || 0, earned) },
            daily: g.daily
              ? {
                  key: dk,
                  best: m.daily?.key === dk ? Math.max(m.daily.best, earned) : earned,
                }
              : m.daily,
          };
          saveMeta(nm);
          return nm;
        });
      }

      uiT += dt;
      if (uiT > 0.15) {
        uiT = 0;
        setUi({
          level: g.level,
          xp: Math.floor(g.xp),
          need: g.need,
          kills: g.kills,
          hp: Math.max(0, Math.ceil(g.hero.hp)),
          maxHp: g.hero.maxHp,
          dash: 1 - g.hero.dashCd / HERO.dashCd,
          time: g.time,
          paused: g.userPaused,
          weapons: g.weapons.map((w) => `${WEAPONS[w.id].emoji}${w.lvl >= 5 ? "⭐" : w.lvl > 1 ? w.lvl : ""}`).join(" "),
          dmg: g.stats.dmgMul,
          fire: g.stats.fireMul,
          spd: g.stats.speedMul,
          crit: g.stats.crit,
          arm: g.stats.armor,
          ls: g.stats.lifesteal,
          ms: g.stats.multishot,
          bk: g.bossKills,
          night: g.night,
          weather: g.weather,
          combo: g.combo,
          ult: g.ultCd,
          ultMax: ULTS[g.cls]?.cd ?? 30,
          invuln: g.hero.invuln,
          slowT: g.hero.slowT,
          poisT: g.hero.poisT,
        });
      }
    };
    raf = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(raf);
      if (ro) ro.disconnect();
    };
  }, [pickUpgrades]);

  useEffect(() => {
    const down = (e: KeyboardEvent) => {
      keysRef.current[e.code] = true;
      if (e.code === "Space") {
        e.preventDefault();
        dashRef.current = true;
      }
      // ⚡ E = ultimátum třídy (až po odpočtu)
      if (e.code === "KeyE") {
        castUlt(gameRef.current);
      }
      if (e.code === "KeyP") {
        const g = gameRef.current;
        if (g.running && !g.paused && !g.over) g.userPaused = !g.userPaused;
      }
      if (e.code === "KeyB") {
        const g = gameRef.current;
        if (g.running && g.sandbox && !g.over) spawnBoss(g);
      }
      if (e.code.startsWith("Arrow")) e.preventDefault();
    };
    const up = (e: KeyboardEvent) => {
      keysRef.current[e.code] = false;
    };
    window.addEventListener("keydown", down);
    window.addEventListener("keyup", up);
    return () => {
      window.removeEventListener("keydown", down);
      window.removeEventListener("keyup", up);
    };
  }, []);

  // 🏚️ auto-pauza - zavřeš tab nebo okno a hra sama zastaví, ať tě nic nepřekvapí
  useEffect(() => {
    const pause = () => {
      const g = gameRef.current;
      if (g.running && !g.paused && !g.userPaused && !g.over) g.userPaused = true;
    };
    const vis = () => {
      if (document.hidden) pause();
    };
    window.addEventListener("visibilitychange", vis);
    window.addEventListener("blur", pause);
    return () => {
      window.removeEventListener("visibilitychange", vis);
      window.removeEventListener("blur", pause);
    };
  }, []);

  useEffect(() => {
    const onKey = (e: KeyboardEvent) => {
      if (!/^Digit[1-5]$/.test(e.code)) return;

      if (upgrades && n < upgrades.length) {
        e.preventDefault();
        applyUpgrade(upgrades[n]);
      } else if (crate && n < crate.length) {
        e.preventDefault();
        applyCrate(crate[n]);
      }
    };
    window.addEventListener("keydown", onKey);

    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [upgrades, crate]);

    return { x: e.clientX - rect.left, y: e.clientY - rect.top };

      joy.y = toCanvasPos(e).y;

      const jdx = joy.x - joy.ax;
      const jdy = joy.y - joy.ay;
      const jd = Math.sqrt(jdx * jdx + jdy * jdy);
      if (jd > JOY_R) {
        joy.ax += (jdx / jd) * (jd - JOY_R);
        joy.ay += (jdy / jd) * (jd - JOY_R);
      }
    }
  };

    const joy = joyRef.current;
    if (joy.id === pointerId) {
      joy.id = null;
      joy.active = false;

        @keyframes ltpSbxRing { 0%,100% { box-shadow: 0 0 0 0 rgba(232,121,249,.55), 0 0 18px rgba(232,121,249,.5); } 70% { box-shadow: 0 0 0 13px rgba(232,121,249,0), 0 0 28px rgba(232,121,249,.85); } }

      <div className="absolute inset-0">

        />

            {trk("start")} {sandboxSel ? "🧪" : "▶"}

        </div>
      )}
    </div>
  );
}

// 🚀 start hru - zruš hlídač a připoj komponentu
if (window.ltpWatch) clearTimeout(window.ltpWatch);
// 🏁 hra stojí na nohou - od teď žádná chybová obrazovka nepřkryje hraní
window.__ltpOK = true;
var ltpBootEl = document.getElementById("boot");
if (ltpBootEl) ltpBootEl.remove();
var ltpRootEl = document.getElementById("root");
ReactDOM.createRoot(ltpRootEl).render(React.createElement(LoukaTisicePriser));
</script>
</body>
</html>
