name: Deploy hra na GitHub Pages

on:
  push:
    branches: [main, gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Zapni GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Nahraj hru
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publikuj
        uses: actions/deploy-pages@v4
        id: deployment
