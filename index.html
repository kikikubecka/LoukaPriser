        if (e.kind === 6 && !e.boss && e.lungeT > 0) return;
        // 🦡 zahrabaný jezevec - pod zemí nezranitelný
        if ((e.subT ?? 0) > 0) return;
        const rr = e.r + 5;
        // 🧙‍♂️ swept kolize po celé úsečce letu - při výkyvu dt projektil cíl nesmí přeskočit nezasažený
        if (segHit(ppx, ppy, a.x, a.y, e.x, e.y, rr)) {
          a.hits.push(e.id);
          e.hp -= a.dmg;
          e.flash = 0.09;
          if (a.frost) {
            e.slow = a.lvl >= 5 ? 2.6 : 1.6;
            playSfx(g, "freeze");
          }
          // 🌲 dřevěné třístí při zásahu vysype zelené lístečky
          if (a.kind === 16) burst(g, a.x, a.y, 2, 100, 80);
          const kb = (e.big ? 40 : 130) * a.knock * (e.boss ? 0.12 : 1);
          const al = Math.atan2(a.vy, a.vx);
          e.kbx += Math.cos(al) * kb;
          e.kby += Math.sin(al) * kb;
          dmgText(g, e, a.dmg, a.crit, a.src || "other");
          playSfx(g, a.crit ? "crit" : "hit");
          if (e.hp <= 0) killEnemy(g, e);
          if (a.expl) {
            // 🔥 ohnivá koule - plošná exploze (ultimate = větší radius)
            const aoe = a.lvl >= 5 ? 100 : 64;
            burst(g, a.x, a.y, 12, 20, 210);
            g.shake = Math.max(g.shake, 3);
            gridEach(a.x, a.y, aoe + 100, (e2) => {
              if (e2.dead || e2.id === e.id) return;
              if (e2.immT && e2.immT > 0) return;
              if (e2.kind === 6 && !e2.boss && e2.lungeT > 0) return;
              if ((e2.subT ?? 0) > 0) return;
              if (dist2(a.x, a.y, e2.x, e2.y) < aoe * aoe) {
                e2.hp -= a.dmg * 0.75;
                e2.flash = 0.09;
                if (e2.hp <= 0) killEnemy(g, e2);
              }
            });
            remove = true;
          } else if (a.chain > 0) {
            // ⚡ řetězový blesk - přeskočí na další cíl v okolí
            let nt: Enemy | null = null;
            let nd = 300 * 300;
            gridEach(a.x, a.y, 300, (e2) => {
              if (e2.dead || a.hits.indexOf(e2.id) !== -1) return;
              if (e2.immT && e2.immT > 0) return; // blesk nepřeskočí na bosse v imunitě
              const d2 = dist2(a.x, a.y, e2.x, e2.y);
              if (d2 < nd) {
                nd = d2;
                nt = e2;
              }
            });
            if (nt) {
              a.chain -= 1;
              const na = Math.atan2(nt.y - a.y, nt.x - a.x);
              const spd = Math.sqrt(a.vx * a.vx + a.vy * a.vy);
              a.vx = Math.cos(na) * spd;
              a.vy = Math.sin(na) * spd;
              a.x += a.vx * dt;
              a.y += a.vy * dt;
            } else {
              remove = true;
            }
          } else if (a.pierce > 0) {
            a.pierce -= 1;
          } else {
            remove = true;
          }
          hit = true; // místo break - jsme v callbacku
        }
      });
    }
    if (remove) {
      // ♻️ swap-pop + návrat do bazénu - žádné splice, žádné GC škytání
      if (ARROW_POOL.length < 300) ARROW_POOL.push(a);
      g.arrows[i] = g.arrows[g.arrows.length - 1];
      g.arrows.pop();
    }
  }

  // nepřátelé
  for (const e of g.enemies) {
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt);
    e.slow = Math.max(0, e.slow - dt);
    // 🔢 vylití sčítaného poškození nad hlavu
    if ((e.dmgAccT ?? 0) > 0) {
      e.dmgAccT -= dt;
      if ((e.dmgAccT ?? 0) <= 0) {
        addText(g, e.x, e.y - e.r - 6, `${Math.round(e.dmgAcc ?? 0)}`, e.dmgAccCrit ? 48 : 0, e.dmgAccCrit ? 18 : 13);
        e.dmgAcc = 0;
        e.dmgAccCrit = false;
      }
    }
    // 🛡️ imunita bosse mezi fázemi
    if (e.immT && e.immT > 0) e.immT -= dt;
    const dx = h.x - e.x;
    const dy = h.y - e.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    // déšť nepřátele zdržuje, pakt sběratele a noční tempo je zrychlují, korunka "swift" dvojnásobně
    let sp = e.speed * (e.slow > 0 ? 0.45 : 1) * (g.night ? 1.6 : 1) * g.enemySpdMul * (g.weather === "rain" ? 0.85 : 1) * (e.elite === "swift" ? 1.5 : 1);
    let dirx = dx / d;
    let diry = dy / d;
    // ⚙️ běžní nepřátelé v okolí turetek je cíleně napadnou (bossové jdou vždy po tobě)
    if (!e.boss && !e.minib && e.kind !== 19 && g.turrets.length > 0) {
      let tt: Turret | null = null;
      let tds = 360 * 360;
      for (const tu of g.turrets) {
        const dd2 = dist2(e.x, e.y, tu.x, tu.y);
        if (dd2 < tds) {
          tds = dd2;
          tt = tu;
        }
      }
      if (tt) {
        const tdd = Math.sqrt(tds) || 1;
        dirx = (tt.x - e.x) / tdd;
        diry = (tt.y - e.y) / tdd;
        sp *= 1.25;
      }
    }
    // 🌟 elitní korunky: "shield" občas zneviditelní rány, "vamp" léčí okolí
    if (e.elite === "shield") {
      e.eliteT = (e.eliteT ?? 0) - dt;
      if ((e.eliteT ?? 0) <= 0) {
        e.eliteT = 4;
        e.immT = 0.8;
        burst(g, e.x, e.y, 6, 220, 90);
      }
    }
    if (e.elite === "vamp") {
      e.eliteT = (e.eliteT ?? 0) - dt;
      if ((e.eliteT ?? 0) <= 0) {
        e.eliteT = 1.4;
        for (const e2 of g.enemies) {
          if (e2.dead || e2 === e || e2.hp >= e2.maxHp) continue;
          if (dist2(e.x, e.y, e2.x, e2.y) < 190 * 190) e2.hp = Math.min(e2.maxHp, e2.hp + e2.maxHp * 0.03);
        }
      }
    }
    // 🐍 dravec: číhá nehybně schovaný v trávě, na dohled telegrafovaně skočí
    if (e.kind === 19 && !e.boss && !e.minib) {
      e.lungeCd -= dt;
      if (e.lungeT > 0) {
        e.lungeT -= dt;
        sp = 430;
        if (e.lungeT <= 0) e.lungeCd = 3.5 + Math.random();
      } else {
        sp = 0;
        if (e.lungeCd <= 0 && d < 330) {
          e.lungeT = 0.95;
          g.telegraphs.push({ x: e.x, y: e.y, r: 42, t: 0, dur: 0.5, dmg: e.dmg });
          burst(g, e.x, e.y, 10, 100, 150);
        }
      }
    }
    // 🌷 květomil: drží odstup a doléčuje zraněné nepřátele v okolí - zabij ho nejdřív!
    if (e.kind === 17 && !e.boss && !e.minib) {
      if (d < 230) {
        dirx = -dirx;
        diry = -diry;
      }
      e.shootCd -= dt;
      if (e.shootCd <= 0) {
        e.shootCd = 1.4;
        let ht: Enemy | null = null;
        let bw = 0.3;
        for (const e2 of g.enemies) {
          if (e2.dead || e2 === e || e2.hp >= e2.maxHp) continue;
          if (dist2(e.x, e.y, e2.x, e2.y) > 300 * 300) continue;
          const fr = e2.hp / e2.maxHp;
          if (fr < bw) {
            bw = fr;
            ht = e2;
          }
        }
        if (ht) {
          // bossovi doléčuje jen polovinu - ať ho jdeš zabít, ne čekat na vyhlazení
          const hAmt = ht.boss ? ht.maxHp * 0.025 + 3 : ht.maxHp * 0.06 + 5;
          ht.hp = Math.min(ht.maxHp, ht.hp + hAmt);
          ht.flash = 0.06;
          g.particles.push({ x: e.x, y: e.y - e.r, vx: (ht.x - e.x) * 0.9, vy: (ht.y - e.y) * 0.9 - 20, life: 0.45, maxLife: 0.45, r: 2.2, hue: 145 });
          addText(g, ht.x, ht.y - ht.r - 8, "💚", 145, 12);
        }
      }
    }
    // štvanec: náhodné výpady
    if (e.kind === 3) {
      e.lungeCd -= dt;
      if (e.lungeT > 0) {
        e.lungeT -= dt;
        sp *= 3.2;
      } else if (e.lungeCd <= 0 && d < 460) {
        e.lungeT = 0.45;
        e.lungeCd = 2.4 + Math.random();
      }
    }
    // duch: vlnivý let ze strany na stranu
    if (e.kind === 6) {
      const wob = Math.sin(g.gtime * 6 + e.id * 1.7) * 0.55;
      const ndx = dirx - diry * wob;
      const ndy = diry + dirx * wob;
      dirx = ndx;
      diry = ndy;
    }
    // boss: speciální útoky podle druhu
    if (e.boss) {
      // ⚔️ fáze bosse - normální boss má 2, finální 4 fáze; přechod = 10 s imunity a N× silnější boss
      const phases = e.final ? 4 : 2;
      if (e.phase < phases && e.hp <= e.maxHp * (1 - e.phase / phases)) {
        e.phase += 1;
        // vzchopení: 5 s imunity, trochu HP, větší rychlost
        e.immT = 5;
        e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.12);
        e.speed *= 1.12;
        // fáze N = N× větší poškození oproti základu (1→2 ×2, 2→3 ×1.5, 3→4 ×1.33)
        e.dmg = Math.round(e.dmg * (e.phase / (e.phase - 1)));
        g.shake = 12;
        burst(g, e.x, e.y, 30, e.hue, 240);
        addText(g, e.x, e.y - e.r - 16, `🛡️ FÁZE ${e.phase}! IMUNITA!`, 195, 20);
      }
      const phMul = 1 / e.phase; // fáze N = N× rychlejší kadence útoků
      // 🌷 květomil král se sám dotahuje - zabij ho dřív, než tě přeběhá
      if (e.kind === 17 && e.hp < e.maxHp && (e.immT ?? 0) <= 0) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.012 * dt);
      // mumie král & král duchů - prudký výpad (dash) k hrdinovi
      if (e.kind === 2 || e.kind === 6) {
        e.lungeCd -= dt;
        if (e.lungeT > 0) {
          e.lungeT -= dt;
          sp *= e.kind === 6 ? 4.2 : 3.8;
        } else if (e.lungeCd <= 0 && d < 420) {
          e.lungeT = e.kind === 6 ? 0.4 : 0.5;
          e.lungeCd = e.kind === 6 ? 2.6 : 3.2;
          burst(g, e.x, e.y, 6, e.hue, 140);
        }
      }
      // rozpulčák - pravidelně plodí malé rozpulce
      if (e.kind === 8) {
        e.lungeCd -= dt;
        if (e.lungeCd <= 0) {
          e.lungeCd = 4.5;
          for (let s = 0; s < 2; s++) {
            const shp = 20 + g.time * 0.3;
            g.enemies.push({
              id: g.nextId++,
              x: e.x + (Math.random() - 0.5) * 50,
              y: e.y + (Math.random() - 0.5) * 50,
              r: 12,
              hp: shp,
              maxHp: shp,
              speed: 62,
              dmg: Math.round(e.dmg * 0.45),
              hue: 300,
              big: false,
              flash: 0,
              kbx: 0,
              kby: 0,
              dead: false,
              kind: 8,
              slow: 0,
              lungeCd: 1,
              lungeT: 0,
              shootCd: 1,
              boss: false,
              minib: false,
              final: false,
              phase: 1,
            });
          }
          burst(g, e.x, e.y, 8, 300, 120);
        }
      }
      // král slizů - pravidelně plodí slizy
      if (e.kind === 0) {
        e.lungeCd -= dt;
        if (e.lungeCd <= 0) {
          e.lungeCd = 4.2;
          for (let s = 0; s < 2; s++) {
            const shp = 16 + g.time * 0.25;
            g.enemies.push({
              id: g.nextId++,
              x: e.x + (Math.random() - 0.5) * 50,
              y: e.y + (Math.random() - 0.5) * 50,
              r: 11,
              hp: shp,
              maxHp: shp,
              speed: 72,
              dmg: Math.round(e.dmg * 0.4),
              hue: 120,
              big: false,
              flash: 0,
              kbx: 0,
              kby: 0,
              dead: false,
              kind: 0,
              slow: 0,
              lungeCd: 1,
              lungeT: 0,
              shootCd: 1,
              boss: false,
              minib: false,
              final: false,
              phase: 1,
            });
          }
          burst(g, e.x, e.y, 8, 120, 120);
        }
      }
      e.shootCd -= dt;
      if (e.shootCd <= 0) {
        // telegrafované zóny - každý druh jinak rychlý a hustý
        if (e.kind === 5) {
          e.shootCd = 2.1 * (e.final ? 0.75 : 1) * phMul;
          for (let k = 0; k < (e.final ? 5 : 3); k++) {
            const tx = h.x + (Math.random() - 0.5) * 150;
            const ty = h.y + (Math.random() - 0.5) * 150;
            g.telegraphs.push({ x: tx, y: ty, r: 46, t: 0, dur: 0.7, dmg: e.dmg * 0.7 });
          }
          // arcišaman navíc vystřelí koule do tří stran
          const ba = Math.atan2(dy, dx);
          for (let s = -1; s <= 1; s++) {
            g.eBolts.push({ x: e.x, y: e.y, vx: Math.cos(ba + s * 0.28) * 260, vy: Math.sin(ba + s * 0.28) * 260, life: 4, dmg: e.dmg * 0.5 });
          }
        } else if (e.kind === 6) {
          // král duchů - rychlé drobné zóny
          e.shootCd = 1.7 * (e.final ? 0.75 : 1) * phMul;
          for (let k = 0; k < (e.final ? 7 : 4); k++) {
            const tx = h.x + (Math.random() - 0.5) * 170;
            const ty = h.y + (Math.random() - 0.5) * 170;
            g.telegraphs.push({ x: tx, y: ty, r: 40, t: 0, dur: 0.6, dmg: e.dmg * 0.7 });
          }
        } else if (e.kind === 7) {
          // kanón obr - obří zóny, ale pomaleji
          e.shootCd = 2.8 * (e.final ? 0.75 : 1) * phMul;
          for (let k = 0; k < (e.final ? 4 : 2); k++) {
            const tx = h.x + (Math.random() - 0.5) * 120;
            const ty = h.y + (Math.random() - 0.5) * 120;
            g.telegraphs.push({ x: tx, y: ty, r: 92, t: 0, dur: 0.95, dmg: e.dmg * 0.7 });
          }
        } else if (e.kind === 8) {
          // rozpulčák - zóny ve středním tempu
          e.shootCd = 2.4 * (e.final ? 0.75 : 1) * phMul;
          const n = (e.final ? 4 : 2) + (Math.random() < 0.5 ? 1 : 0);
          for (let k = 0; k < n; k++) {
            const tx = h.x + (Math.random() - 0.5) * 150;
            const ty = h.y + (Math.random() - 0.5) * 150;
            g.telegraphs.push({ x: tx, y: ty, r: 55, t: 0, dur: 0.75, dmg: e.dmg * 0.7 });
          }
        } else {
          e.shootCd = 2.6 * (e.final ? 0.75 : 1) * phMul;
          const n = (e.final ? 4 : 2) + (Math.random() < 0.4 ? 1 : 0);
          for (let k = 0; k < n; k++) {
            const tx = h.x + (Math.random() - 0.5) * 140;
            const ty = h.y + (Math.random() - 0.5) * 140;
            g.telegraphs.push({ x: tx, y: ty, r: 60, t: 0, dur: 0.8, dmg: e.dmg * 0.7 });
          }
        }
        // fáze 2+: nový útok - přímé projektily na hrdinu
        // finální bossové střílí spršku lehce naváděných projektilů
        if (e.phase >= 2) {
          const ba = Math.atan2(dy, dx);
          const cnt = e.final ? (e.phase >= 4 ? 12 : e.phase >= 3 ? 8 : 5) : e.phase >= 3 ? 5 : 3;
          for (let s = -(cnt - 1) / 2; s <= (cnt - 1) / 2; s++) {
            g.eBolts.push({ x: e.x, y: e.y, vx: Math.cos(ba + s * 0.22) * 300, vy: Math.sin(ba + s * 0.22) * 300, life: 4, dmg: Math.round(e.dmg * 0.4), home: e.final });
          }
        }
        // fáze 3 (finální zúřilost): kruhová sprška projektilů
        if (e.phase >= 3) {
          const n2 = e.final ? (e.phase >= 4 ? 18 : 14) : 10;
          const off = Math.random() * Math.PI;
          for (let s = 0; s < n2; s++) {
            const sa = off + (s / n2) * Math.PI * 2;
            g.eBolts.push({ x: e.x, y: e.y, vx: Math.cos(sa) * 220, vy: Math.sin(sa) * 220, life: 3.5, dmg: Math.round(e.dmg * 0.35), home: e.final && s % 2 === 0 });
          }
        }
        burst(g, e.x, e.y, 5, e.hue, 120);
      }
      // boss zůstává v aréně
      if (g.arena.active) {
        const adx = e.x - g.arena.x;
        const ady = e.y - g.arena.y;
        const ad = Math.sqrt(adx * adx + ady * ady) || 1;
        const maxR = g.arena.r - e.r;
        if (ad > maxR) {
          e.x = g.arena.x + (adx / ad) * maxR;
          e.y = g.arena.y + (ady / ad) * maxR;
        }
      }
    }
    // šaman: drží odstup a střílí koule (boss-arcišaman má vlastní režim)
    if (e.kind === 5 && !e.boss) {
      if (d < 190) {
        dirx = -dirx;
        diry = -diry;
      }
      e.shootCd -= dt;
      if (e.shootCd <= 0 && d < 480) {
        e.shootCd = 2.6;
        const bs = 240;
        g.eBolts.push({ x: e.x, y: e.y, vx: dirx * bs, vy: diry * bs, life: 4, dmg: e.dmg });
        burst(g, e.x, e.y, 3, 195, 90);
      }
    }
    // 🌟 elitní příšera: drží odstup a pálí dávku tří rychlých kouli
    if (e.kind === 9) {
      if (d < 240) {
        dirx = -dirx;
        diry = -diry;
      }
      e.shootCd -= dt;
      if (e.shootCd <= 0 && d < 520) {
        e.shootCd = 1.7;
        const ba2 = Math.atan2(h.y - e.y, h.x - e.x);
        for (let s2 = -1; s2 <= 1; s2++) {
          g.eBolts.push({ x: e.x, y: e.y, vx: Math.cos(ba2 + s2 * 0.16) * 300, vy: Math.sin(ba2 + s2 * 0.16) * 300, life: 4, dmg: e.dmg });
        }
        burst(g, e.x, e.y, 4, 265, 110);
      }
    }
    // 💣 dynamiter: drží střední odstup, obchází tě a háže dynamit (polovina HP!)
    // 🧟 mumie: obvazy se stahují a rány se samy zacelují
    if (e.kind === 2 && !e.boss && !e.minib && e.hp < e.maxHp) {
      e.hp = Math.min(e.maxHp, e.hp + 2.5 * dt);
    }
    // 👹 brut: rozřízené dupnutí - rázová vlnka zraní blízko stojícího hrdinu
    if (e.kind === 4 && !e.boss && !e.minib) {
      e.lungeCd -= dt;
      if (e.lungeCd <= 0 && d < 180) {
        e.lungeCd = 4.5;
        g.shake = Math.max(g.shake, 5);
        burst(g, e.x, e.y, 16, e.hue, 200);
        addText(g, e.x, e.y - e.r - 12, "💢", 70, 17);
        if (d < 150 && h.invuln <= 0) damageHero(g, Math.round(e.dmg * 0.7));
      }
    }
    // 👻 duch: fáze - prolnul skrze hrdinu i střely
    if (e.kind === 6 && !e.boss) {
      e.lungeCd -= dt;
      if (e.lungeT > 0) {
        e.lungeT -= dt;
      } else if (e.lungeCd <= 0) {
        e.lungeT = 1.6;
        e.lungeCd = 5 + Math.random() * 2;
        burst(g, e.x, e.y, 7, 175, 90);
        addText(g, e.x, e.y - e.r - 10, "🌀", 60, 14);
      }
    }
    // 🗿 kamenáč: mrští balvanem po hrdinovi
    if (e.kind === 7 && !e.boss && !e.minib) {
      e.shootCd -= dt;
      if (e.shootCd <= 0 && d < 520) {
        e.shootCd = 4;
        const ra = Math.atan2(h.y - e.y, h.x - e.x);
        g.eBolts.push({ x: e.x, y: e.y, vx: Math.cos(ra) * 240, vy: Math.sin(ra) * 240, life: 4, dmg: Math.round(e.dmg * 0.6) });
        burst(g, e.x, e.y, 7, e.hue, 130);
        addText(g, e.x, e.y - e.r - 12, "🪨", 60, 15);
      }
    }
    // 😈 rozpulc: blik-teleport blízko hrdiny
    if (e.kind === 8 && !e.boss && !e.minib) {
      e.lungeCd -= dt;
      if (e.lungeCd <= 0 && d > 90) {
        e.lungeCd = 5.5 + Math.random() * 1.5;
        burst(g, e.x, e.y, 9, 300, 150);
        const ta = Math.random() * Math.PI * 2;
        const td = 130 + Math.random() * 70;
        e.x = Math.max(e.r, Math.min(ARENA - e.r, h.x + Math.cos(ta) * td));
        e.y = Math.max(e.r, Math.min(ARENA - e.r, h.y + Math.sin(ta) * td));
        burst(g, e.x, e.y, 9, 300, 150);
        addText(g, e.x, e.y - e.r - 10, "✨", 60, 15);
      }
    }
    if (e.kind === 10) {
      if (d < 280) {
        dirx = -dirx;
        diry = -diry;
      } else if (d < 460) {
        // drží odstup a těkavě obchází hrdinu v obráceném směru
        const sg = Math.sin(g.gtime * 1.3 + e.id * 2.1) >= 0 ? 1 : -1;
        const ndx = -diry * sg;
        const ndy = dirx * sg;
        dirx = ndx;
        diry = ndy;
      }
      e.shootCd -= dt;
      if (e.shootCd <= 0 && d < 620) {
        e.shootCd = 3.2;
        // 💣 zóna dopadu: rudá → zežloutne těsně před výbuchem, dmg = polovina max HP
        g.telegraphs.push({ x: h.x + (Math.random() - 0.5) * 40, y: h.y + (Math.random() - 0.5) * 40, r: 58, t: 0, dur: 1.1, dmg: h.maxHp * 0.5, dyn: true });
        addText(g, e.x, e.y - e.r - 10, "💣", 20, 15);
      }
    }
    if (e.kind === 11) {
      // ⛏️ MINER - drží větší odstup než dynamiter, couvá, když se přiblížíš
      if (d < 190) {
        dirx = -dirx;
        diry = -diry;
      }
      e.shootCd -= dt;
      if (e.shootCd <= 0 && d < 900) {
        e.shootCd = 3.4;
        // krumpáč-bumerang: vyletí k tobě, brzdí se a vrací se zpět k minerovi
        const pa = Math.atan2(dy, dx);
        g.eBolts.push({ x: e.x, y: e.y, vx: Math.cos(pa) * 400, vy: Math.sin(pa) * 400, life: 6, dmg: e.dmg, boom: 0, oid: e.id });
        addText(g, e.x, e.y - e.r - 10, "⛏️", 20, 15);
      }
    }
    // 🐝 vosa: kličkuje ze strany na stranu (úhyb se musí předvídat)
    if (e.kind === 12) {
      const sw = Math.sin(g.gtime * 8 + e.id * 3.1) * 0.85;
      const nx = dirx - diry * sw;
      const ny = diry + dirx * sw;
      dirx = nx;
      diry = ny;
    }
    // 🦡 jezevec: zahrabe se, proběhne pod zemí k hrdinovi a vyletí výbuchem
    if (e.kind === 13) {
      e.lungeCd -= dt;
      if ((e.subT ?? 0) <= 0 && e.lungeCd <= 0) {
        e.subT = 2.4;
        burst(g, e.x, e.y, 10, 30, 120);
        addText(g, e.x, e.y - e.r - 10, "🕳️", 60, 14);
      }
      if ((e.subT ?? 0) > 0) {
        e.subT = (e.subT ?? 0) - dt;
        sp = 200; // pod zemí se plazí rychle
        if ((e.subT ?? 0) <= 0) {
          e.subT = 0;
          e.lungeCd = 6.5 + Math.random() * 1.5;
          // výstup - výbuch hlíny: telegrafovaná zóna přímo na místě vynoření
          g.telegraphs.push({ x: e.x, y: e.y, r: 55, t: 0, dur: 0.65, dmg: e.dmg });
          burst(g, e.x, e.y, 14, 30, 170);
          g.shake = Math.max(g.shake, 4);
        }
      }
    }
    // ☠️ kostlivec: schopnost povstat řeší killEnemy (jeden restart za život)
    // 🔥 sopkaš: za sebou nechává hořící stopu z malých zón
    if (e.kind === 15) {
      e.shootCd -= dt;
      if (e.shootCd <= 0 && d < 700) {
        e.shootCd = 0.55;
        g.telegraphs.push({ x: e.x, y: e.y, r: 22, t: 0, dur: 0.85, dmg: Math.max(4, e.dmg * 0.35) });
      }
    }
    // ❄️ ledovec: drží odstup a střílí mrazivé koule, které hrdinu zpomalí
    if (e.kind === 16) {
      if (d < 200) {
        dirx = -dirx;
        diry = -diry;
      }
      e.shootCd -= dt;
      if (e.shootCd <= 0 && d < 560) {
        e.shootCd = 3.8;
        const fa = Math.atan2(dy, dx);
        g.eBolts.push({ x: e.x, y: e.y, vx: Math.cos(fa) * 230, vy: Math.sin(fa) * 230, life: 4, dmg: e.dmg, slow: true });
        addText(g, e.x, e.y - e.r - 10, "❄️", 30, 15);
      }
    }
    e.x += (dirx * sp + e.kbx) * dt;
    e.y += (diry * sp + e.kby) * dt;
    e.kbx *= 0.86;
    e.kby *= 0.86;
    // 🌬️ silný vítr postrkuje i nepřátele
    if (g.weather === "wind") {
      e.x += Math.cos(g.windA) * 26 * dt;
      e.y += Math.sin(g.windA) * 26 * dt;
    }
    e.x = Math.max(e.r, Math.min(ARENA - e.r, e.x));
    e.y = Math.max(e.r, Math.min(ARENA - e.r, e.y));
    // kontakt s hrdinou (duch ve fázi prolnul skrz a neubližuje, zahrabaný jezevec taky ne)
    const rr = e.r + 13;
    const phased6 = e.kind === 6 && !e.boss && e.lungeT > 0;
    const subbed13 = (e.subT ?? 0) > 0;
    if (!phased6 && !subbed13 && dist2(e.x, e.y, h.x, h.y) < rr * rr && h.invuln <= 0) {
      damageHero(g, e.dmg);
      // 🩸 netopýr-upír: při kousnutí se napije a vzpamatuje se
      if (e.kind === 1 && !e.dead) {
        e.hp = Math.min(e.maxHp, e.hp + 6);
        burst(g, e.x, e.y, 5, 350, 110);
        addText(g, e.x, e.y - e.r - 10, "🩸", 45, 14);
      }
      // 🐝 vosa: žihadlo otráví - jed tická pár sekund
      if (e.kind === 12) {
        h.poisT = 3;
        addText(g, h.x, h.y - 34, "🤢 OTRAVEN!", 100, 14);
      }
    }
    // ⚙️ nepřátelé ničí turetky dotykem (v noci dvakrát rychleji)
    if (!phased6 && !subbed13 && g.turrets.length > 0) {
      for (const tu of g.turrets) {
        const trr = e.r + 9;
        if (dist2(e.x, e.y, tu.x, tu.y) < trr * trr) {
          damageTurret(g, tu, e.dmg * (g.night ? 2 : 1) * 0.8 * dt);
        }
      }
    }
  }
  // ⏱ na bosse máš 3:20 - čas vyprší = automatická smrt
  let bossAlive = false;
  for (const e of g.enemies) {
    if (!e.dead && e.boss) {
      bossAlive = true;
      break;
    }
  }
  if (bossAlive && g.bossT > 0) {
    g.bossT -= dt;
    if (g.bossT <= 0) {
      g.bossT = 20; // po oživení fénixem zbývá alespoň chvíle
      addText(g, h.x, h.y - 40, "⏰ ČAS VYPRŠEL!", 0, 22);
      damageHero(g, 99999);
    }
  }

  // telegrafy bossů - za časového limitu projektily dopadnou
  for (let i = g.telegraphs.length - 1; i >= 0; i--) {
    const tl = g.telegraphs[i];
    tl.t += dt;
    if (tl.t >= tl.dur) {
      // 💥 dopad - výbuch
      burst(g, tl.x, tl.y, 14, 0, 240);
      burst(g, tl.x, tl.y, 8, 30, 160);
      g.shake = Math.max(g.shake, 6);
      if (g.gtime - (g.lastBoomSfx ?? 99) > 0.18) {
        g.lastBoomSfx = g.gtime;
        playSfx(g, "boom");
      }
      // 💣 přátelská bomba (náletek vojáka) - pálení platí netvorům, ne tobě
      if (tl.friendly) {
        // 🕸️ jen nepřátelé v dosahu zóny
        gridEach(tl.x, tl.y, tl.r + 120, (e) => {
          if (e.dead || (e.immT ?? 0) > 0 || (e.subT ?? 0) > 0) return;
          if (dist2(e.x, e.y, tl.x, tl.y) < (tl.r + e.r) * (tl.r + e.r)) {
            e.hp -= tl.dmg;
            e.flash = 0.1;
            const kd = Math.hypot(e.x - tl.x, e.y - tl.y) || 1;
            e.kbx += ((e.x - tl.x) / kd) * 200;
            e.kby += ((e.y - tl.y) / kd) * 200;
            if (e.hp <= 0) killEnemy(g, e);
          }
        });
      } else {
        if (h.invuln <= 0 && dist2(h.x, h.y, tl.x, tl.y) < (tl.r + 13) * (tl.r + 13)) {
          damageHero(g, tl.dmg);
        }
        // ⚙️ výbuch zóny rozstřílí i turetky v dosahu
        for (const tu of g.turrets) {
          if (dist2(tu.x, tu.y, tl.x, tl.y) < (tl.r + 10) * (tl.r + 10)) {
            damageTurret(g, tu, tl.dmg);
          }
        }
      }
      g.telegraphs.splice(i, 1);
    }
  }
  // nepřátelské koule (šaman)
  for (let i = g.eBolts.length - 1; i >= 0; i--) {
    const b = g.eBolts[i];
    // ⛏️ krumpáč-bumerang: nejdřív se brzdí, pak se vrací k minerovi, který ho chytne
    if (b.boom !== undefined) {
      b.boom += dt;
      if (b.boom < 1.25) {
        const f = 1 - 0.85 * dt;
        b.vx *= f;
        b.vy *= f;
      } else {
        const own = g.enemies.find((oe) => oe.id === b.oid && !oe.dead);
        if (own) {
          const oa = Math.atan2(own.y - b.y, own.x - b.x);
          const osp = Math.min(380, 140 + (b.boom - 1.25) * 300);
          b.vx = Math.cos(oa) * osp;
          b.vy = Math.sin(oa) * osp;
          if (dist2(b.x, b.y, own.x, own.y) < (own.r + 8) * (own.r + 8)) b.life = 0;
        } else {
          b.life = Math.min(b.life, 0.4);
        }
      }
    }
    // lehce naváděný projektil - pomalé přitáčení k hrdinovi (uhýbat jde)
    if (b.home) {
      const hd = Math.hypot(h.x - b.x, h.y - b.y) || 1;
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const tA = Math.atan2(h.y - b.y, h.x - b.x);
      const cA = Math.atan2(b.vy, b.vx);
      let dA = tA - cA;
      while (dA > Math.PI) dA -= Math.PI * 2;
      while (dA < -Math.PI) dA += Math.PI * 2;
      const turn = Math.max(-2.2 * dt, Math.min(2.2 * dt, dA));
      b.vx = Math.cos(cA + turn) * sp;
      b.vy = Math.sin(cA + turn) * sp;
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    let remove = b.life <= 0 || b.x < 0 || b.x > ARENA || b.y < 0 || b.y > ARENA;
    if (!remove && h.invuln <= 0 && dist2(b.x, b.y, h.x, h.y) < 17 * 17) {
      damageHero(g, b.dmg);
      // ❄️ mrazivá koule ledovce - hrdinu na chvíli zpomalí
      if (b.slow) {
        h.slowT = Math.max(h.slowT, 2.4);
        burst(g, b.x, b.y, 8, 195, 130);
        addText(g, h.x, h.y - 34, "❄️ ZPOMALEN!", 195, 14);
      }
      burst(g, b.x, b.y, 8, 195, 150);
      remove = true;
    }
    if (remove) {
      g.eBolts[i] = g.eBolts[g.eBolts.length - 1];
      g.eBolts.pop();
    }
  }
  // jednoduchá separace, aby se nehrnuli do jednoho bodu
  const es = g.enemies;
  // při zácpě přes 110 nepřátel řešíme jen bossy/minibossy (O(n²) by zaseklo FPS)
  const heavy = es.length > 110;
  // 🕸️ mřížka se přestaví podle aktuálních pozic - separace běží jen mezi sousedy
  buildGrid(g);
  for (let i = 0; i < es.length; i++) {
    const a = es[i];
    if (a.dead) continue;
    gridEach(a.x, a.y, a.r + 100, (b) => {
      // každý pár jen jednou (a.id < b.id) a bez přesahu přes hranice buněk
      if (b === a || b.dead || a.id >= b.id) return;
      if (heavy && !a.boss && !a.minib && !b.boss && !b.minib) return;
      const rr = a.r + b.r;
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d2 = dx * dx + dy * dy;
      if (d2 > 0.01 && d2 < rr * rr) {
        const d = Math.sqrt(d2);
        const push = ((rr - d) / d) * 0.4;
        a.x -= dx * push;
        a.y -= dy * push;
        b.x += dx * push;
        b.y += dy * push;
      }
    });
  }
  for (let i = es.length - 1; i >= 0; i--) {
    if (es[i].dead) es.splice(i, 1);
  }

  // orby: magnet + sběr
  const magnetR = HERO.magnet * (1 + g.stats.magnetMul);
  const m2 = magnetR * magnetR;
  const magAll = g.magT > 0;
  for (let i = g.orbs.length - 1; i >= 0; i--) {
    const o = g.orbs[i];
    const dx = h.x - o.x;
    const dy = h.y - o.y;
    const d2 = dx * dx + dy * dy;
    if (magAll || d2 < m2) {
      const d = Math.sqrt(d2) || 1;
      o.vx += (dx / d) * (magAll ? 1500 : 900) * dt;
      o.vy += (dy / d) * (magAll ? 1500 : 900) * dt;
    }
    o.x += o.vx * dt;
    o.y += o.vy * dt;
    o.vx *= 0.94;
    o.vy *= 0.94;
    if (d2 < 24 * 24) {
      if (o.pk === 1) {
        // ❤️ srdíčko
        h.hp = Math.min(h.maxHp, h.hp + 35);
        addText(g, h.x, h.y - 26, "+35 HP", 130, 16);
        burst(g, o.x, o.y, 6, 130, 90);
        playSfx(g, "ding");
      } else if (o.pk === 2) {
        // 💣 bomba - velký plošný výbuch, okruh označí dosah
        const br = 260;
        const bdmg = 50 + g.level * 8;
        g.shake = Math.max(g.shake, 12);
        playSfx(g, "boom");
        burst(g, h.x, h.y, 20, 25, 280);
        burst(g, h.x, h.y, 12, 48, 220);
        // okruh ohně kolem hrdiny vymezuje celý dosah výbuchu
        for (let p = 0; p < 36; p++) {
          const pa = (p / 36) * Math.PI * 2;
          g.particles.push({
            x: h.x + Math.cos(pa) * (br - 8),
            y: h.y + Math.sin(pa) * (br - 8),
            vx: Math.cos(pa) * 140,
            vy: Math.sin(pa) * 140,
            life: 0.55,
            maxLife: 0.55,
            r: 3.2,
            hue: 25,
          });
        }
        addText(g, h.x, h.y - 28, "💣 BUM!", 25, 18);
        // 💥 mohutná dvojitá rázová vlna výbuchu
        shock(g, h.x, h.y, br + 40, 25, 0.6, 12, 0.3);
        shock(g, h.x, h.y, br * 0.55, 40, 0.45, 7, 0.2);
        // 🕸️ výbuch zasáhne jen nepřátele v dosahu (mřížka místo celé mapy)
        gridEach(h.x, h.y, br + 100, (e) => {
          if (e.dead) return;
          if (e.immT && e.immT > 0) return;
          const dd = dist2(e.x, e.y, h.x, h.y);
          if (dd < br * br) {
            e.hp -= bdmg * (1 - Math.sqrt(dd) / (br * 1.4));
            e.flash = 0.09;
            if (e.hp <= 0) killEnemy(g, e);
          }
        });
      } else if (o.pk === 3) {
        // 🧲 magnet - vysaje všechny koule z celé mapy
        g.magT = 2.2;
        addText(g, h.x, h.y - 28, "🧲 MAGNET!", 210, 18);
        burst(g, h.x, h.y, 14, 210, 160);
        playSfx(g, "magnet");
        // modrá pulzující vlna přitahuje koule k hrdinovi
        shock(g, h.x, h.y, 420, 210, 0.7, 6, 0.1);
      } else {
        // 🔥 XP s combo bonusem
        g.xp += o.xp * g.xpMul * comboXpMul(g);
        playSfx(g, "orb");
        burst(g, o.x, o.y, 4, 48, 90);
      }
      g.orbs.splice(i, 1);
    }
  }

  // endgame: nepřátelé na mapě sílí - +2 % životů i rychlosti každých 14 s
  g.growT -= dt;
  if (g.growT <= 0) {
    g.growT = 14;
    for (const e of g.enemies) {
      if (e.dead) continue;
      e.maxHp *= 1.02;
      e.hp *= 1.02;
      // ⚖️ rychlost roste jen do stropu - ať endgame nepřátelé neběží nadzvukově
      if (e.speed < 230) e.speed *= 1.02;
    }
  }

  // spawn ředitel (během bosse se běžní nepřátelé nerozmnožují; déšť = rychlejší porod)
  g.spawnT -= dt;
  const interval = Math.max(0.12, ((1.05 - g.time * 0.005) / 3) * (g.weather === "rain" ? 0.6 : 1));
  if (g.spawnT <= 0 && g.enemies.length < (g.time > 600 ? 60 : 80) && !g.arena.active) {
    g.spawnT = interval;
    spawnEnemy(g);
    // od začátku bývá živo - dvojité spawny s rostoucí šancí
    if (Math.random() < Math.min(0.9, 0.3 + g.time * 0.003)) spawnEnemy(g);
  }

  // 🌟 elitní vlna - po 3. minutě každých 35 s přibude skupina extra silných nepřátel (pakt lovce častěji)
  if (g.time > 180 && !g.arena.active) {
    g.waveT -= dt;
    if (g.waveT <= 0) {
      g.waveT = g.pactTaken.includes("pact_hunter") ? 22 : 35;
      spawnEliteWave(g);
      g.shake = Math.max(g.shake, 6);
    }
  }

  // boss každých 90 s
  if (g.time >= g.nextBoss) {
    g.nextBoss += 90;
    g.bossWarned = false;
    spawnBoss(g);
  }

  // ⚠️ varování 10 s před bossem - ať tě nezaskočí zelený nebe
  if (!g.bossWarned && !g.arena.active && g.nextBoss - g.time <= 10) {
    g.bossWarned = true;
    addText(g, h.x, h.y - 70, "⚠️ BOSS SE BLÍŽÍ!", 0, 17);
    playSfx(g, "elite");
  }

  // 🌟 mini-boss každých 45 s (ne uprostřed souboje v aréně)
  if (g.time >= g.nextMini && !g.arena.active) {
    g.nextMini += 45;
    spawnMini(g);
  }

  // bedny z bosse: přitahují se a sbírají
  const crateMagR = HERO.magnet * (1 + g.stats.magnetMul);
  const cmr2 = crateMagR * crateMagR;
  for (let i = g.crates.length - 1; i >= 0; i--) {
    const c = g.crates[i];
    c.t += dt;
    const cdx = h.x - c.x;
    const cdy = h.y - c.y;
    const cd2 = cdx * cdx + cdy * cdy;
    if (cd2 < cmr2 && cd2 > 1) {
      const cd = Math.sqrt(cd2);
      c.x += (cdx / cd) * 220 * dt;
      c.y += (cdy / cd) * 220 * dt;
    }
    if (cd2 < 26 * 26) {
      g.crates.splice(i, 1);
      g.crateOpen = true;
      playSfx(g, "crate");
      burst(g, c.x, c.y, 16, 48, 190);
      shock(g, c.x, c.y, 140, 48, 0.45, 6, 0.18);
      addText(g, c.x, c.y - 30, "📦 +5 upgradů!", 48, 17);
      // 🔄 bedna má 35% šanci přisít reroll - jinak by byl za celý run jen jeden
      if (!g.sandbox && Math.random() < 0.35) {
        g.rerolls += 1;
        addText(g, c.x, c.y - 48, "🔄 +1 reroll!", 195, 14);
        playSfx(g, "ding");
      }
    }
  }

  // levely
  while (g.xp >= g.need) {
    g.xp -= g.need;
    g.level += 1;
    g.need = xpNeed(g.level);
    g.pending += 1;
    // 🌟 level-up záblesk - zlatý gejzír, vlna světla a doušek adrenalinu
    burst(g, h.x, h.y, 22, 48, 230);
    shock(g, h.x, h.y, 180, 48, 0.55, 8, 0.22);
    addText(g, h.x, h.y - 44, "⭐ LEVEL UP!", 90, 19);
    playSfx(g, "levelup");
    g.shake = Math.max(g.shake, 2);
  }

  // 🌦️ POČASÍ - náhodné epizody se zvláštními pravidly (déšť/bouřka/vítr)
  g.weatherT -= dt;
  if (g.weatherT <= 0) {
    if (g.weather === "") {
      if (g.time > 60 && Math.random() < 0.45) {
        g.weather = ["rain", "storm", "wind"][Math.floor(Math.random() * 3)];
        g.weatherT = 25;
        g.windA = Math.random() * Math.PI * 2;
        g.windT = 1.2;
        addText(g, h.x, h.y - 72, `${WEATHERS[g.weather].emoji} ${WEATHERS[g.weather].name}!`, 210, 19);
        playSfx(g, "weather");
      } else {
        g.weatherT = 30;
      }
    } else {
      g.weather = "";
      g.weatherT = 45 + Math.random() * 30;
      addText(g, h.x, h.y - 60, "🌤️ Vyjasnilo se", 100, 15);
    }
  }
  // ⛈️ bouřka - náhodné blesky bijí kolem hrdiny (telegrafované!)
  if (g.weather === "storm") {
    g.windT -= dt;
    if (g.windT <= 0) {
      g.windT = 1.3;
      const bx = Math.max(30, Math.min(ARENA - 30, h.x + (Math.random() - 0.5) * 560));
      const by = Math.max(30, Math.min(ARENA - 30, h.y + (Math.random() - 0.5) * 560));
      g.telegraphs.push({ x: bx, y: by, r: 36, t: 0, dur: 0.7, dmg: Math.round(12 + g.time * 0.02) });
      burst(g, bx, by, 5, 280, 160);
    }
  }


}

function updateFx(g: Game, dt: number): void {
  g.shake = Math.max(0, g.shake - dt * 26);
  // 💀 závěrečný fade - svět po smrti hrdiny pomalu ztmavne
  if (g.over) g.overT = Math.min(1, g.overT + dt * 0.7);
  // 📣 boss intro banner vydrží 2,6 s a pak tiše zmizí
  if (g.bossIntroT > 0) g.bossIntroT = Math.max(0, g.bossIntroT - dt);
  // ⚔️ švihy meče dožívají krátce
  for (let i = g.slashes.length - 1; i >= 0; i--) {
    const sl = g.slashes[i];
    sl.t += dt;
    if (sl.t >= sl.dur) g.slashes.splice(i, 1);
  }
  // 💥 rázové vlny - expandují a doznívají
  for (let i = g.shocks.length - 1; i >= 0; i--) {
    const sk = g.shocks[i];
    sk.t += dt;
    if (sk.t >= sk.dur) g.shocks.splice(i, 1);
  }
  // 💨 duchové stopy za hrdinou při úhybu
  if (g.hero.dashT > 0 && g.particles.length < 150) {
    const p = PART_POOL.pop() || { x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 0, r: 0, hue: 0 };
    p.x = g.hero.x;
    p.y = g.hero.y + 2;
    p.vx = 0;
    p.vy = 0;
    p.life = 0.28;
    p.maxLife = 0.28;
    p.r = 4.5;
    p.hue = 200;
    g.particles.push(p);
  }
  for (let i = g.particles.length - 1; i >= 0; i--) {
    const p = g.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.985;
    p.vy *= 0.985;
    p.life -= dt;
    if (p.life <= 0) {
      // ♻️ vrátit do bazénu a swap-popnout bez splice
      if (PART_POOL.length < 200) PART_POOL.push(p);
      g.particles[i] = g.particles[g.particles.length - 1];
      g.particles.pop();
    }
  }
  for (let i = g.texts.length - 1; i >= 0; i--) {
    const t = g.texts[i];
    t.y -= 34 * dt;
    t.life -= dt;
    if (t.life <= 0) g.texts.splice(i, 1);
  }
}

function drawHero(ctx: CanvasRenderingContext2D, g: Game): void {
  const h = g.hero;
  const t = g.gtime;
  const cls = CLASSES.find((c) => c.id === g.cls) || CLASSES[0];
  const col = cls.color;
  const bob = Math.sin(t * 7) * 1.2;
  const y = h.y + bob;
  const ex = Math.cos(h.angle);
  const ey = Math.sin(h.angle);
  // stín
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(h.x, h.y + 13, 12, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // 🎨 originální vzhled postavy - každá classa má úplně jiné tělo, hlavu i detaily
  const perpX = Math.cos(h.angle + Math.PI / 2);
  const perpY = Math.sin(h.angle + Math.PI / 2);
  const faceY = y - 4;
  if (cls.id === "archer") {
    // 🏹 LUČIŠTNÍK - tmavě zelený plášť, kožená tunika, toulec se šípy, kapuce s červeným pérem
    const backX = h.x - ex * (17 + Math.sin(t * 6) * 3);
    const backY = y - ey * (17 + Math.sin(t * 6) * 3);
    ctx.fillStyle = "#14532d";
    ctx.beginPath();
    ctx.moveTo(h.x + perpX * 10, y + perpY * 10);
    ctx.lineTo(backX + perpX * 7, backY + perpY * 7);
    ctx.lineTo(backX - perpX * 7, backY - perpY * 7);
    ctx.lineTo(h.x - perpX * 10, y - perpY * 10);
    ctx.closePath();
    ctx.fill();
    // toulec za zády s červenobílými péry šípů
    ctx.save();
    ctx.translate(h.x - ex * 11, y - ey * 11);
    ctx.rotate(h.angle);
    ctx.fillStyle = "#6b4226";
    ctx.fillRect(-4, -4, 8, 8);
    ctx.strokeStyle = "#3f2413";
    ctx.lineWidth = 1;
    ctx.strokeRect(-4, -4, 8, 8);
    ctx.fillStyle = "#dc2626";
    ctx.beginPath();
    ctx.moveTo(-6, -3);
    ctx.lineTo(-2, -1.5);
    ctx.lineTo(-6, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#f8fafc";
    ctx.beginPath();
    ctx.moveTo(-6, 1);
    ctx.lineTo(-2, 2);
    ctx.lineTo(-6, 3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    // tělo - kožená tunika (špičatý střih, žádný kruh)
    const bg = ctx.createRadialGradient(h.x - 4, y - 5, 2, h.x, y, 14);
    bg.addColorStop(0, "#8a6b3d");
    bg.addColorStop(1, "#4a3520");
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(h.x, y - 10);
    ctx.quadraticCurveTo(h.x + 9, y - 6, h.x + 8, y + 1);
    ctx.quadraticCurveTo(h.x + 7, y + 7, h.x + 10, y + 13);
    ctx.lineTo(h.x - 10, y + 13);
    ctx.quadraticCurveTo(h.x - 7, y + 7, h.x - 8, y + 1);
    ctx.quadraticCurveTo(h.x - 9, y - 6, h.x, y - 10);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // šikmý popruh toulce přes hruď
    ctx.strokeStyle = "#3f2413";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(h.x + perpX * 10, y + perpY * 10 - 3);
    ctx.lineTo(h.x - perpX * 10, y - perpY * 10 + 5);
    ctx.stroke();
    // hlava - obličej + špičatá kapuce
    ctx.fillStyle = "#f5d0a9";
    ctx.beginPath();
    ctx.arc(h.x, faceY, 6.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#166534";
    ctx.beginPath();
    ctx.arc(h.x, faceY - 1, 7.8, Math.PI * 0.9, Math.PI * 2.1);
    ctx.fill();
    ctx.strokeStyle = "#22c55e";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(h.x, faceY - 1, 7.8, Math.PI * 0.9, Math.PI * 2.1);
    ctx.stroke();
    // červené pero na kapuci (vlní se s časem)
    ctx.strokeStyle = "#dc2626";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(h.x - ex * 3 - perpX * 4, faceY - 7);
    ctx.quadraticCurveTo(h.x - ex * 8 - perpX * 7, faceY - 11 + Math.sin(t * 5) * 1.5, h.x - ex * 11 - perpX * 8, faceY - 8);
    ctx.stroke();
  } else if (cls.id === "soldier") {
    // 🎖️ VOJÁK - žádný plášť: uniforma, ocelová přilbice s okrajem, zlaté epolety
    // tělo - hranatá uniforma (šestiúhelník, žádný kruh)
    const bg = ctx.createRadialGradient(h.x - 4, y - 5, 2, h.x, y, 14);
    bg.addColorStop(0, "#3d5a80");
    bg.addColorStop(1, "#16233a");
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(h.x, y - 11);
    ctx.lineTo(h.x + 9, y - 4);
    ctx.lineTo(h.x + 7, y + 9);
    ctx.lineTo(h.x, y + 12);
    ctx.lineTo(h.x - 7, y + 9);
    ctx.lineTo(h.x - 9, y - 4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // ocelová náprsní destička
    ctx.fillStyle = "#94a3b8";
    ctx.beginPath();
    ctx.moveTo(h.x + perpX * 8, y + perpY * 8 - 2);
    ctx.lineTo(h.x + ex * 8, y + ey * 8 + 3);
    ctx.lineTo(h.x - perpX * 8, y - perpY * 8 - 2);
    ctx.lineTo(h.x - ex * 4, y - ey * 4 - 6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 1;
    ctx.stroke();
    // zlaté epolety na ramenech
    for (const side of [-1, 1]) {
      const sx = h.x + perpX * side * 11;
      const sy = y + perpY * side * 11;
      ctx.fillStyle = "#b45309";
      ctx.beginPath();
      ctx.arc(sx, sy, 4.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(sx, sy, 4.2, 0, Math.PI * 2);
      ctx.stroke();
    }
    // hlava - obličej + ocelová přilbice s okrajem a podbradkovým řemínkem
    ctx.fillStyle = "#f5d0a9";
    ctx.beginPath();
    ctx.arc(h.x, faceY, 6.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#6b7280";
    ctx.beginPath();
    ctx.arc(h.x, faceY - 1, 7.5, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#9ca3af";
    ctx.beginPath();
    ctx.ellipse(h.x, faceY - 1.5, 9, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#4b5563";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(h.x - 7, faceY + 2);
    ctx.lineTo(h.x + 7, faceY + 2);
    ctx.stroke();
    // hvězda na přilbici
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.arc(h.x, faceY - 6, 1.4, 0, Math.PI * 2);
    ctx.fill();
  } else if (cls.id === "ninja") {
    // 🥷 NINJA - celočerný stealth oblek, plná maska, čelenka se dvěma vlajícími pásky
    // úzká vlnící se šála za krkem
    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.moveTo(h.x + perpX * 4, y - 6 + perpY * 4);
    ctx.quadraticCurveTo(h.x - ex * 14, y - 8 - ey * 14 + Math.sin(t * 8) * 3, h.x - ex * 24 - perpX * 2, y - 10 - ey * 24 + Math.sin(t * 8 + 1) * 4);
    ctx.lineTo(h.x - ex * 24 + perpX * 1, y - 8 - ey * 24 + Math.sin(t * 8 + 1) * 4);
    ctx.quadraticCurveTo(h.x - ex * 13, y - 6 - ey * 13 + Math.sin(t * 8) * 3, h.x - perpX * 4, y - 4 - perpY * 4);
    ctx.closePath();
    ctx.fill();
    // tělo - aerodynamický diamant nasměrovaný proti míření (žádný kruh)
    const bg = ctx.createRadialGradient(h.x - 4, y - 5, 2, h.x, y, 14);
    bg.addColorStop(0, "#2b3448");
    bg.addColorStop(1, "#0b101d");
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(h.x - ex * 16, y - ey * 16);
    ctx.lineTo(h.x + perpX * 9 - ex * 2, y + perpY * 9 - ey * 2);
    ctx.lineTo(h.x + ex * 8, y + ey * 8);
    ctx.lineTo(h.x - perpX * 9 - ex * 2, y - perpY * 9 - ey * 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.stroke();
    // šikmý obinouc přes hruď
    ctx.strokeStyle = "#0b101d";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(h.x + perpX * 10, y + perpY * 10 - 2);
    ctx.lineTo(h.x - perpX * 10, y - perpY * 10 + 4);
    ctx.stroke();
    // hlava - plná maska, vidět jsou jen oči
    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.arc(h.x, faceY, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#0b101d";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(h.x, faceY, 7, 0, Math.PI * 2);
    ctx.stroke();
    // čelenka v barvě classy + dva vlající pásky
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.rect(h.x - 7, faceY - 4, 14, 3.5);
    ctx.fill();
    const rb1 = Math.sin(t * 9) * 4;
    const rb2 = Math.sin(t * 9 + 1.4) * 5;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(h.x - ex * 6 - perpX * 5, faceY - 2.5);
    ctx.quadraticCurveTo(h.x - ex * 14, faceY - 6 + rb1, h.x - ex * 22 - perpX * 3, faceY - 2 + rb1 * 1.2);
    ctx.stroke();
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(h.x - ex * 6 + perpX * 5, faceY - 2.5);
    ctx.quadraticCurveTo(h.x - ex * 13, faceY - 1 + rb2, h.x - ex * 20 + perpX * 4, faceY + 2 + rb2);
    ctx.stroke();
  } else if (cls.id === "knight") {
    // ⚔️ RYTÍŘ - plná plátová zbroj s nity, hranaté epolety, velká helma s vizírou a chocholem
    // širší tmavý plášť
    const backX = h.x - ex * (19 + Math.sin(t * 5) * 3);
    const backY = y - ey * (19 + Math.sin(t * 5) * 3);
    ctx.fillStyle = "#312e81";
    ctx.beginPath();
    ctx.moveTo(h.x + perpX * 12, y + perpY * 12);
    ctx.lineTo(backX + perpX * 9, backY + perpY * 9);
    ctx.lineTo(backX - perpX * 9, backY - perpY * 9);
    ctx.lineTo(h.x - perpX * 12, y - perpY * 12);
    ctx.closePath();
    ctx.fill();
    // tělo - mohutné brnění (osmiúhelník, žádný kruh)
    const bg = ctx.createRadialGradient(h.x - 4, y - 5, 2, h.x, y, 14);
    bg.addColorStop(0, "#cbd5e1");
    bg.addColorStop(1, "#5b6774");
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(h.x, y - 12);
    ctx.lineTo(h.x + 10, y - 5);
    ctx.lineTo(h.x + 10, y + 6);
    ctx.lineTo(h.x + 5, y + 13);
    ctx.lineTo(h.x - 5, y + 13);
    ctx.lineTo(h.x - 10, y + 6);
    ctx.lineTo(h.x - 10, y - 5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // nity po obvodu brnění
    ctx.fillStyle = "#334155";
    for (const na of [0.6, 2.1, 3.6, 5.1]) {
      ctx.beginPath();
      ctx.arc(h.x + Math.cos(na) * 10, y + Math.sin(na) * 10, 1, 0, Math.PI * 2);
      ctx.fill();
    }
    // hranaté plátové nárameníky
    for (const side of [-1, 1]) {
      const sx = h.x + perpX * side * 12;
      const sy = y + perpY * side * 12;
      ctx.fillStyle = "#94a3b8";
      ctx.beginPath();
      ctx.moveTo(sx - perpX * side * 5, sy - perpY * side * 5);
      ctx.lineTo(sx + ex * 5, sy + ey * 5);
      ctx.lineTo(sx + perpX * side * 5, sy + perpY * side * 5);
      ctx.lineTo(sx - ex * 3, sy - ey * 3);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // hlava - velká helma s vertikální vizírovou škvírou
    ctx.fillStyle = "#aab4c2";
    ctx.beginPath();
    ctx.moveTo(h.x - 7, faceY + 3);
    ctx.lineTo(h.x - 7, faceY - 5);
    ctx.quadraticCurveTo(h.x, faceY - 12, h.x + 7, faceY - 5);
    ctx.lineTo(h.x + 7, faceY + 3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(h.x - 1.1, faceY - 3.5, 2.2, 5);
    // chochol v barvě classy (vlní se)
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(h.x - ex * 2, faceY - 9);
    ctx.quadraticCurveTo(h.x - ex * 7, faceY - 14 + Math.sin(t * 6) * 1.5, h.x - ex * 12, faceY - 11 + Math.sin(t * 6) * 2);
    ctx.stroke();
  } else if (cls.id === "vampire") {
    // 🧛 UPÍR - černý plášť s rudou podšívkou, vysoký límec, bílá tvář s tesáky
    ctx.fillStyle = "#18181b";
    ctx.beginPath();
    ctx.moveTo(h.x - 9, y - 2);
    ctx.lineTo(h.x - 13, y + 15);
    ctx.lineTo(h.x, y + 12);
    ctx.lineTo(h.x + 13, y + 15);
    ctx.lineTo(h.x + 9, y - 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#7f1d1d";
    ctx.beginPath();
    ctx.moveTo(h.x - 6, y);
    ctx.lineTo(h.x - 9, y + 13);
    ctx.lineTo(h.x, y + 11);
    ctx.lineTo(h.x + 9, y + 13);
    ctx.lineTo(h.x + 6, y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#18181b";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(h.x - 6, faceY - 4);
    ctx.lineTo(h.x - 8, faceY - 10);
    ctx.moveTo(h.x + 6, faceY - 4);
    ctx.lineTo(h.x + 8, faceY - 10);
    ctx.stroke();
    ctx.fillStyle = "#f5f0e8";
    ctx.beginPath();
    ctx.arc(h.x, faceY - 2, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#18181b";
    ctx.beginPath();
    ctx.arc(h.x, faceY - 6.5, 5.2, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(h.x - 1.6, faceY - 6.5);
    ctx.lineTo(h.x + 1.6, faceY - 6.5);
    ctx.lineTo(h.x, faceY - 3.2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillRect(h.x - 2.4, faceY + 1, 1.1, 2.6);
    ctx.fillRect(h.x + 1.3, faceY + 1, 1.1, 2.6);
  } else if (cls.id === "druid") {
    // 🌿 DRUID - zelená kapucovitá róba, lístková spona, plnovous
    const hem2 = Math.sin(t * 4) * 1.4;
    ctx.fillStyle = "#3f6212";
    ctx.beginPath();
    ctx.moveTo(h.x - 8, y - 2);
    ctx.quadraticCurveTo(h.x - 12, y + 8, h.x - 10 + hem2, y + 14);
    ctx.quadraticCurveTo(h.x, y + 18, h.x + 10 - hem2, y + 14);
    ctx.quadraticCurveTo(h.x + 12, y + 8, h.x + 8, y - 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#4d7c0f";
    ctx.beginPath();
    ctx.moveTo(h.x - 6, faceY - 3);
    ctx.quadraticCurveTo(h.x, faceY - 12, h.x + 6, faceY - 3);
    ctx.quadraticCurveTo(h.x, faceY - 6.5, h.x - 6, faceY - 3);
    ctx.fill();
    ctx.fillStyle = "#e7d8b9";
    ctx.beginPath();
    ctx.arc(h.x, faceY - 1, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#a16207";
    ctx.beginPath();

    ctx.quadraticCurveTo(h.x, faceY + 5, h.x - 4.4, faceY + 2);
    ctx.closePath();
    ctx.fill();
    // vysoký klobouk se širokým okrajem
    ctx.fillStyle = "#5b21b6";
    ctx.beginPath();
    ctx.moveTo(h.x - 7.5, faceY - 4);
    ctx.lineTo(h.x - 4, faceY - 15);
    ctx.quadraticCurveTo(h.x, faceY - 17, h.x + 4, faceY - 15);
    ctx.lineTo(h.x + 7.5, faceY - 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#6d28d9";
    ctx.fillRect(h.x - 8.6, faceY - 4.8, 17.2, 2);
    // zlatá hvězda na klobouku

    // ✨ runa krouží kolem mága

    ctx.fill();
  }
  // svítící oči ve směru míření - barva podle classy, rytíř má vizírové škvíry
  const eyeCol =
    cls.id === "knight" ? "#93c5fd" : cls.id === "ninja" ? "#f8fafc" : cls.id === "mage" ? "#c4b5fd" : cls.id === "soldier" ? "#1e293b" : cls.id === "vampire" ? "#ef4444" : cls.id === "druid" ? "#bef264" : cls.id === "engineer" ? "#fbbf24" : "#fde68a";
  for (const side of [-0.45, 0.45]) {

    }
  }
  // zbraň ve směru míření - každá classa má svůj vzhled

  const draw = w0 ? w0.cd / (1 / rate) : 1;
  const pull = Math.max(0, 1 - draw); // 0 po výstřelu → 1 před výstřelem
  const kick = Math.max(0, 1 - (1 - draw) / 0.25); // 1 těsně po výstřelu
  const bx = h.x + ex * 13;
  const by = y + ey * 13;
  if (cls.id === "archer") {
    // 🏹 lučištník - luk s omotanou rukojetí

    ctx.lineWidth = 1;
    ctx.beginPath();

    // 🔮 mág - hůlka s nabíjejícím se krystalem

    ctx.lineTo(tx2, ty2 - 1);

    ctx.fillStyle = "rgba(196,181,253,0.35)";
    ctx.beginPath();
    ctx.arc(tx2, ty2, orbR + 3, 0, Math.PI * 2);

    ctx.beginPath();
    ctx.arc(tx2, ty2, orbR, 0, Math.PI * 2);

  // ❄️ zpomalen mrazivou koulí - ledový věnec
  if (h.slowT > 0) {

// 🖼️ AI vygenerované sprity nepřátel - dva sheety 3×2, kruhový výřez, animace, fallback na vektor
type SpriteCell = { col: number; row: number };
type SpriteSheet = { img: HTMLImageElement; ready: boolean; cells: Partial<Record<number, SpriteCell>>; cols: number; rows: number; cw: number; ch: number };
function makeSheet(url: string, cells: Partial<Record<number, SpriteCell>>): SpriteSheet {
  const s: SpriteSheet = { img: new Image(), ready: false, cells, cols: 3, rows: 2, cw: 0, ch: 0 };
  s.img.onload = () => {
    // 🚀 rozměry buňky spočítáme jednou po nahrání, ne při každém vykreslení
    s.cw = s.img.naturalWidth / s.cols;
    s.ch = s.img.naturalHeight / s.rows;
    s.ready = true;
  };
  s.img.src = url;
  return s;
}

  16: { bobA: 0.08, bobF: 5, sqA: 0.04, sqF: 5 },   // ledovec tuhne
};
function drawEnemySprite(ctx: CanvasRenderingContext2D, e: Enemy, t: number, s: SpriteSheet, c: SpriteCell): void {
  const img = s.img;
  // 🚀 používají se předpočítané rozměry z makeSheet (ne naturalWidth při každém spritu)
  const cw = s.cw || img.naturalWidth / s.cols;
  const chh = s.ch || img.naturalHeight / s.rows;
  const cs = Math.min(cw, chh);
  const sx = c.col * cw + (cw - cs) / 2;
  const sy = c.row * chh + (chh - cs) / 2;
  const a = ANIM[e.kind] || { bobA: 0.05, bobF: 6, sqA: 0.04, sqF: 6 };
  const bob = Math.sin(t * a.bobF + e.id) * e.r * a.bobA;
  const sq = 1 + Math.sin(t * a.sqF + e.id) * a.sqA;
  const size = e.r * 3.1;
  // stín pod postavou
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(e.x, e.y + e.r * 0.85, e.r * 0.85, e.r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  // 👻 duch je vždy průsvitný; flash se řeší dvojím překreslením (levnější než ctx.filter)
  const baseA = e.kind === 6 ? (e.lungeT > 0 && !e.boss ? 0.35 : 0.82 + 0.12 * Math.sin(t * 3 + e.id)) : 1;
  ctx.globalAlpha = baseA;
  ctx.translate(e.x, e.y - e.r * 0.15 + bob);
  ctx.rotate(Math.sin(t * a.bobF * 0.7 + e.id) * 0.03);
  ctx.scale(sq, 1 / sq);
  // kruhový výřez - sprite jako herní žeton ladící s podkladem
  ctx.beginPath();
  ctx.arc(0, 0, e.r * 1.42, 0, Math.PI * 2);
  ctx.save();
  ctx.clip();
  ctx.drawImage(img, sx, sy, cs, cs, -size / 2, -size / 2, size, size);
  // ⚡ zásah = sprite se přisvítí (additivní překreslení místo drahého filtru)
  if (e.flash > 0) {
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.55;
    ctx.drawImage(img, sx, sy, cs, cs, -size / 2, -size / 2, size, size);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = baseA;
  }
  // ❄️ zpomalený - ledový nádech stejným trikem (mrazivý kroužek kreslí vector větev)
  if (e.flash <= 0 && e.slow > 0) {
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.3;
    ctx.drawImage(img, sx, sy, cs, cs, -size / 2, -size / 2, size, size);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = baseA;
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(12,26,12,0.72)";
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
}

// reálné barevné paleti podle druhu - netopýr hnědý srst, mumie plátno, vlk šedohnědý,
// brut zelenkavá kůže, kamenáč šedá skála, rozpulc červený ďáblem, elita tmavý krunýř
const KIND_COLORS: Record<number, { base: string; shade: string; line: string }> = {
  0: { base: "hsl(120,42%,46%)", shade: "hsl(120,50%,30%)", line: "hsl(120,55%,12%)" },
  1: { base: "hsl(24,42%,36%)", shade: "hsl(24,48%,22%)", line: "hsl(24,50%,12%)" },
  2: { base: "#d8cba6", shade: "#b3a37e", line: "#4a3b20" },
  3: { base: "hsl(24,30%,48%)", shade: "hsl(24,38%,30%)", line: "hsl(24,45%,14%)" },
  4: { base: "hsl(95,26%,46%)", shade: "hsl(95,32%,28%)", line: "hsl(95,40%,14%)" },
  5: { base: "hsl(195,55%,52%)", shade: "hsl(195,62%,34%)", line: "hsl(200,70%,14%)" },
  6: { base: "hsl(175,42%,66%)", shade: "hsl(175,52%,44%)", line: "hsl(180,60%,16%)" },
  7: { base: "hsl(35,8%,48%)", shade: "hsl(35,12%,32%)", line: "hsl(35,18%,15%)" },
  8: { base: "hsl(4,72%,50%)", shade: "hsl(4,80%,32%)", line: "hsl(4,90%,16%)" },
  9: { base: "hsl(265,22%,32%)", shade: "hsl(265,30%,20%)", line: "hsl(265,40%,12%)" },
  10: { base: "hsl(20,48%,46%)", shade: "hsl(20,56%,30%)", line: "hsl(20,65%,12%)" },
  11: { base: "hsl(28,35%,40%)", shade: "hsl(28,40%,24%)", line: "hsl(28,45%,12%)" },
  12: { base: "hsl(50,85%,55%)", shade: "hsl(45,90%,38%)", line: "hsl(45,90%,15%)" },
  13: { base: "hsl(25,30%,38%)", shade: "hsl(25,35%,24%)", line: "hsl(25,40%,12%)" },
  14: { base: "#e5e7eb", shade: "#9ca3af", line: "#374151" },
  15: { base: "hsl(18,90%,50%)", shade: "hsl(15,95%,32%)", line: "hsl(10,90%,14%)" },
  16: { base: "hsl(195,70%,70%)", shade: "hsl(200,60%,45%)", line: "hsl(205,60%,18%)" },
  17: { base: "hsl(145,45%,55%)", shade: "hsl(145,50%,35%)", line: "hsl(145,55%,14%)" },
  18: { base: "hsl(300,55%,60%)", shade: "hsl(300,60%,38%)", line: "hsl(300,70%,16%)" },
  19: { base: "hsl(100,32%,44%)", shade: "hsl(100,40%,28%)", line: "hsl(100,45%,12%)" },
};

function drawEnemy(ctx: CanvasRenderingContext2D, e: Enemy, hx: number, hy: number, t: number): void {
  const ea = Math.atan2(hy - e.y, hx - e.x);
  // 🦡 zahrabaný jezevec - vidět je jen hromádka hlíny s odhazovanými hrudkami
  if ((e.subT ?? 0) > 0) {
    ctx.fillStyle = "rgba(70,48,25,0.9)";
    ctx.beginPath();
    ctx.ellipse(e.x, e.y, e.r * 1.05, e.r * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(35,22,10,0.95)";
    ctx.beginPath();
    ctx.ellipse(e.x, e.y - e.r * 0.15, e.r * 0.55, e.r * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    // hrudky hlíny létající za ním (směrem od hrdiny)
    ctx.fillStyle = "rgba(120,90,60,0.55)";
    for (let k = 0; k < 3; k++) {
      const off = ((t * 220 + k * 40 + e.id * 30) % 90) / 90;
      ctx.beginPath();
      ctx.arc(e.x - Math.cos(ea) * off * e.r * 1.8, e.y + Math.sin(k * 2.1 + t * 6) * e.r * 0.3, 2.6 - off, 0, Math.PI * 2);
      ctx.fill();
    }
    // hp bar i pod zemí
    if (e.hp < e.maxHp) {
      const w = e.r * 2;
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(e.x - w / 2, e.y - e.r - 9, w, 4);
      ctx.fillStyle = "#f87171";
      ctx.fillRect(e.x - w / 2, e.y - e.r - 9, w * Math.max(0, e.hp / e.maxHp), 4);
    }
    return;
  }
  // 🖼️ AI sprite, pokud je nahraný - jinak fallback na vektorový model
  const sheet = e.kind <= 5 ? SHEET_A : SHEET_B;
  const cell = sheet.cells[e.kind];
  if (sheet.ready && cell) {
    drawEnemySprite(ctx, e, t, sheet, cell);
  } else {
  // tělo - netopýr drží kulaté tělo, všichni ostatní (i bossové a mini) mají vlastní siluetu z více tvarů
  const pal = !e.boss && !e.minib ? KIND_COLORS[e.kind] : undefined;
  const dark = pal ? pal.line : hsla(e.hue, 80, 18, 1);
  const main = e.flash > 0 ? "#ffffff" : pal ? pal.base : e.kind === 6 ? hsla(e.hue, 75, 62, 0.55) : hsla(e.hue, 75, 50, 1);
  // 🖤 jednotný měkký stín pod siluetou (Brotato/VS styl - každý stojí na zemi)
  if (e.kind !== 6) {
    const flying = e.kind === 1 || e.kind === 13;
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + e.r * 0.85, e.r * (flying ? 0.55 : 0.85), e.r * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  const trace = () => {
    ctx.beginPath();
    if (e.kind === 1) {
      // NETOPÝR - reálný zvrchu: roztácená křídla s prstovitými napínáky, chlupaté tělo, hlava s ušima
      const fl = Math.sin(t * 13 + e.id) * 0.3;
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(ea);
      const base = [2.7, 2.2, 1.75];
      const lens = [e.r * 1.55, e.r * 1.95, e.r * 1.5];
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.rotate(side * fl);
        for (let wi = 0; wi < 3; wi++) {
          const wa = side * base[wi];
          const wx = Math.cos(wa) * lens[wi];
          const wy = Math.sin(wa) * lens[wi];
          if (wi === 0) ctx.moveTo(0, 0);
          ctx.lineTo(wx, wy);
        }
        ctx.lineTo(0, side * e.r * 0.25);
        ctx.closePath();
        ctx.restore();
      }
      // tělo
      ctx.ellipse(-e.r * 0.1, 0, e.r * 0.55, e.r * 0.42, 0, 0, Math.PI * 2);
      // hlava
      ctx.moveTo(e.r * 0.75, 0);
      ctx.arc(e.r * 0.45, 0, e.r * 0.3, 0, Math.PI * 2);
      ctx.restore();
    } else if (e.kind === 2) {
      // MUMIE - hlava, kapsle torza a obě ruce natažené k hrdinovi
      const ca = ea;
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.translate(e.x + Math.cos(ca) * e.r * 0.05 - Math.sin(ca) * side * e.r * 0.45, e.y + Math.sin(ca) * e.r * 0.05 + Math.cos(ca) * side * e.r * 0.45);
        ctx.rotate(ca);
        ctx.rect(-e.r * 0.05, -e.r * 0.13, e.r * 1.25, e.r * 0.26);
        ctx.restore();
      }
      ctx.moveTo(e.x + e.r * 0.55, e.y - e.r * 0.1);
      ctx.arc(e.x, e.y - e.r * 0.1, e.r * 0.55, 0, Math.PI * 2);
      ctx.moveTo(e.x + e.r * 0.6, e.y + e.r * 0.6);
      ctx.ellipse(e.x, e.y + e.r * 0.6, e.r * 0.6, e.r * 0.72, 0, 0, Math.PI * 2);
    } else if (e.kind === 3) {
      // ŠTVANEC - čtyřnohá šelma natočená k hrdinovi: trup, hlava, rypák, uši, nohy, ocas
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(ea);
      ctx.ellipse(-e.r * 0.5, 0, e.r * 0.68, e.r * 0.42, 0, 0, Math.PI * 2);
      ctx.moveTo(e.r * 0.67, -e.r * 0.08);
      ctx.arc(e.r * 0.25, -e.r * 0.08, e.r * 0.42, 0, Math.PI * 2);
      ctx.rect(e.r * 0.5, -e.r * 0.2, e.r * 0.62, e.r * 0.32);
      // uši
      ctx.moveTo(-e.r * 0.05, -e.r * 0.35);
      ctx.lineTo(-e.r * 0.25, -e.r * 0.75);
      ctx.lineTo(-e.r * 0.45, -e.r * 0.3);
      ctx.moveTo(e.r * 0.15, -e.r * 0.42);
      ctx.lineTo(e.r * 0.02, -e.r * 0.85);
      ctx.lineTo(-e.r * 0.18, -e.r * 0.4);
      // čtyři nohy
      for (let lg = 0; lg < 4; lg++) {
        ctx.rect(-e.r * 0.85 + lg * e.r * 0.42, e.r * 0.25, e.r * 0.15, e.r * 0.62);
      }
      // ocas
      ctx.moveTo(-e.r * 1.05, -e.r * 0.05);
      ctx.lineTo(-e.r * 1.5, -e.r * 0.35);
      ctx.lineTo(-e.r * 1.05, -e.r * 0.25);
      ctx.closePath();
      ctx.restore();
    } else if (e.kind === 4) {
      // BRUT - velká hlava, mohutné ramenní hrboly, trup a nohy
      ctx.moveTo(e.x + e.r * 0.62, e.y - e.r * 0.1);
      ctx.arc(e.x, e.y - e.r * 0.1, e.r * 0.62, 0, Math.PI * 2);
      ctx.moveTo(e.x - e.r * 0.22, e.y + e.r * 0.2);
      ctx.arc(e.x - e.r * 0.72, e.y + e.r * 0.2, e.r * 0.5, 0, Math.PI * 2);
      ctx.moveTo(e.x + e.r * 1.22, e.y + e.r * 0.2);
      ctx.arc(e.x + e.r * 0.72, e.y + e.r * 0.2, e.r * 0.5, 0, Math.PI * 2);
      ctx.moveTo(e.x - e.r * 0.55, e.y + e.r * 0.15);
      ctx.lineTo(e.x - e.r * 0.42, e.y + e.r * 0.95);
      ctx.lineTo(e.x + e.r * 0.42, e.y + e.r * 0.95);
      ctx.lineTo(e.x + e.r * 0.55, e.y + e.r * 0.15);
      ctx.closePath();
      ctx.rect(e.x - e.r * 0.45, e.y + e.r * 0.85, e.r * 0.3, e.r * 0.5);
      ctx.rect(e.x + e.r * 0.15, e.y + e.r * 0.85, e.r * 0.3, e.r * 0.5);
    } else if (e.kind === 5) {
      // ŠAMAN - kápě nad hlavou a kuželovitá róba
      ctx.moveTo(e.x - e.r * 0.62, e.y - e.r * 0.15);
      ctx.lineTo(e.x - e.r * 0.5, e.y - e.r * 1.05);
      ctx.lineTo(e.x + e.r * 0.5, e.y - e.r * 1.05);
      ctx.lineTo(e.x + e.r * 0.62, e.y - e.r * 0.15);
      ctx.lineTo(e.x + e.r * 0.75, e.y + e.r * 1.15);
      ctx.lineTo(e.x - e.r * 0.75, e.y + e.r * 1.15);
      ctx.closePath();
    } else if (e.kind === 6) {
      // DUCH - kopule s vlnitým pláštěm dole
      ctx.moveTo(e.x - e.r * 0.85, e.y + e.r * 0.35);
      ctx.quadraticCurveTo(e.x - e.r * 0.95, e.y - e.r * 0.75, e.x, e.y - e.r * 1.05);
      ctx.quadraticCurveTo(e.x + e.r * 0.95, e.y - e.r * 0.75, e.x + e.r * 0.85, e.y + e.r * 0.35);
      ctx.quadraticCurveTo(e.x + e.r * 0.65, e.y + e.r * 0.7, e.x + e.r * 0.45, e.y + e.r * 0.45);
      ctx.quadraticCurveTo(e.x + e.r * 0.25, e.y + e.r * 0.85, e.x, e.y + e.r * 0.5);
      ctx.quadraticCurveTo(e.x - e.r * 0.3, e.y + e.r * 0.9, e.x - e.r * 0.5, e.y + e.r * 0.45);
      ctx.quadraticCurveTo(e.x - e.r * 0.7, e.y + e.r * 0.75, e.x - e.r * 0.85, e.y + e.r * 0.35);
      ctx.closePath();
    } else if (e.kind === 7) {
      // KAMENÁČ - balvan z hran a dva hrboly-ramena
      const iv = 7;
      for (let vi = 0; vi <= iv; vi++) {
        const va = (vi / iv) * Math.PI * 2 - Math.PI / 2;
        const vr = e.r * (0.8 + ((vi * 5 + e.id * 3) % 7) / 20);
        const vx = e.x + Math.cos(va) * vr;
        const vy = e.y + Math.sin(va) * vr * 0.92;
        if (vi === 0) ctx.moveTo(vx, vy);
        else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
      ctx.moveTo(e.x - e.r * 0.45, e.y + e.r * 0.05);
      ctx.arc(e.x - e.r * 0.85, e.y + e.r * 0.05, e.r * 0.4, 0, Math.PI * 2);
      ctx.moveTo(e.x + e.r * 1.25, e.y + e.r * 0.05);
      ctx.arc(e.x + e.r * 0.85, e.y + e.r * 0.05, e.r * 0.4, 0, Math.PI * 2);
      // kamenná hlavička nahoře
      ctx.moveTo(e.x + e.r * 0.38, e.y - e.r * 0.72);
      ctx.arc(e.x, e.y - e.r * 0.72, e.r * 0.38, 0, Math.PI * 2);
    } else if (e.kind === 8) {
      // ROZPULC - kapkovité tělo s kývanci dole
      ctx.moveTo(e.x, e.y - e.r * 1.05);
      ctx.quadraticCurveTo(e.x + e.r * 0.85, e.y - e.r * 0.5, e.x + e.r * 0.62, e.y + e.r * 0.25);
      ctx.quadraticCurveTo(e.x + e.r * 0.5, e.y + e.r * 0.9, e.x + e.r * 0.18, e.y + e.r * 0.85);
      ctx.quadraticCurveTo(e.x, e.y + e.r * 1.15, e.x - e.r * 0.18, e.y + e.r * 0.85);
      ctx.quadraticCurveTo(e.x - e.r * 0.5, e.y + e.r * 0.9, e.x - e.r * 0.62, e.y + e.r * 0.25);
      ctx.quadraticCurveTo(e.x - e.r * 0.85, e.y - e.r * 0.5, e.x, e.y - e.r * 1.05);
      ctx.closePath();
    } else if (e.kind === 9) {
      // ELITA - temný rytíř: přilbice s rohy, nárameníky, plášť a torzo
      ctx.moveTo(e.x + e.r * 0.48, e.y - e.r * 0.25);
      ctx.arc(e.x, e.y - e.r * 0.25, e.r * 0.48, 0, Math.PI * 2);
      // přilbení rohy
      ctx.moveTo(e.x - e.r * 0.38, e.y - e.r * 0.55);
      ctx.lineTo(e.x - e.r * 0.85, e.y - e.r * 1.15);
      ctx.lineTo(e.x - e.r * 0.12, e.y - e.r * 0.62);
      ctx.moveTo(e.x + e.r * 0.38, e.y - e.r * 0.55);
      ctx.lineTo(e.x + e.r * 0.85, e.y - e.r * 1.15);
      ctx.lineTo(e.x + e.r * 0.12, e.y - e.r * 0.62);
      // nárameníky
      ctx.moveTo(e.x - e.r * 0.43, e.y + e.r * 0.05);
      ctx.arc(e.x - e.r * 0.72, e.y + e.r * 0.05, e.r * 0.32, 0, Math.PI * 2);
      ctx.moveTo(e.x + e.r * 1.04, e.y + e.r * 0.05);
      ctx.arc(e.x + e.r * 0.72, e.y + e.r * 0.05, e.r * 0.32, 0, Math.PI * 2);
      // torzo
      ctx.moveTo(e.x - e.r * 0.5, e.y - e.r * 0.1);
      ctx.lineTo(e.x - e.r * 0.42, e.y + e.r * 0.75);
      ctx.lineTo(e.x + e.r * 0.42, e.y + e.r * 0.75);
      ctx.lineTo(e.x + e.r * 0.5, e.y - e.r * 0.1);
      ctx.closePath();
      // plášť s roztřepeným okrajem
      ctx.moveTo(e.x - e.r * 0.5, e.y + e.r * 0.1);
      ctx.lineTo(e.x - e.r * 0.8, e.y + e.r * 0.95);
      ctx.lineTo(e.x - e.r * 0.45, e.y + e.r * 0.75);
      ctx.lineTo(e.x - e.r * 0.2, e.y + e.r * 1.05);
      ctx.lineTo(e.x, e.y + e.r * 0.8);
      ctx.lineTo(e.x + e.r * 0.2, e.y + e.r * 1.05);
      ctx.lineTo(e.x + e.r * 0.45, e.y + e.r * 0.75);
      ctx.lineTo(e.x + e.r * 0.8, e.y + e.r * 0.95);
      ctx.lineTo(e.x + e.r * 0.5, e.y + e.r * 0.1);
      ctx.closePath();
    } else if (e.kind === 10) {
      // DYNAMITER - reálný horník: přilba s lampou, obličej, tělo v kombinéze, nožky
      ctx.moveTo(e.x + e.r * 0.5, e.y - e.r * 0.3);
      ctx.arc(e.x, e.y - e.r * 0.3, e.r * 0.5, 0, Math.PI * 2);
      // kšiltovka-lem přilby
      ctx.rect(e.x - e.r * 0.6, e.y - e.r * 0.38, e.r * 1.2, e.r * 0.14);
      // obličej
      ctx.moveTo(e.x + e.r * 0.38, e.y - e.r * 0.1);
      ctx.arc(e.x, e.y - e.r * 0.02, e.r * 0.38, 0, Math.PI * 2);
      // torzo v kombinéze
      ctx.moveTo(e.x - e.r * 0.45, e.y + e.r * 0.3);
      ctx.lineTo(e.x - e.r * 0.3, e.y + e.r * 1.05);
      ctx.lineTo(e.x + e.r * 0.3, e.y + e.r * 1.05);
      ctx.lineTo(e.x + e.r * 0.45, e.y + e.r * 0.3);
      ctx.closePath();
      ctx.rect(e.x - e.r * 0.26, e.y + e.r * 1.0, e.r * 0.2, e.r * 0.4);
      ctx.rect(e.x + e.r * 0.06, e.y + e.r * 1.0, e.r * 0.2, e.r * 0.4);
    } else if (e.kind === 11) {
